<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reed's Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0c0e12;
      --text-main: #ffffff;
      --text-dim: rgba(255, 255, 255, 0.4);
      --glass-bg: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(255, 255, 255, 0.1);
      --accent: #4fc3f7;
      --accent-glow: rgba(79, 195, 247, 0.25);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      background: radial-gradient(circle at top right, #1a1e26, #000);
      min-height: 100vh;
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: 40px 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .header h1 {
      font-size: clamp(24px, 5vw, 36px);
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .header p {
      color: var(--text-dim);
      font-weight: 300;
      margin-top: 4px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 14px;
      max-width: 720px;
      margin: 0 auto;
    }

    .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 24px 12px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      text-decoration: none;
      color: var(--text-main);
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      aspect-ratio: 1;
    }

    .tile:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 4px 24px var(--accent-glow);
    }

    .tile .icon {
      font-size: 32px;
      line-height: 1;
    }

    .tile .label {
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      line-height: 1.2;
    }

    @media (max-width: 400px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>
  <div class="header">
    <h1>Reed's Lab</h1>
    <p>Pick a challenge</p>
  </div>

  <div class="grid">
    <a href="/iq/ants-apples/index.html" class="tile">
      <span class="icon">🍎</span>
      <span class="label">Ant's Apples</span>
    </a>
    <a href="/iq/ants-algebra/index.html" class="tile">
      <span class="icon">➕</span>
      <span class="label">Ant's Algebra</span>
    </a>
    <a href="/iq/ants-axes/index.html" class="tile">
      <span class="icon">📊</span>
      <span class="label">Ant's Axes</span>
    </a>
    <a href="/iq/lexicon/index.html" class="tile">
      <span class="icon">📖</span>
      <span class="label">Lexicon</span>
    </a>
    <a href="/games/crossword/index.html" class="tile">
      <span class="icon">🔤</span>
      <span class="label">Crossword</span>
    </a>
    <a href="/games/ants-acorns/index.html" class="tile">
      <span class="icon">🌰</span>
      <span class="label">Ant's Acorns</span>
    </a>
    <a href="/games/sudoku/index.html" class="tile">
      <span class="icon">🔢</span>
      <span class="label">Sudoku</span>
    </a>
    <a href="/games/abacus/index.html" class="tile">
      <span class="icon">🧮</span>
      <span class="label">Abacus</span>
    </a>
    <a href="/games/ants-labyrinth/index.html" class="tile">
      <span class="icon">🏰</span>
      <span class="label">Ant's Labyrinth</span>
    </a>
  </div>
</body>

</html>
