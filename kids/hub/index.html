<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kids Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream: #FAF7F2; --bark: #3D2B1F; --bark-light: #6B4C38;
      --spruce: #2E5C3E; --spruce-pale: #E4F0E8;
      --sun: #E8A020; --sun-pale: #FDF3E0;
      --rust: #C04B2A; --rust-pale: #FAEAE5;
      --sky: #2A5D8C; --sky-pale: #E3EEF7;
      --plum: #6B3FA0; --plum-pale: #F0EBF8;
      --teal: #1A6A7A; --border: rgba(61,43,31,0.12);
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--bark); font-size: 15px; line-height: 1.65; }
    .page { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
    .site-header { padding: 2.5rem 0 1.5rem; border-bottom: 1.5px solid var(--border); margin-bottom: 1.5rem; }
    .eyebrow { font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--spruce); margin-bottom: 0.4rem; }
    h1 { font-family: 'Playfair Display', serif; font-size: 2.4rem; font-weight: 600; color: var(--bark); }
    .updated { font-size: 12px; color: var(--bark-light); font-weight: 300; margin-top: 0.3rem; }
    .controls { display: flex; gap: 12px; margin-bottom: 2rem; flex-wrap: wrap; align-items: center; }
    .search-wrap { position: relative; flex: 1; min-width: 200px; max-width: 360px; }
    .search-wrap svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--bark-light); pointer-events: none; }
    #search { width: 100%; padding: 8px 12px 8px 34px; border: 1px solid var(--border); border-radius: 8px; background: white; font-family: inherit; font-size: 13px; color: var(--bark); outline: none; }
    #search:focus { border-color: var(--sky); }
    .filter-pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .fpill { font-size: 12px; font-weight: 500; padding: 5px 14px; border-radius: 20px; border: 1px solid var(--border); background: white; color: var(--bark-light); cursor: pointer; transition: all 0.15s; }
    .fpill.active { border-color: transparent; color: white; }
    .fpill[data-child="All"].active    { background: #8A5A00; }
    .fpill[data-child="Ballard"].active { background: var(--sky); }
    .fpill[data-child="Elle"].active   { background: var(--plum); }
    .fpill[data-child="Edie"].active   { background: var(--spruce); }
    .fpill[data-section="All"].active      { background: var(--bark); }
    .fpill[data-section="Events"].active   { background: var(--sky); }
    .fpill[data-section="Tasks"].active    { background: var(--rust); }
    .fpill[data-section="Curriculum"].active { background: var(--spruce); }
    .pills-divider { width: 1px; height: 22px; background: var(--border); align-self: center; margin: 0 2px; }
    .show-done-wrap { display: flex; align-items: center; gap: 6px; margin-left: auto; font-size: 12px; color: var(--bark-light); cursor: pointer; user-select: none; }
    .cols { display: grid; grid-template-columns: 1.1fr 0.9fr 1fr; gap: 2rem; align-items: start; }
    .cols.solo { grid-template-columns: 1fr; max-width: 680px; }
    .cols.solo-curr { grid-template-columns: 1fr; }
    .cols.solo-curr #curriculum-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    .cols.solo-curr #curriculum-list .card { margin-bottom: 0; }
    @media (max-width: 860px) { .cols { grid-template-columns: 1fr; } }
    @media (max-width: 600px) {
      .page { padding: 1rem 0.9rem 3rem; }
      .site-header { padding: 1rem 0 0.75rem; margin-bottom: 1rem; }
      h1 { font-size: 1.75rem; }
      .controls { gap: 8px; margin-bottom: 1.25rem; }
      .search-wrap { max-width: 100%; min-width: 0; flex: 1 1 auto; }
      .show-done-wrap { margin-left: 0; width: 100%; padding: 2px 0; }
      .pills-divider { display: none; }
      .filter-pills { width: 100%; }
      .fpill { padding: 7px 14px; font-size: 13px; }
      .done-btn { padding: 6px 12px; font-size: 11px; }
      .cal-row { padding: 0.6rem 0.75rem; }
      .task-body { padding: 0.65rem 0.75rem; }
      .card { padding: 0.75rem 0.85rem; }
      .cols { gap: 1.5rem; }
      .section-title { font-size: 1.05rem; margin-bottom: 1rem; }
      footer { font-size: 11px; }
    }
    .section-title { font-family: 'Playfair Display', serif; font-size: 1.15rem; font-weight: 600; margin-bottom: 1.2rem; padding-bottom: 0.6rem; border-bottom: 1px solid var(--border); }
    .empty { color: var(--bark-light); font-size: 13px; font-style: italic; }
    /* Events */
    .cal-mo { font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--bark-light); margin: 1rem 0 0.5rem 2px; }
    .cal-mo:first-child { margin-top: 0; }
    .cal-list { display: flex; flex-direction: column; gap: 8px; }
    .cal-row { display: grid; grid-template-columns: 48px 1fr; gap: 10px; background: white; border: 0.5px solid var(--border); border-radius: 10px; padding: 0.7rem 0.85rem; border-left-width: 3px; transition: opacity 0.2s; }
    .cal-row.done { opacity: 0.38; }
    .cal-date { text-align: center; }
    .cal-wday { font-size: 9px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--bark-light); }
    .cal-d { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 600; line-height: 1; }
    .cal-name { font-size: 13px; font-weight: 500; color: var(--bark); margin-bottom: 2px; line-height: 1.4; }
    .cal-info { font-size: 11.5px; color: var(--bark-light); font-weight: 300; line-height: 1.4; margin-bottom: 5px; }
    .cal-foot { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .cal-tags { display: flex; gap: 4px; flex-wrap: wrap; }
    /* Tasks */
    .task-row { display: flex; background: white; border: 0.5px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 8px; transition: opacity 0.2s; }
    .task-row.done { opacity: 0.38; }
    .task-row.urgent { border-color: rgba(192,75,42,0.3); }
    .task-bar { width: 4px; flex-shrink: 0; }
    .task-body { padding: 0.75rem 0.9rem; flex: 1; min-width: 0; }
    .task-head { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; flex-wrap: wrap; }
    .task-title { font-size: 13px; font-weight: 500; color: var(--bark); margin-bottom: 3px; line-height: 1.4; }
    .task-title.struck { text-decoration: line-through; color: var(--bark-light); }
    .task-desc { font-size: 11.5px; color: var(--bark-light); font-weight: 300; line-height: 1.5; }
    .due-badge { font-size: 10px; font-weight: 500; padding: 2px 8px; border-radius: 10px; background: var(--sun-pale); color: #8A5A00; }
    .due-badge.urgent { background: var(--rust-pale); color: var(--rust); }
    /* Curriculum */
    .card { background: white; border: 0.5px solid var(--border); border-radius: 10px; padding: 0.85rem 1rem; margin-bottom: 10px; }
    .slbl { font-size: 10px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 5px; display: flex; align-items: center; gap: 5px; }
    .sdot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
    .c-plum{color:var(--plum)}.c-plum .sdot{background:var(--plum)}
    .c-sky{color:var(--sky)}.c-sky .sdot{background:var(--sky)}
    .c-spruce{color:var(--spruce)}.c-spruce .sdot{background:var(--spruce)}
    .c-teal{color:var(--teal)}.c-teal .sdot{background:var(--teal)}
    .c-rust{color:var(--rust)}.c-rust .sdot{background:var(--rust)}
    .c-amber{color:#8A5A00}.c-amber .sdot{background:var(--sun)}
    .c-green{color:#3A6820}.c-green .sdot{background:#3A6820}
    .c-bark{color:var(--bark-light)}.c-bark .sdot{background:var(--bark-light)}
    .stopic { font-size: 13px; font-weight: 500; color: var(--bark); margin-bottom: 3px; }
    .sdetail { font-size: 12px; color: var(--bark-light); font-weight: 300; line-height: 1.5; }
    .ctag { font-size: 11px; font-weight: 500; padding: 2px 9px; border-radius: 20px; }
    /* Complete button */
    .done-btn { font-size: 10px; font-weight: 500; padding: 3px 10px; border-radius: 20px; border: 1px solid var(--border); background: white; color: var(--bark-light); cursor: pointer; transition: all 0.15s; white-space: nowrap; flex-shrink: 0; }
    .done-btn:hover { background: var(--spruce-pale); border-color: var(--spruce); color: var(--spruce); }
    .done-btn.undo:hover { background: var(--rust-pale); border-color: var(--rust); color: var(--rust); }
    .filtered { display: none !important; }
    #loading { text-align: center; padding: 4rem; color: var(--bark-light); font-size: 14px; }
    .toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); background: var(--bark); color: white; font-size: 13px; font-weight: 500; padding: 10px 20px; border-radius: 8px; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 999; }
    .toast.show { opacity: 1; }
    footer { margin-top: 3rem; padding-top: 1.2rem; border-top: 1px solid var(--border); font-size: 11px; color: var(--bark-light); font-weight: 300; }
    @keyframes fu { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .site-header{animation:fu 0.35s ease both}.controls{animation:fu 0.4s ease both}.cols{animation:fu 0.45s ease both}
  </style>
</head>
<body>
<div class="page">
  <header class="site-header">
    <div class="eyebrow">Konigsmark Family · School Hub</div>
    <h1>Kids Hub</h1>
    <p class="updated" id="updated-ts">Loading…</p>
  </header>
  <div class="controls">
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="search" type="search" placeholder="Search events, tasks, topics…">
    </div>
    <div class="filter-pills">
      <button class="fpill active" data-child="All">All kids</button>
      <button class="fpill" data-child="Ballard">Ballard</button>
      <button class="fpill" data-child="Elle">Elle</button>
      <button class="fpill" data-child="Edie">Edie</button>
    </div>
    <div class="pills-divider"></div>
    <div class="filter-pills" id="section-pills">
      <button class="fpill active" data-section="All">All</button>
      <button class="fpill" data-section="Events">Events</button>
      <button class="fpill" data-section="Tasks">Tasks</button>
      <button class="fpill" data-section="Curriculum">Curriculum</button>
    </div>
    <label class="show-done-wrap">
      <input type="checkbox" id="show-done"> Show completed
    </label>
  </div>
  <div id="loading">Loading school data…</div>
  <div class="cols" id="main-cols" style="display:none">
    <section><div class="section-title">Events</div><div id="events-list"></div></section>
    <section><div class="section-title">Tasks</div><div id="tasks-list"></div></section>
    <section><div class="section-title">Curriculum</div><div id="curriculum-list"></div></section>
  </div>
  <footer>Burnmark Productions · compiled from school emails · runs twice daily</footer>
</div>
<div class="toast" id="toast"></div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  const sb = createClient(
    'https://fwchltustcyrwtslhqcr.supabase.co',
    'sb_publishable_KPWlRz16vmG4XylKdH-7Hg_TFE-JysD'
  );

  const TODAY = new Date().toISOString().split('T')[0];
  let allItems = [];
  let activeChild = 'All';
  let activeSection = 'All';
  let showDone = false;

  const CHILD_FG = {Ballard:'#2A5D8C',Elle:'#6B3FA0',Edie:'#2E5C3E',All:'#8A5A00'};
  const CHILD_BG = {Ballard:'#E3EEF7',Elle:'#F0EBF8',Edie:'#E4F0E8',All:'#FDF3E0'};
  const SUBJ_CLS = {Math:'plum',Reading:'sky',Science:'spruce','Social Studies':'teal',Art:'rust',Music:'amber',PE:'green',Other:'bark'};

  const esc = s => s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : '';
  const ctag = c => { const fg=CHILD_FG[c]||CHILD_FG.All, bg=CHILD_BG[c]||CHILD_BG.All; return `<span class="ctag" style="background:${bg};color:${fg}">${c}</span>`; };
  const fmtDate = d => d ? new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '';
  const fmtWday = d => d ? new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short'}).toUpperCase() : 'TBD';
  const fmtDay  = d => d ? new Date(d+'T12:00:00').getDate() : '?';
  const fmtMonth= d => d ? new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'long',year:'numeric'}) : 'TBD';

  async function toggle(id, current) {
    const newVal = !current;
    await sb.from('items').update({completed:newVal, completed_by:'family', completed_at: newVal ? new Date().toISOString() : null}).eq('id', id);
    const i = allItems.find(x => x.id === id);
    if (i) i.completed = newVal;
    render();
    toast(newVal ? 'Marked complete ✓' : 'Unmarked');
  }
  window._toggle = toggle;

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2200);
  }

  function renderEvents(items) {
    const future = items.filter(i => i.type==='event' && (i.date||'') >= TODAY)
                        .sort((a,b) => (a.date||'9999') <= (b.date||'9999') ? -1 : 1);
    if (!future.length) return '<p class="empty">No upcoming events.</p>';
    const groups = {};
    for (const e of future) { const m = fmtMonth(e.date); (groups[m]=groups[m]||[]).push(e); }
    let html = '';
    for (const [month, evts] of Object.entries(groups)) {
      html += `<div class="cal-mo">${month}</div><div class="cal-list">`;
      for (const e of evts) {
        const color = CHILD_FG[e.child]||CHILD_FG.All;
        const info  = [e.time, e.description].filter(Boolean).join(' · ');
        const c     = e.child || 'All';
        html += `
        <div class="cal-row${e.completed?' done':''}" style="border-left-color:${color}"
             data-child="${c}" data-search="${esc(e.title+' '+info+' '+c).toLowerCase()}">
          <div class="cal-date">
            <div class="cal-wday">${fmtWday(e.date)}</div>
            <div class="cal-d" style="color:${color}">${fmtDay(e.date)}</div>
          </div>
          <div>
            <div class="cal-name">${esc(e.title)}</div>
            ${info?`<div class="cal-info">${esc(info)}</div>`:''}
            <div class="cal-foot">
              <div class="cal-tags">${ctag(c)}</div>
              <button class="done-btn${e.completed?' undo':''}" onclick="window._toggle('${e.id}',${e.completed})">${e.completed?'Undo':'Done'}</button>
            </div>
          </div>
        </div>`;
      }
      html += '</div>';
    }
    return html;
  }

  function renderTasks(items) {
    const tasks = items.filter(i => i.type==='task')
                       .sort((a,b) => (a.date||'9999') <= (b.date||'9999') ? -1 : 1);
    if (!tasks.length) return '<p class="empty">No tasks.</p>';
    return tasks.map(t => {
      const color   = CHILD_FG[t.child]||CHILD_FG.All;
      const urgent  = t.date && t.date <= TODAY && !t.completed;
      const c       = t.child || 'All';
      const dueBadge = t.date ? `<span class="due-badge${urgent?' urgent':''}">${fmtDate(t.date)}</span>` : '';
      return `
      <div class="task-row${t.completed?' done':urgent?' urgent':''}"
           data-child="${c}" data-search="${esc(t.title+' '+(t.description||'')+' '+c).toLowerCase()}">
        <div class="task-bar" style="background:${color}"></div>
        <div class="task-body">
          <div class="task-head">${ctag(c)} ${dueBadge}
            <button class="done-btn${t.completed?' undo':''}" style="margin-left:auto" onclick="window._toggle('${t.id}',${t.completed})">${t.completed?'Undo':'Done'}</button>
          </div>
          <div class="task-title${t.completed?' struck':''}">${esc(t.title)}</div>
          ${t.description?`<div class="task-desc">${esc(t.description)}</div>`:''}
        </div>
      </div>`;
    }).join('');
  }

  function renderCurriculum(items) {
    const curr = items.filter(i => i.type==='curriculum');
    if (!curr.length) return '<p class="empty">No curriculum updates.</p>';
    return curr.map(c => {
      const sc = SUBJ_CLS[c.subject]||'bark';
      const ch = c.child || 'All';
      return `
      <div class="card" data-child="${ch}" data-search="${esc(c.title+' '+(c.description||'')+' '+(c.subject||'')+' '+ch).toLowerCase()}">
        <div class="slbl c-${sc}"><span class="sdot"></span>${c.subject||'Other'}</div>
        <div class="stopic">${esc(c.title)}</div>
        ${c.description?`<div class="sdetail">${esc(c.description)}</div>`:''}
        <div style="margin-top:8px">${ctag(ch)}</div>
      </div>`;
    }).join('');
  }

  function render() {
    document.getElementById('events-list').innerHTML     = renderEvents(allItems);
    document.getElementById('tasks-list').innerHTML      = renderTasks(allItems);
    document.getElementById('curriculum-list').innerHTML = renderCurriculum(allItems);
    applySection();
    applyFilters();
  }

  function applySection() {
    const cols = document.getElementById('main-cols');
    const sections = cols.querySelectorAll('section');
    const idx = { Events: 0, Tasks: 1, Curriculum: 2 };
    cols.classList.remove('solo', 'solo-curr');
    if (activeSection === 'All') {
      sections.forEach(s => s.style.display = '');
    } else {
      sections.forEach((s, i) => s.style.display = i === idx[activeSection] ? '' : 'none');
      cols.classList.add(activeSection === 'Curriculum' ? 'solo-curr' : 'solo');
    }
  }

  function applyFilters() {
    const q = document.getElementById('search').value.trim().toLowerCase();
    document.querySelectorAll('[data-child]').forEach(el => {
      const cm = activeChild==='All' || el.dataset.child===activeChild || el.dataset.child==='All';
      const tm = !q || (el.dataset.search||'').includes(q);
      const dm = showDone || !el.classList.contains('done');
      el.classList.toggle('filtered', !(cm && tm && dm));
    });
  }

  async function loadAll() {
    const { data, error } = await sb.from('items').select('*').order('date', {ascending:true, nullsFirst:false});
    if (error) { document.getElementById('loading').textContent = 'Error loading data.'; return; }
    allItems = data;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('main-cols').style.display = '';
    document.getElementById('updated-ts').textContent = 'Updated ' + new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
    render();
  }

  sb.channel('items').on('postgres_changes', {event:'*', schema:'public', table:'items'}, p => {
    if (p.eventType==='UPDATE') { const i=allItems.findIndex(x=>x.id===p.new.id); if(i!==-1) allItems[i]=p.new; }
    else if (p.eventType==='INSERT') allItems.push(p.new);
    else if (p.eventType==='DELETE') allItems=allItems.filter(x=>x.id!==p.old.id);
    render();
  }).subscribe();

  document.getElementById('search').addEventListener('input', applyFilters);
  document.getElementById('show-done').addEventListener('change', e => { showDone=e.target.checked; applyFilters(); });
  document.querySelectorAll('.fpill[data-child]').forEach(p => p.addEventListener('click', () => {
    document.querySelectorAll('.fpill[data-child]').forEach(x=>x.classList.remove('active'));
    p.classList.add('active'); activeChild=p.dataset.child; applyFilters();
  }));
  document.querySelectorAll('.fpill[data-section]').forEach(p => p.addEventListener('click', () => {
    document.querySelectorAll('.fpill[data-section]').forEach(x=>x.classList.remove('active'));
    p.classList.add('active'); activeSection=p.dataset.section; applySection();
  }));

  loadAll();
</script>
</body>
</html>
