<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Elle and Edie's Learning Lab</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="banner">
      <img class="banner-photo" src="elle-edie.png" alt="Elle and Edie">
      <div class="banner-text">
        <h1 class="brand">Elle and Edie's<br>Learning Lab</h1>
        <span class="streak" id="streak">🔥 0</span>
      </div>
    </header>

    <nav class="subjects" id="subjects"></nav>

    <div class="difficulty" id="difficulty">
      <button class="diff-btn" id="easierBtn" title="Easier">😌 Easier</button>
      <div class="diff-dots" id="diffDots"></div>
      <button class="diff-btn" id="harderBtn" title="Harder">🔥 Harder</button>
    </div>

    <main class="card" id="card">
      <div class="cat-pill" id="catPill">Category</div>
      <h1 class="question" id="questionText">Loading…</h1>
      <div class="choices" id="choices"></div>
      <div class="reveal" id="revealBox" hidden>
        <p class="reveal-label">Answer:</p>
        <p class="reveal-answer" id="revealAnswer"></p>
      </div>
      <button class="btn next" id="nextBtn" hidden>Next question →</button>
    </main>

    <div class="celebrate" id="celebrate" hidden></div>
  </div>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
