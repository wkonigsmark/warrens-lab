<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Gallery | Warren's Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --wall: #ece6dc;
      --wall-deep: #e3dcd0;
      --wall-highlight: rgba(255, 255, 255, 0.5);
      --frame-white: #ffffff;
      --mat-color: #fdfcf8;
      --text-primary: #2a2724;
      --text-secondary: #6b665e;
      --text-muted: #94908a;
      --border-soft: rgba(40, 32, 24, 0.08);
      --border-medium: rgba(40, 32, 24, 0.14);
      --shadow-warm: 40, 32, 24;
    }

    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      background:
        radial-gradient(ellipse 90% 60% at 50% 18%, var(--wall-highlight), transparent 70%),
        linear-gradient(180deg, var(--wall) 0%, var(--wall-deep) 100%);
      background-attachment: fixed;
      color: var(--text-primary);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle floor shadow — barely perceptible horizon */
    body::after {
      content: "";
      position: fixed;
      inset: auto 0 0;
      height: 140px;
      pointer-events: none;
      background: linear-gradient(180deg, transparent, rgba(var(--shadow-warm), 0.05));
      z-index: -1;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(40, 32, 24, 0.18);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(40, 32, 24, 0.32);
    }

    /* Header / Nav */
    .menu {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(252, 250, 246, 0.82);
      backdrop-filter: blur(14px) saturate(1.1);
      -webkit-backdrop-filter: blur(14px) saturate(1.1);
      border-bottom: 1px solid var(--border-soft);
      padding: 1.4rem 2rem 1.1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      justify-content: center;
      align-items: center;
      transform: translateY(0);
      opacity: 1;
      transition: transform 0.42s ease, opacity 0.42s ease;
    }

    .menu.is-hidden {
      transform: translateY(calc(-100% + 10px));
      opacity: 0.12;
    }

    .menu.is-hidden:hover,
    .menu.is-hidden:focus-within,
    body.menu-peek .menu {
      transform: translateY(0);
      opacity: 1;
    }

    .menu-peek-zone {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 26px;
      z-index: 999;
      pointer-events: auto;
    }

    .menu-title {
      width: 100%;
      text-align: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.7rem, 3vw, 2.6rem);
      font-weight: 500;
      letter-spacing: 0.36em;
      padding-left: 0.36em;
      margin-bottom: 0.8rem;
      color: var(--text-primary);
      text-transform: uppercase;
    }

    .menu-title::before,
    .menu-title::after {
      content: "";
      display: inline-block;
      width: min(7vw, 52px);
      height: 1px;
      margin: 0 22px 0.3em;
      background: var(--text-muted);
      vertical-align: middle;
      opacity: 0.45;
    }

    .menu a {
      color: var(--text-secondary);
      text-decoration: none;
      padding: 0.4rem 0.85rem;
      border-radius: 0;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      transition: color 0.2s;
      border: 0;
      background: transparent;
    }

    .menu a:hover {
      color: var(--text-primary);
    }

    .menu a.active {
      color: var(--text-primary);
    }

    /* Container */
    #gallery-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 4.5rem 2rem 8rem;
    }

    /* Section */
    .gallery-section {
      margin-bottom: 6rem;
      padding: 3rem 0 3rem;
      border: 0;
      background: transparent;
      box-shadow: none;
    }

    .gallery-section + .gallery-section {
      border-top: 1px solid var(--border-soft);
    }

    h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.7rem, 2.6vw, 2.4rem);
      font-weight: 500;
      margin: 0 0 3.5rem;
      padding: 0;
      border: 0;
      color: var(--text-primary);
      display: block;
      letter-spacing: 0.06em;
      text-align: center;
    }

    h2::after {
      content: "";
      display: block;
      width: 32px;
      height: 1px;
      margin: 1rem auto 0;
      background: var(--text-muted);
      opacity: 0.5;
    }

    /* Grid */
    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      column-gap: clamp(2.5rem, 4.5vw, 5rem);
      row-gap: clamp(3rem, 5vw, 5.5rem);
    }

    /* Card */
    .gallery-item {
      --item-width: 300px;
      width: min(var(--item-width), 92vw);
      background: transparent;
      border: 0;
      border-radius: 0;
      padding: 0;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: visible;
      margin: 0.8rem;
    }

    .gallery-item:hover {
      transform: translateY(-4px);
      z-index: 4;
    }

    .img-container {
      box-sizing: border-box;
      width: var(--item-width, 300px);
      aspect-ratio: var(--frame-ratio, 1 / 1);
      border-radius: 0;
      overflow: visible;

      /* Wide mat (the white space around the image) */
      background: var(--mat-color);
      padding: clamp(22px, 4vw, 42px);

      /* Thin clean white frame edge */
      border: 6px solid var(--frame-white);

      box-shadow:
        /* Hairline outer edge */
        0 0 0 1px rgba(var(--shadow-warm), 0.06),
        /* Inner hairline where frame meets mat */
        inset 0 0 0 1px rgba(var(--shadow-warm), 0.04),
        /* Layered soft drop shadow on wall */
        0 2px 4px rgba(var(--shadow-warm), 0.04),
        0 10px 22px rgba(var(--shadow-warm), 0.08),
        0 26px 50px rgba(var(--shadow-warm), 0.07);

      margin-bottom: 1.4rem;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: box-shadow 0.4s ease, transform 0.4s ease;
    }

    .img-container:hover {
      box-shadow:
        0 0 0 1px rgba(var(--shadow-warm), 0.06),
        inset 0 0 0 1px rgba(var(--shadow-warm), 0.04),
        0 4px 8px rgba(var(--shadow-warm), 0.05),
        0 18px 36px rgba(var(--shadow-warm), 0.13),
        0 36px 70px rgba(var(--shadow-warm), 0.1);
    }

    .artwork-mat {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Subtle ledge shadow where image sits on mat */
    .artwork-mat::after {
      content: "";
      position: absolute;
      inset: 0;
      box-shadow:
        inset 0 0 0 1px rgba(var(--shadow-warm), 0.06),
        0 1px 2px rgba(var(--shadow-warm), 0.05);
      pointer-events: none;
    }

    .img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .img-container::after { display: none; }

    .artwork-button {
      display: block;
      width: 100%;
      padding: 0;
      margin: 0;
      color: inherit;
      background: transparent;
      border: 0;
      cursor: zoom-in;
      text-align: inherit;
      font: inherit;
    }

    /* Size variants — different scales for visual rhythm */
    .frame-portrait  { --item-width: 270px; }
    .frame-landscape { --item-width: 360px; }
    .frame-small     { --item-width: 230px; }
    .frame-grand     { --item-width: 440px; }

    /* Style variants — all the same clean white frame, just minor
       proportion shifts so the gallery wall has subtle rhythm */
    .frame-dark .img-container {
      border-width: 5px;
      padding: clamp(20px, 3.6vw, 38px);
    }

    .frame-brass .img-container {
      border-width: 7px;
      padding: clamp(26px, 4.6vw, 46px);
    }

    .frame-carved .img-container {
      border-width: 8px;
      padding: clamp(28px, 5vw, 50px);
    }

    .frame-fancy .img-container {
      border-width: 10px;
      padding: clamp(32px, 5.6vw, 56px);
      box-shadow:
        0 0 0 1px rgba(var(--shadow-warm), 0.08),
        inset 0 0 0 1px rgba(var(--shadow-warm), 0.05),
        0 3px 6px rgba(var(--shadow-warm), 0.05),
        0 14px 28px rgba(var(--shadow-warm), 0.1),
        0 32px 60px rgba(var(--shadow-warm), 0.09);
    }

    /* Caption — refined gallery label, not a brass plaque */
    .gallery-item p {
      width: 100%;
      max-width: 100%;
      margin: 1.1rem 0 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      font-size: 0.68rem;
      color: var(--text-secondary);
      background: transparent;
      border: 0;
      box-shadow: none;
      font-weight: 500;
      text-align: center;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    /* Fullscreen Overlay */
    .gallery-item a {
      display: block;
      text-decoration: none;
    }

    .art-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(236, 230, 220, 0.78);
      backdrop-filter: blur(20px) saturate(1.1);
      -webkit-backdrop-filter: blur(20px) saturate(1.1);
      align-items: center;
      justify-content: center;
      padding: clamp(1rem, 3vw, 2.5rem);
    }

    .art-modal.active {
      display: flex;
    }

    .modal-panel {
      width: min(1180px, 96vw);
      max-height: 92vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 260px;
      gap: 22px;
      align-items: start;
    }

    .featured-frame {
      background: var(--mat-color);
      padding: clamp(28px, 5vw, 60px);
      border: 10px solid var(--frame-white);
      border-image: none;
      box-shadow:
        0 0 0 1px rgba(var(--shadow-warm), 0.08),
        0 20px 50px rgba(var(--shadow-warm), 0.18),
        0 50px 100px rgba(var(--shadow-warm), 0.12);
      position: relative;
    }

    .featured-frame::after {
      content: "";
      position: absolute;
      inset: clamp(28px, 5vw, 60px);
      box-shadow: inset 0 0 0 1px rgba(var(--shadow-warm), 0.06);
      pointer-events: none;
    }

    .featured-frame img {
      display: block;
      width: 100%;
      max-height: calc(92vh - 160px);
      object-fit: contain;
      background: var(--mat-color);
    }

    .modal-menu {
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid var(--border-soft);
      box-shadow:
        0 8px 24px rgba(var(--shadow-warm), 0.08),
        0 20px 48px rgba(var(--shadow-warm), 0.06);
      padding: 22px;
      color: var(--text-primary);
    }

    .modal-menu h3 {
      margin: 0 0 4px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-weight: 500;
      line-height: 1.1;
      color: var(--text-primary);
    }

    .modal-menu p {
      margin: 0 0 18px;
      color: var(--text-secondary);
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      line-height: 1.4;
    }

    .modal-actions {
      display: grid;
      gap: 8px;
    }

    .modal-actions button,
    .modal-actions a {
      display: block;
      width: 100%;
      padding: 11px 12px;
      color: var(--text-primary);
      background: transparent;
      border: 1px solid var(--border-medium);
      text-align: center;
      text-decoration: none;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      border-radius: 0;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }

    .modal-actions button:hover,
    .modal-actions a:hover {
      background: var(--text-primary);
      color: #fff;
      border-color: var(--text-primary);
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid var(--border-soft);
      border-radius: 50%;
      cursor: pointer;
      font-weight: 300;
      font-size: 1.4rem;
      line-height: 1;
      box-shadow: 0 6px 18px rgba(var(--shadow-warm), 0.12);
      transition: background 0.2s, color 0.2s, transform 0.2s;
    }

    .modal-close:hover {
      background: var(--text-primary);
      color: #fff;
      transform: scale(1.05);
    }

    .modal-status {
      min-height: 18px;
      margin-top: 12px;
      color: var(--text-secondary);
      font-size: 0.72rem;
      line-height: 1.4;
    }

    body.modal-open {
      overflow: hidden;
    }

    /* Loading & Error */
    #loading {
      text-align: center;
      padding: 5rem 2rem;
      color: var(--text-secondary);
      font-size: 0.75rem;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      font-weight: 500;
    }

    .error-message {
      text-align: center;
      padding: 2rem;
      background: #fff;
      border: 1px solid var(--border-soft);
      border-radius: 0;
      color: var(--text-secondary);
      max-width: 600px;
      margin: 2rem auto;
    }

    /* Back to Top */
    #back-to-top {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #fff;
      color: var(--text-primary);
      border: 1px solid var(--border-soft);
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(var(--shadow-warm), 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s;
      pointer-events: none;
      z-index: 1001;
    }

    #back-to-top.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    #back-to-top:hover {
      transform: translateY(-2px);
      background: var(--text-primary);
      color: #fff;
      border-color: var(--text-primary);
    }

    @media (max-width: 768px) {
      .gallery {
        row-gap: 3rem;
        column-gap: 2rem;
      }

      .gallery-item,
      .frame-landscape,
      .frame-grand,
      .frame-portrait,
      .frame-small {
        --item-width: min(78vw, 330px);
      }

      .menu {
        padding: 1rem;
      }

      .menu-title {
        letter-spacing: 0.24em;
      }

      .menu-title::before,
      .menu-title::after {
        display: none;
      }

      #gallery-container {
        padding: 2.5rem 1.2rem 5rem;
      }

      .modal-panel {
        grid-template-columns: 1fr;
      }

      .modal-menu {
        max-height: 32vh;
        overflow: auto;
      }
    }
  </style>
</head>

<body>
  <div class="menu-peek-zone" id="menuPeekZone" aria-hidden="true"></div>
  <nav class="menu" id="menu">
    <div class="menu-title">THE GALLERY</div>
    <!-- Menu items will be injected here -->
  </nav>

  <div id="loading">Loading artwork...</div>
  <div id="gallery-container"></div>

  <button id="back-to-top" onclick="scrollToTop()">↑</button>

  <div class="art-modal" id="artModal" aria-hidden="true">
    <button class="modal-close" id="modalClose" aria-label="Close featured artwork">×</button>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="featured-frame">
        <img id="modalImage" src="" alt="">
      </div>
      <aside class="modal-menu">
        <h3 id="modalTitle">Artwork</h3>
        <p id="modalFolder">Gallery selection</p>
        <div class="modal-actions">
          <button type="button" id="copyImageBtn">Copy Image</button>
          <button type="button" id="printImageBtn">Print Image</button>
          <button type="button" id="saveImageBtn">Save File</button>
        </div>
        <div class="modal-status" id="modalStatus"></div>
      </aside>
    </div>
  </div>

  <script>
    const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQCO6dPZsGsk6Ivym0ypjSejef8Zc5pJn_8yT0eTjntBVrre6Re6vzcRsY5hwV9jQvyHRcnDM8bsOK_/pub?gid=1772542183&single=true&output=csv";
    let currentArtwork = null;
    let modalItems = [];
    let modalIndex = -1;

    // Fallback data in case CSV is empty or fails
    const mockData = [
      {
        folderName: 'Abstract Series',
        fileName: 'Ethereal Waves',
        thumbnailUrl: 'https://images.unsplash.com/photo-1541963463532-d68292c34b19?auto=format&fit=crop&q=80&w=600',
        imageUrl: 'https://images.unsplash.com/photo-1541963463532-d68292c34b19?auto=format&fit=crop&q=80&w=1600'
      },
      {
        folderName: 'Abstract Series',
        fileName: 'Golden Hour flows',
        thumbnailUrl: 'https://images.unsplash.com/photo-1549490349-8643362247b5?auto=format&fit=crop&q=80&w=600',
        imageUrl: 'https://images.unsplash.com/photo-1549490349-8643362247b5?auto=format&fit=crop&q=80&w=1600'
      },
      {
        folderName: 'Modern Architecture',
        fileName: 'Geometric Blue',
        thumbnailUrl: 'https://images.unsplash.com/photo-1515405295579-ba7f9f92f4b3?auto=format&fit=crop&q=80&w=600',
        imageUrl: 'https://images.unsplash.com/photo-1515405295579-ba7f9f92f4b3?auto=format&fit=crop&q=80&w=1600'
      },
      {
        folderName: 'Modern Architecture',
        fileName: 'Urban Lines',
        thumbnailUrl: 'https://images.unsplash.com/photo-1486744360530-ca98492d03ec?auto=format&fit=crop&q=80&w=600',
        imageUrl: 'https://images.unsplash.com/photo-1486744360530-ca98492d03ec?auto=format&fit=crop&q=80&w=1600'
      },
      {
        folderName: 'Digital Scapes',
        fileName: 'Neon Cyberpunk',
        thumbnailUrl: 'https://images.unsplash.com/photo-1550684848-fac1c5b4e853?auto=format&fit=crop&q=80&w=600',
        imageUrl: 'https://images.unsplash.com/photo-1550684848-fac1c5b4e853?auto=format&fit=crop&q=80&w=1600'
      }
    ];

    async function fetchCsv() {
      try {
        const response = await fetch(csvUrl);
        if (!response.ok) throw new Error("Failed to fetch CSV");
        const csvText = await response.text();

        const rows = csvText.split("\n").map(row => row.trim()).filter(row => row);

        // Skip header if it exists and looks like a header
        const startIndex = rows[0].toLowerCase().includes("folder") ? 1 : 0;

        return rows.slice(startIndex).map(row => {
          // Simple split, handles basic CSV. For complex CSVs with commas in values, a better parser is needed.
          const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(col => col.replace(/^"|"$/g, '').trim());

          return {
            folderName: cols[0] || 'Uncategorized',
            fileName: cols[1] || 'Untitled',
            thumbnailUrl: cols[2],
            imageUrl: cols[3]
          };
        });
      } catch (error) {
        console.warn("CSV Fetch failed, using mock data:", error);
        return [];
      }
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      }[char]));
    }

    function cleanFileName(value) {
      return String(value || 'artwork').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'artwork';
    }

    function setFrameSizeFromImage(img, galleryItem, index) {
      const w = img.naturalWidth;
      const h = img.naturalHeight;
      if (!w || !h) return;
      
      const ratio = w / h;
      galleryItem.style.setProperty('--frame-ratio', `${w} / ${h}`);
      
      galleryItem.classList.remove('frame-portrait', 'frame-landscape', 'frame-small', 'frame-grand');
      if (ratio > 1.5) {
        galleryItem.classList.add(index % 6 === 0 ? 'frame-grand' : 'frame-landscape');
      } else if (ratio < 0.8) {
        galleryItem.classList.add('frame-portrait');
      } else if (index % 7 === 3) {
        galleryItem.classList.add('frame-small');
      } else {
        galleryItem.classList.add('frame-landscape');
      }
    }

    function getDriveId(url) {
      const value = String(url || '');
      const fileMatch = value.match(/\/d\/([^/]+)/);
      if (fileMatch) return fileMatch[1];
      const idMatch = value.match(/[?&]id=([^&]+)/);
      if (idMatch) return idMatch[1];
      return null;
    }

    function imageCandidates(item) {
      const candidates = [];
      const add = url => {
        if (url && !candidates.includes(url)) candidates.push(url);
      };
      [item.imageUrl, item.thumbnailUrl].forEach(url => {
        const id = getDriveId(url);
        if (id) {
          add(`https://drive.google.com/thumbnail?id=${id}&sz=w2000`);
          add(`https://lh3.googleusercontent.com/d/${id}=w2000`);
          add(`https://drive.google.com/uc?export=view&id=${id}`);
        }
        add(url);
      });
      return candidates;
    }

    function currentImageUrl() {
      return document.getElementById('modalImage').currentSrc || document.getElementById('modalImage').src || currentArtwork?.thumbnailUrl || currentArtwork?.imageUrl || '';
    }

    function useNextModalImageCandidate() {
      const img = document.getElementById('modalImage');
      const candidates = JSON.parse(img.dataset.candidates || '[]');
      const nextIndex = Number(img.dataset.candidateIndex || 0) + 1;
      if (nextIndex < candidates.length) {
        img.dataset.candidateIndex = String(nextIndex);
        img.src = candidates[nextIndex];
      } else {
        document.getElementById('modalStatus').textContent = 'The full image link could not render. Try Save File to open the source.';
      }
    }

    function loadArtworkIntoModal(item) {
      currentArtwork = item;
      const title = item.fileName.replace(/_/g, ' ');
      const candidates = imageCandidates(item);
      const imageUrl = candidates[0] || item.thumbnailUrl || item.imageUrl;
      const modalImage = document.getElementById('modalImage');
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalFolder').textContent = item.folderName || 'Gallery selection';
      modalImage.dataset.candidates = JSON.stringify(candidates);
      modalImage.dataset.candidateIndex = '0';
      modalImage.src = imageUrl;
      modalImage.alt = title;
      document.getElementById('modalStatus').textContent = '';
    }

    function openArtwork(item) {
      modalIndex = modalItems.indexOf(item);
      loadArtworkIntoModal(item);
      document.getElementById('artModal').classList.add('active');
      document.getElementById('artModal').setAttribute('aria-hidden', 'false');
      document.body.classList.add('modal-open');
    }

    function navigateModal(direction) {
      if (!modalItems.length || modalIndex < 0) return;
      modalIndex = (modalIndex + direction + modalItems.length) % modalItems.length;
      loadArtworkIntoModal(modalItems[modalIndex]);
    }

    function closeArtwork() {
      document.getElementById('artModal').classList.remove('active');
      document.getElementById('artModal').setAttribute('aria-hidden', 'true');
      document.body.classList.remove('modal-open');
      const modalImage = document.getElementById('modalImage');
      modalImage.src = '';
      modalImage.dataset.candidates = '[]';
      modalImage.dataset.candidateIndex = '0';
      currentArtwork = null;
      modalIndex = -1;
    }

    async function copyCurrentImage() {
      const status = document.getElementById('modalStatus');
      if (!currentArtwork) return;
      const imageUrl = currentImageUrl();
      try {
        const response = await fetch(imageUrl, { mode: 'cors' });
        const blob = await response.blob();
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
          status.textContent = 'Image copied to clipboard.';
          return;
        }
        throw new Error('Image clipboard unavailable');
      } catch (error) {
        try {
          await navigator.clipboard.writeText(imageUrl);
          status.textContent = 'Image copy was blocked, so the image URL was copied instead.';
        } catch (fallbackError) {
          status.textContent = 'Clipboard access was blocked by the browser.';
        }
      }
    }

    function printCurrentImage() {
      if (!currentArtwork) return;
      const status = document.getElementById('modalStatus');
      const title = currentArtwork.fileName.replace(/_/g, ' ');
      const imageUrl = currentImageUrl();

      /* Hidden iframe — invisible, no popup blocker, no stray tab.
         Triggers the print dialog directly from the host page. */
      const iframe = document.createElement('iframe');
      iframe.setAttribute('aria-hidden', 'true');
      iframe.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
      document.body.appendChild(iframe);

      const doc = iframe.contentDocument;
      doc.open();
      doc.write(`<!DOCTYPE html><html><head><title>${escapeHtml(title)}</title><style>@page{margin:0.4in}html,body{margin:0;height:100%}body{display:flex;align-items:center;justify-content:center;background:#fff}img{max-width:100%;max-height:100vh;object-fit:contain}</style></head><body><img src="${escapeHtml(imageUrl)}" alt="${escapeHtml(title)}"></body></html>`);
      doc.close();

      const cleanup = () => setTimeout(() => iframe.remove(), 600);
      const doPrint = () => {
        try {
          iframe.contentWindow.focus();
          iframe.contentWindow.print();
          status.textContent = 'Print dialog opened.';
        } catch (error) {
          status.textContent = 'Print failed: ' + error.message;
        }
        cleanup();
      };

      const img = doc.querySelector('img');
      if (img.complete && img.naturalWidth) {
        doPrint();
      } else {
        img.addEventListener('load', doPrint, { once: true });
        img.addEventListener('error', () => {
          status.textContent = 'Image failed to load for printing.';
          cleanup();
        }, { once: true });
      }
    }

    async function saveCurrentImage() {
      const status = document.getElementById('modalStatus');
      if (!currentArtwork) return;
      const title = currentArtwork.fileName.replace(/_/g, ' ');
      const imageUrl = currentImageUrl();

      /* For Drive-hosted items, use Drive's export=download endpoint —
         it returns Content-Disposition: attachment so the browser saves
         the file directly without needing a CORS fetch. */
      const driveId = getDriveId(currentArtwork.imageUrl) || getDriveId(currentArtwork.thumbnailUrl);
      if (driveId) {
        const anchor = document.createElement('a');
        anchor.href = `https://drive.google.com/uc?export=download&id=${driveId}`;
        anchor.target = '_blank';
        anchor.rel = 'noopener';
        anchor.download = `${cleanFileName(title)}.jpg`;
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        status.textContent = 'Download started.';
        return;
      }

      try {
        const response = await fetch(imageUrl, { mode: 'cors' });
        const blob = await response.blob();
        const objectUrl = URL.createObjectURL(blob);
        const anchor = document.createElement('a');
        anchor.href = objectUrl;
        anchor.download = `${cleanFileName(title)}.jpg`;
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        URL.revokeObjectURL(objectUrl);
        status.textContent = 'Download started.';
      } catch (error) {
        window.open(imageUrl, '_blank', 'noopener,noreferrer');
        status.textContent = 'Direct download was blocked, so the image opened in a new tab.';
      }
    }

    async function renderGallery() {
      let data = await fetchCsv();
      let isMock = false;

      // Use mock data if CSV is empty
      if (data.length === 0) {
        data = mockData;
        isMock = true;
      }

      document.getElementById('loading').style.display = 'none';

      // Group data by folder
      const groupedData = data.reduce((acc, item) => {
        if (item.thumbnailUrl && item.imageUrl) {
          if (!acc[item.folderName]) acc[item.folderName] = [];
          acc[item.folderName].push(item);
        }
        return acc;
      }, {});

      // Flat list for modal arrow-key navigation (display order)
      modalItems = Object.values(groupedData).flat();

      const menu = document.getElementById("menu");
      const galleryContainer = document.getElementById("gallery-container");

      if (Object.keys(groupedData).length === 0) {
        galleryContainer.innerHTML = "<div class='error-message'><p>No valid images found in the dataset.</p></div>";
        return;
      }

      // If we are showing mock data, add a notice
      if (isMock) {
        const notice = document.createElement('div');
        notice.style.cssText = 'text-align: center; color: var(--text-secondary); margin-bottom: 2rem; font-size: 0.9rem; font-style: italic;';
        notice.innerHTML = 'Displaying demo content. <br>Populate the Google Sheet to see your own images.';
        galleryContainer.prepend(notice);
      }

      Object.keys(groupedData).forEach(folder => {
        const folderId = folder.replace(/\s+/g, '-').toLowerCase();

        // Add folder to menu
        const menuItem = document.createElement("a");
        menuItem.href = `#${folderId}`;
        menuItem.textContent = folder;
        menu.appendChild(menuItem);

        // Create folder section
        const section = document.createElement("div");
        section.className = 'gallery-section';
        section.id = folderId;
        section.innerHTML = `<h2>${folder}</h2>`;

        const gallery = document.createElement("div");
        gallery.className = "gallery";

        groupedData[folder].forEach((item, index) => {
          const galleryItem = document.createElement("div");
          const frameStyles = ["frame-fancy", "frame-brass", "frame-dark", "frame-carved", "frame-brass", "frame-dark", "frame-fancy"];
          galleryItem.className = `gallery-item ${frameStyles[index % frameStyles.length]} frame-landscape`;

          galleryItem.innerHTML = `
                <button type="button" class="artwork-button">
                    <div class="img-container">
                        <div class="artwork-mat">
                            <img src="${item.thumbnailUrl}" alt="${escapeHtml(item.fileName)}" loading="lazy">
                        </div>
                    </div>
                    <p>${escapeHtml(item.fileName.replace(/_/g, ' '))}</p>
                </button>
            `;
          const img = galleryItem.querySelector('img');
          img.addEventListener('load', () => setFrameSizeFromImage(img, galleryItem, index), { once: true });
          galleryItem.querySelector('.artwork-button').addEventListener('click', () => openArtwork(item));
          gallery.appendChild(galleryItem);
        });

        section.appendChild(gallery);
        galleryContainer.appendChild(section);
      });

      // Smooth scroll for nav links
      document.querySelectorAll('.menu a').forEach(anchor => {
        anchor.addEventListener('click', function (e) {
          e.preventDefault();
          const targetId = this.getAttribute('href');
          document.querySelector(targetId).scrollIntoView({
            behavior: 'smooth'
          });
        });
      });
    }

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.addEventListener('scroll', function () {
      const button = document.getElementById("back-to-top");
      if (window.scrollY > 300) {
        button.classList.add('visible');
      } else {
        button.classList.remove('visible');
      }
    });

    function setupAutoHidingMenu() {
      const menu = document.getElementById('menu');
      const peekZone = document.getElementById('menuPeekZone');
      let hideTimer = null;

      const shouldHide = () => window.scrollY > 80 && !menu.matches(':hover') && !menu.matches(':focus-within');
      const hideMenu = () => {
        if (shouldHide()) {
          menu.classList.add('is-hidden');
          document.body.classList.remove('menu-peek');
        }
      };
      const scheduleHide = () => {
        clearTimeout(hideTimer);
        hideTimer = setTimeout(hideMenu, 1200);
      };
      const showMenu = () => {
        clearTimeout(hideTimer);
        menu.classList.remove('is-hidden');
        document.body.classList.add('menu-peek');
      };

      peekZone.addEventListener('mouseenter', showMenu);
      menu.addEventListener('mouseenter', showMenu);
      menu.addEventListener('focusin', showMenu);
      menu.addEventListener('mouseleave', scheduleHide);
      menu.addEventListener('focusout', scheduleHide);
      window.addEventListener('scroll', () => {
        if (window.scrollY <= 80) {
          showMenu();
        } else {
          document.body.classList.remove('menu-peek');
          scheduleHide();
        }
      });
      scheduleHide();
    }

    document.getElementById('modalClose').addEventListener('click', closeArtwork);
    document.getElementById('modalImage').addEventListener('error', useNextModalImageCandidate);
    document.getElementById('artModal').addEventListener('click', event => {
      if (event.target.id === 'artModal') closeArtwork();
    });
    document.getElementById('copyImageBtn').addEventListener('click', copyCurrentImage);
    document.getElementById('printImageBtn').addEventListener('click', printCurrentImage);
    document.getElementById('saveImageBtn').addEventListener('click', saveCurrentImage);
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        closeArtwork();
        return;
      }
      if (!document.body.classList.contains('modal-open')) return;
      if (event.key === 'ArrowLeft') {
        event.preventDefault();
        navigateModal(-1);
      } else if (event.key === 'ArrowRight') {
        event.preventDefault();
        navigateModal(1);
      }
    });

    setupAutoHidingMenu();
    renderGallery();
  </script>
</body>

</html>
