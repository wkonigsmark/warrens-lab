<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jane's List - Best Restaurants in NYC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-content">
        <h1 class="header-title">Jane's List</h1>
        <p class="header-subtitle">The Finest Tables in New York</p>
      </div>
    </header>

    <main class="main">
      <ol class="restaurant-list" id="restaurantList">
        <li class="restaurant-item">
          <div class="item-number">1</div>
          <a href="https://www.the86.nyc/" target="_blank" class="item-name">The 86</a>
        </li>
        <li class="restaurant-item">
          <div class="item-number">2</div>
          <a href="https://www.oresh.com/" target="_blank" class="item-name">Or'Esh</a>
        </li>
        <li class="restaurant-item">
          <div class="item-number">3</div>
          <a href="https://www.thecornerstoresoho.com/" target="_blank" class="item-name">Corner Store</a>
        </li>
        <li class="restaurant-item">
          <div class="item-number">4</div>
          <a href="https://www.nycmonkeybar.com/" target="_blank" class="item-name">Monkey Bar</a>
        </li>
        <li class="restaurant-item">
          <div class="item-number">5</div>
          <a href="https://www.ralphlauren.com/global-polo-bar" target="_blank" class="item-name">Polo Bar</a>
        </li>
        <li class="restaurant-item">
          <div class="item-number">6</div>
          <a href="https://www.tatiananyc.com/" target="_blank" class="item-name">Tatiana</a>
        </li>
        <li class="restaurant-item">
          <div class="item-number">7</div>
          <a href="https://raossince1896.com/homepage/" target="_blank" class="item-name">Rao's</a>
        </li>
        <li class="restaurant-item">
          <div class="item-number">8</div>
          <a href="https://torrisinyc.com/" target="_blank" class="item-name">Torrisi</a>
        </li>
        <li class="restaurant-item">
          <div class="item-number">9</div>
          <a href="https://carbonenewyork.com/" target="_blank" class="item-name">Carbone</a>
        </li>
        <li class="restaurant-item">
          <div class="item-number">10</div>
          <a href="https://www.lucali.com/" target="_blank" class="item-name">Lucali</a>
        </li>
        <li class="restaurant-item">
          <div class="item-number">11</div>
          <a href="https://www.nycprimerib.com/" target="_blank" class="item-name">4 Charles</a>
        </li>
      </ol>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
