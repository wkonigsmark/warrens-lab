<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Burnmark Productions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: "Perfect DOS VGA 437";
      src: url("fonts/PerfectDOSVGA437.woff2") format("woff2");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg-color: #0c0e12;
      --dos-green: #33ff33;
      --dos-glow: rgba(51, 255, 51, 0.25);
      --text-main: #ffffff;
      --text-dim: rgba(255, 255, 255, 0.4);
      --glass-bg: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    body {
      background: #000000;
      background: radial-gradient(circle at top right, #1a1e26, #000000);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column; /* Allows vertical stacking */
      align-items: center;
      justify-content: flex-start; /* Ensures content flows from top and doesn't cut off */
      min-height: 100vh;
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      overflow-y: auto; /* Enable scroll */
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .hero {
      text-align: center;
      padding: 60px 24px 40px; /* Gives room at the top, and tightens left/right margins */
      max-width: 400px;
      width: 100%;
      box-sizing: border-box;
      margin: auto; /* Centers horizontally and vertically */
    }

    .tty-container {
      font-family: "Perfect DOS VGA 437", monospace;
      font-size: clamp(18px, 5vw, 26px);
      color: var(--dos-green);
      text-shadow: 0 0 10px var(--dos-glow);
      line-height: 1.4;
      margin-bottom: 2.5rem;
      min-height: 3.5em;
      display: block;
      -webkit-font-smoothing: none;
      letter-spacing: 0;
    }

    #text {
      color: inherit;
    }

    .cursor {
      display: inline-block;
      width: 0.7ch;
      height: 1.05em;
      background: var(--dos-green);
      margin-left: 0.15ch;
      vertical-align: middle;
      animation: blink 0.8s steps(1, end) infinite;
      box-shadow: 0 0 8px var(--dos-green);
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    /* Minimalist Premium Dropdown Menu */
    .nav-menu {
      opacity: 0;
      transform: translateY(-10px);
      transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
      margin-top: 1rem;
    }

    .nav-menu.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: all;
    }

    .nav-item {
      text-decoration: none;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.05) 100%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-top: 1px solid rgba(255, 255, 255, 0.35);
      padding: 14px 20px;
      border-radius: 12px;
      transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
      display: flex;
      align-items: center;
      gap: 16px;
      backdrop-filter: blur(20px);
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.02);

      /* Cascading Reveal Prep */
      opacity: 0;
      transform: translateY(15px);
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .nav-item.revealed {
      opacity: 1;
      transform: translateY(0);
    }

    .nav-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      width: 4px;
      height: 100%;
      background: var(--dos-green);
      transform: scaleY(0);
      transition: transform 0.4s ease;
    }

    .nav-item:hover {
      color: #ffffff;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.1) 100%);
      border-color: rgba(255, 255, 255, 0.4);
      transform: translateX(12px) scale(1.01);
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.7), 0 0 15px rgba(51, 255, 51, 0.15);
    }

    .nav-item:hover::before {
      transform: scaleY(1);
    }

    .item-icon {
      font-size: 1.8rem;
      flex-shrink: 0;
    }

    .item-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-align: left;
    }

    .item-title {
      font-weight: 700;
      font-size: 1.05rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin: 0;
    }

    .item-subtext {
      font-weight: 400;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--text-dim);
      margin: 0;
    }

    .nav-item::after {
      content: '→';
      font-size: 1.1rem;
      opacity: 0;
      transform: translateX(-15px);
      transition: all 0.3s ease;
      color: var(--dos-green);
      margin-left: auto;
    }

    .nav-item:hover::after {
      opacity: 1;
      transform: translateX(0);
    }

    .skip-hint {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      color: var(--dos-green);
      text-transform: uppercase;
      letter-spacing: 4px;
      opacity: 0.3;
      font-family: "Perfect DOS VGA 437", monospace;
      transition: opacity 0.3s;
    }

    .skip-hint:hover {
      opacity: 0.8;
    }
  </style>
</head>

<body>
  <div class="hero">
    <div class="tty-container">
      <span id="text"></span><span class="cursor"></span>
    </div>

    <nav id="main-nav" class="nav-menu">
      <a href="iq/index.html" class="nav-item">
        <div class="item-icon">🧠</div>
        <div class="item-info">
          <h3 class="item-title">IQ</h3>
          <p class="item-subtext">Educational toolkit & brain training lab</p>
        </div>
      </a>
      <a href="dynasty/baseball/index.html" class="nav-item">
        <div class="item-icon">⚾</div>
        <div class="item-info">
          <h3 class="item-title">Dynasty</h3>
          <p class="item-subtext">Diamond strategy & team management</p>
        </div>
      </a>
      <a href="world-cup/index.html" class="nav-item">
        <div class="item-icon">🏆</div>
        <div class="item-info">
          <h3 class="item-title">World Cup</h3>
          <p class="item-subtext">Tournament tracking & historical archives</p>
        </div>
      </a>
      <a href="recipes/index.html" class="nav-item">
        <div class="item-icon">🍳</div>
        <div class="item-info">
          <h3 class="item-title">Kitchen Sync</h3>
          <p class="item-subtext">Culinary vault & recipe coordination</p>
        </div>
      </a>
      <a href="cocktails/index.html" class="nav-item">
        <div class="item-icon">🍸</div>
        <div class="item-info">
          <h3 class="item-title">Cocktail Compass</h3>
          <p class="item-subtext">Mixology library & drink coordination</p>
        </div>
      </a>
    </nav>
  </div>

  <div id="skip-hint" class="skip-hint">Click Anywhere to Skip</div>

  <script>
    (function () {
      const TEXT = "Burnmark Productions, a Creative Space...";
      const textEl = document.getElementById("text");
      const navEl = document.getElementById("main-nav");
      const hintEl = document.getElementById("skip-hint");

      let i = 0;
      let isSkipped = false;

      function getStaggeredDelay(char) {
        if (isSkipped) return 0;

        // Base human speed: ~60-120ms
        let delay = Math.floor(60 + Math.random() * 60);

        // Stochastic staggering logic
        if (char === " ") delay += Math.floor(Math.random() * 80 + 50); // Pause on spaces
        if (char === ",") delay += Math.floor(Math.random() * 200 + 150); // Significant pause on commas
        if (char === ".") delay += Math.floor(Math.random() * 100 + 100); // Slight pause on ellipsis dots

        // Random "thinking" hesitation (stochastically added 5% of the time)
        if (Math.random() < 0.05) delay += Math.floor(Math.random() * 150 + 100);

        return delay;
      }

      function skip() {
        if (isSkipped) return;
        isSkipped = true;
        textEl.textContent = TEXT;
        showMenu();
      }

      function showMenu() {
        navEl.classList.add("visible");

        // Cascade reveal pattern
        const items = navEl.querySelectorAll(".nav-item");
        items.forEach((item, index) => {
          setTimeout(() => {
            item.classList.add("revealed");
          }, index * 120); // Sequence delay
        });

        hintEl.style.opacity = "0";
        setTimeout(() => hintEl.remove(), 400);
      }

      function type() {
        if (isSkipped) return;

        const currentChar = TEXT[i - 1];
        textEl.textContent = TEXT.slice(0, i++);

        if (i <= TEXT.length) {
          const nextChar = TEXT[i - 1];
          setTimeout(type, getStaggeredDelay(nextChar));
        } else {
          setTimeout(showMenu, 400);
        }
      }

      document.addEventListener('click', skip);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') skip();
      });

      setTimeout(type, 300);
    })();
  </script>
</body>

</html>
