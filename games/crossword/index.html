<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Word Weaver — Mini Crossword</title>
    <link rel="stylesheet" href="styles.css?v=6" />
  </head>
  <body>
    <main class="app-shell">
      <section class="game-panel" aria-label="Crossword puzzle">
        <header class="topbar">
          <div>
            <p class="eyebrow">Lexicon Crossword</p>
            <h1>Word Weaver</h1>
          </div>
          <div class="controls" aria-label="Puzzle controls">
            <label class="select-control" for="gradeLevel">
              <span>Grade</span>
              <select id="gradeLevel">
                <option value="preK,K">Pre-K & K</option>
                <option value="1,2" selected>1st – 2nd</option>
                <option value="3,4">3rd – 4th</option>
                <option value="5+">5th & up</option>
                <option value="Adult">Adult</option>
              </select>
            </label>
            <label class="select-control" for="puzzleSize">
              <span>Size</span>
              <select id="puzzleSize">
                <option value="6">Small (6 words)</option>
                <option value="10" selected>Medium (10 words)</option>
                <option value="14">Large (14 words)</option>
              </select>
            </label>
            <button id="newPuzzle" type="button">New Puzzle</button>
            <button id="checkPuzzle" type="button">Check</button>
            <button id="revealPuzzle" type="button" class="ghost">Reveal</button>
            <a id="studyBtn" class="btn-link" href="study.html" target="_blank" rel="noopener">Study Sheet ↗</a>
            <a id="printBtn" class="btn-link" href="print.html" target="_blank" rel="noopener">Print Puzzle ↗</a>
            <button id="openIdBtn" type="button" class="ghost">Open by ID</button>
          </div>
        </header>

        <div class="status-strip" id="statusStrip" aria-live="polite">
          <span id="statusText">Pick a word in the grid and start typing.</span>
          <span class="id-chip" title="Click to copy puzzle ID">
            <span class="id-chip-label">Puzzle</span>
            <code id="puzzleIdLabel">—</code>
          </span>
          <strong id="progressText">0 / 0</strong>
        </div>

        <div class="active-clue" id="activeClue" aria-live="polite">
          <button class="clue-nav" id="prevClue" type="button" aria-label="Previous clue">‹</button>
          <div class="active-clue-body">
            <span class="active-clue-label" id="activeLabel"></span>
            <span class="active-clue-text" id="activeText">Tap a cell to begin.</span>
          </div>
          <button class="clue-nav" id="nextClue" type="button" aria-label="Next clue">›</button>
        </div>

        <div class="board-wrap">
          <div class="crossword-board" id="board" aria-label="Crossword grid"></div>
          <p id="boardEmpty" class="board-empty" hidden>Loading lexicon…</p>
        </div>
      </section>

      <aside class="clue-panel" id="cluePanel" aria-label="Clues">
        <button class="clue-drawer-toggle" id="clueDrawerToggle" type="button" aria-expanded="false">
          <span>All clues</span>
          <span class="caret" aria-hidden="true">▾</span>
        </button>
        <div class="clue-panel-body">
          <div class="clue-section">
            <p class="eyebrow">Across</p>
            <ol class="clue-list" id="acrossClues"></ol>
          </div>
          <div class="clue-section">
            <p class="eyebrow">Down</p>
            <ol class="clue-list" id="downClues"></ol>
          </div>
        </div>
      </aside>
    </main>

    <input
      id="hiddenInput"
      class="hidden-input"
      type="text"
      inputmode="text"
      autocapitalize="characters"
      autocomplete="off"
      autocorrect="off"
      spellcheck="false"
      aria-hidden="true"
      tabindex="-1"
    />

    <script src="generator.js?v=6"></script>
    <script src="script.js?v=6"></script>
  </body>
</html>
