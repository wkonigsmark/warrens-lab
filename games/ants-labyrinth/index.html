<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ant's Labyrinth — Maze Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" data-theme="classic">
    <!-- LEFT PANEL: CONTROLS -->
    <aside class="panel-left no-print">
      <header class="brand">
        <div class="brand-icon">🐜</div>
        <div>
          <h1>Ant's Labyrinth</h1>
          <p class="brand-sub">Printable maze generator</p>
        </div>
      </header>

      <section class="control-group">
        <label class="group-label">Age</label>
        <div class="age-row" id="ageButtons">
          <button class="age-btn" data-age="3-4">3–4</button>
          <button class="age-btn active" data-age="5-6">5–6</button>
          <button class="age-btn" data-age="7-8">7–8</button>
          <button class="age-btn" data-age="9-10">9–10</button>
        </div>
        <p class="age-hint" id="ageHint">Light braiding, clear markers — for kindergarten.</p>
      </section>

      <section class="control-group">
        <label class="group-label" for="mazeType">Maze type</label>
        <div class="tab-row" id="typeTabs">
          <button class="tab-btn active" data-type="rect">Rectangular</button>
          <button class="tab-btn" data-type="hex" title="Stub — coming soon">Hex</button>
          <button class="tab-btn" data-type="theta" title="Stub — coming soon">Circular</button>
        </div>
      </section>

      <section class="control-group">
        <label class="group-label" for="algorithm">Algorithm</label>
        <select id="algorithm" class="select">
          <!-- options injected from JS so descriptions stay in one place -->
        </select>
        <p class="algo-hint" id="algoHint"></p>
      </section>

      <section class="control-group">
        <label class="group-label" for="theme">Theme</label>
        <select id="theme" class="select">
          <option value="classic">Classic — print friendly</option>
          <option value="dungeon">Dungeon — stone &amp; torchlight</option>
          <option value="forest">Forest — green canopy</option>
          <option value="space">Space — neon nebula</option>
          <option value="handdrawn">Hand-drawn — wobbly lines</option>
        </select>
      </section>

      <section class="control-group">
        <label class="group-label">Fine-tune</label>
        <div class="slider-row">
          <span class="slider-label">Cols <span id="colsVal">10</span></span>
          <input id="cols" type="range" min="3" max="40" value="10">
        </div>
        <div class="slider-row">
          <span class="slider-label">Rows <span id="rowsVal">7</span></span>
          <input id="rows" type="range" min="3" max="40" value="7">
        </div>
        <div class="slider-row">
          <span class="slider-label">Braid % <span id="braidVal">30</span></span>
          <input id="braid" type="range" min="0" max="100" value="30">
        </div>
        <div class="slider-row">
          <span class="slider-label">Wall thickness <span id="wallVal">2</span></span>
          <input id="wall" type="range" min="1" max="6" value="2" step="0.5">
        </div>
      </section>

      <section class="control-group">
        <label class="group-label">Seed</label>
        <div class="seed-row">
          <input id="seed" class="seed-input" type="text" value="">
          <button id="reseed" class="icon-btn" title="New seed">🎲</button>
        </div>
      </section>
    </aside>

    <!-- RIGHT PANEL: PREVIEW -->
    <main class="panel-main">
      <div class="print-header">
        <div class="print-name">Name: ______________________________</div>
        <div class="print-meta">
          <span id="printTitle">Ant's Labyrinth</span>
          <span class="print-date">Date: __________</span>
        </div>
      </div>

      <div class="maze-frame" id="mazeFrame">
        <!-- SVG injected here -->
      </div>

      <div class="print-footer no-print-screen">
        <span>🐜 burnmark.games</span>
      </div>
    </main>

    <!-- BOTTOM BAR -->
    <nav class="bottom-bar no-print">
      <button id="btnNew" class="bar-btn primary">↻ New Maze</button>
      <button id="btnSolve" class="bar-btn">👁 Show Solution</button>
      <button id="btnPrint" class="bar-btn">🖨 Print</button>
      <button id="btnShare" class="bar-btn">🔗 Copy Link</button>
      <span id="toast" class="toast"></span>
    </nav>
  </div>

  <script src="js/rng.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/algorithms.js"></script>
  <script src="js/solver.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
