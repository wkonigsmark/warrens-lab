<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FourSight</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #180e08;
            --panel-bg: #2a1a0e;
            --panel-border: #4a3020;
            --sq-light: #C8934A;
            --sq-dark: #6B3A1A;
            --chip-red: #DC2626;
            --chip-black: #1a1a1a;
            --chip-empty-light: rgba(0,0,0,0.25);
            --chip-empty-dark: rgba(0,0,0,0.35);
            --text-primary: #f5e6d0;
            --text-secondary: #a08060;
            --board-frame: #2d1a08;
            --board-frame-shadow: #150c04;
            --amber: #C8934A;
            --amber-light: #e8b870;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image:
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 120px,
                    rgba(255,255,255,0.015) 120px,
                    rgba(255,255,255,0.015) 121px
                ),
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 80px,
                    rgba(255,255,255,0.01) 80px,
                    rgba(255,255,255,0.01) 81px
                );
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            gap: 4rem;
            transition: all 0.5s ease;
        }

        @media (max-width: 900px) {
            body {
                flex-direction: column;
                gap: 2rem;
                padding: 1rem;
                justify-content: flex-start;
            }
            .game-container {
                width: 100%;
                transform: scale(0.9);
            }
        }

        @media (max-width: 480px) {
            .game-container {
                transform: scale(0.75);
                margin-top: -3rem;
            }
            .cell {
                width: 50px !important;
                height: 50px !important;
            }
        }

        /* --- Game Board Styles --- */
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .header {
            text-align: center;
        }

        .header h1 {
            font-size: 2.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--amber-light) 0%, #e05a20 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.04em;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-weight: 500;
        }

        .status {
            font-size: 1.25rem;
            font-weight: 600;
            padding: 0.5rem 1.5rem;
            border-radius: 2rem;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.4);
        }

        .turn-indicator {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px rgba(0,0,0,0.5);
        }

        /* Board: wood-grain frame with checkerboard squares */
        .board-wrap {
            padding: 14px;
            border-radius: 12px;
            background:
                repeating-linear-gradient(
                    88deg,
                    transparent,
                    transparent 3px,
                    rgba(255,255,255,0.04) 3px,
                    rgba(255,255,255,0.04) 4px
                ),
                repeating-linear-gradient(
                    2deg,
                    transparent,
                    transparent 8px,
                    rgba(0,0,0,0.08) 8px,
                    rgba(0,0,0,0.08) 9px
                ),
                linear-gradient(170deg, #5c3010 0%, #3a1e08 40%, #4a2810 70%, #2d1508 100%);
            box-shadow:
                0 0 0 4px var(--board-frame-shadow),
                0 20px 40px rgba(0,0,0,0.7),
                inset 0 1px 0 rgba(255,255,255,0.08);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: 6px;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .board.flipped {
            transform: rotateY(180deg);
        }

        .cell {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            position: relative;
            transition: background-color 0.2s ease;
        }

        /* Checkerboard empty cells */
        .cell.sq-light {
            background: radial-gradient(circle at 38% 35%, rgba(255,255,255,0.12) 0%, transparent 60%),
                        var(--chip-empty-light);
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.4), inset 0 -1px 2px rgba(255,255,255,0.05);
        }

        .cell.sq-dark {
            background: radial-gradient(circle at 38% 35%, rgba(255,255,255,0.06) 0%, transparent 60%),
                        var(--chip-empty-dark);
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.5), inset 0 -1px 2px rgba(255,255,255,0.03);
        }

        /* Hover previews */
        .cell.hover-red::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 38% 35%, rgba(255,150,150,0.25) 0%, rgba(220,38,38,0.35) 100%);
            border-radius: 50%;
        }

        .cell.hover-black::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 38% 35%, rgba(100,100,100,0.25) 0%, rgba(30,30,30,0.45) 100%);
            border-radius: 50%;
        }

        /* Placed tokens — 3D radial gradient */
        .cell.red {
            background:
                radial-gradient(circle at 38% 32%, rgba(255,180,180,0.55) 0%, rgba(220,60,60,0.0) 45%),
                radial-gradient(circle at 50% 50%, #ef5555 0%, #b91c1c 55%, #7f1d1d 100%);
            box-shadow:
                inset 0 -4px 8px rgba(0,0,0,0.4),
                inset 0 3px 6px rgba(255,200,200,0.2),
                0 3px 8px rgba(0,0,0,0.5);
        }

        .cell.black {
            background:
                radial-gradient(circle at 38% 32%, rgba(200,200,200,0.18) 0%, rgba(80,80,80,0.0) 45%),
                radial-gradient(circle at 50% 50%, #444444 0%, #1f1f1f 55%, #0a0a0a 100%);
            box-shadow:
                inset 0 -4px 8px rgba(0,0,0,0.6),
                inset 0 3px 6px rgba(255,255,255,0.07),
                0 3px 8px rgba(0,0,0,0.6);
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        button {
            padding: 0.85rem 1.5rem;
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            background: var(--panel-bg);
            color: var(--text-primary);
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 0px 0 var(--board-frame-shadow);
            min-width: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        button:hover {
            background: #3a2410;
            transform: translateY(-2px);
            box-shadow: 0 6px 0px 0 var(--board-frame-shadow);
            border-color: var(--amber);
            color: var(--amber-light);
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0px 0 var(--board-frame-shadow);
        }

        button.active {
            background: #5c2800;
            color: var(--amber-light);
            border-color: var(--amber);
            box-shadow: 0 4px 0px 0 #2d1400, 0 0 12px rgba(200,147,74,0.3);
        }

        button.active:hover {
            background: #6e3000;
            box-shadow: 0 6px 0px 0 #2d1400, 0 0 16px rgba(200,147,74,0.4);
        }

        button.active:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0px 0 #2d1400;
        }

        /* Mode select */
        select {
            padding: 1rem 1.5rem;
            border-radius: 14px;
            background: var(--panel-bg);
            color: var(--text-primary);
            border: 1px solid var(--panel-border);
            outline: none;
            font-family: Outfit;
            font-weight: 700;
            cursor: pointer;
            height: 55px;
            min-width: 240px;
            box-shadow: 0 4px 0px 0 var(--board-frame-shadow);
            font-size: 1rem;
            text-align-last: center;
        }

        select option {
            background: var(--panel-bg);
            color: var(--text-primary);
        }

        /* --- Protégé Mode Styles --- */
        .prob-container {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            width: 100%;
            padding: 0 14px;
            opacity: 0;
            transition: opacity 0.3s;
            margin-bottom: 0.5rem;
        }

        .prob-container.active {
            opacity: 1;
        }

        .prob-indicator {
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 700;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
        }

        .prob-indicator.best {
            color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
            box-shadow: 0 0 10px rgba(74, 222, 128, 0.2);
        }

        .cell.best-move {
            outline: 3px solid rgba(74, 222, 128, 0.5);
            outline-offset: 2px;
        }

        /* --- Win Sequence Effects --- */
        .board.game-over .cell:not(.winner) {
            filter: grayscale(1) opacity(0.3);
            transition: filter 1s ease, opacity 1s ease;
        }

        .cell.winner {
            z-index: 10;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5),
                        inset 0 0 15px rgba(255, 255, 255, 0.3);
            animation: luminous 1.5s infinite alternate;
        }

        @keyframes luminous {
            from {
                filter: brightness(1) saturate(1);
                transform: scale(1);
            }
            to {
                filter: brightness(1.6) saturate(1.4);
                transform: scale(1.08);
            }
        }
    </style>
</head>
<body>

    <!-- Game Section -->
    <div class="game-container">
        <div class="header">
            <h1>FourSight</h1>
            <p>Strategy Lab</p>

            <div style="margin-top: 1.5rem; display: flex; flex-direction: column; align-items: center; gap: 0.5rem;">
                <span style="font-weight: 700; color: var(--text-secondary); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em;">Game Mode</span>
                <select id="game-mode" onchange="resetGame()">
                    <option value="pvp">2 Player (PvP)</option>
                    <option value="easy">1 Player vs AI (Easy)</option>
                    <option value="medium">1 Player vs AI (Medium)</option>
                    <option value="hard">1 Player vs AI (Hard)</option>
                </select>
            </div>
        </div>

        <div class="status" id="status-display">
            <span class="turn-indicator" id="turn-dot" style="background-color: var(--chip-red);"></span>
            <span id="turn-text">Red's Turn</span>
        </div>

        <div style="display: flex; flex-direction: column; align-items: center; width: fit-content;">
            <div class="prob-container" id="prob-container">
                <!-- Probabilities injected here -->
            </div>

            <div class="board-wrap">
                <div class="board" id="board">
                    <!-- JS will generate the 6x7 grid here -->
                </div>
            </div>
        </div>

        <div style="display: flex; flex-direction: column; align-items: center; gap: 1.5rem; width: 100%;">
            <button id="protege-toggle" style="min-width: 240px; height: 50px; font-size: 1rem;" onclick="toggleProtege()">Protégé Mode: OFF</button>

            <div class="controls">
                <button style="height: 50px;" onclick="toggleFlip()">Flip View</button>
                <button style="height: 50px;" onclick="resetGame()">Restart Game</button>
            </div>
        </div>
    </div>


    <script>
        const ROWS = 6;
        const COLS = 7;
        let currentPlayer = 'red'; // 'red' or 'black'
        let boardState = [];
        let gameActive = true;
        let isHumanTurn = true;
        let protegeMode = false;

        const boardElement = document.getElementById('board');
        const turnText = document.getElementById('turn-text');
        const turnDot = document.getElementById('turn-dot');
        const modeSelect = document.getElementById('game-mode');
        const probContainer = document.getElementById('prob-container');
        const protegeToggle = document.getElementById('protege-toggle');

        function toggleFlip() {
            boardElement.classList.toggle('flipped');
        }

        function toggleProtege() {
            protegeMode = !protegeMode;
            protegeToggle.innerText = `Protégé Mode: ${protegeMode ? 'ON' : 'OFF'}`;
            protegeToggle.classList.toggle('active', protegeMode);
            probContainer.classList.toggle('active', protegeMode);
            if (protegeMode) updateProtege();
            else clearProtegeStyles();
        }

        function clearProtegeStyles() {
            document.querySelectorAll('.cell').forEach(c => c.classList.remove('best-move'));
        }

        function initBoard() {
            boardElement.innerHTML = '';
            boardElement.classList.remove('game-over');
            probContainer.innerHTML = '';
            boardState = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));
            gameActive = true;
            currentPlayer = 'red';
            isHumanTurn = true;
            updateTurnDisplay();

            // Create prob indicators
            for (let c = 0; c < COLS; c++) {
                const indicator = document.createElement('div');
                indicator.classList.add('prob-indicator');
                indicator.id = `prob-${c}`;
                indicator.innerText = '-';
                probContainer.appendChild(indicator);
            }

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    // Checkerboard square coloring
                    cell.classList.add((r + c) % 2 === 0 ? 'sq-light' : 'sq-dark');
                    cell.dataset.row = r;
                    cell.dataset.col = c;

                    cell.addEventListener('click', () => handleDrop(c));
                    cell.addEventListener('mouseenter', () => handleHover(c, true));
                    cell.addEventListener('mouseleave', () => handleHover(c, false));

                    boardElement.appendChild(cell);
                }
            }
        }

        function handleHover(col, isEnter) {
            if (!gameActive || !isHumanTurn) return;

            document.querySelectorAll('.cell').forEach(cell => {
                cell.classList.remove('hover-red', 'hover-black');
            });

            if (isEnter) {
                for (let r = ROWS - 1; r >= 0; r--) {
                    if (!boardState[r][col]) {
                        const cell = getCellElement(r, col);
                        cell.classList.add(`hover-${currentPlayer}`);
                        break;
                    }
                }
            }
        }

        function handleDrop(col) {
            if (!gameActive || !isHumanTurn) return;
            executeMove(col);
        }

        function executeMove(col) {
            for (let r = ROWS - 1; r >= 0; r--) {
                if (!boardState[r][col]) {
                    boardState[r][col] = currentPlayer;
                    const cell = getCellElement(r, col);
                    cell.classList.remove('sq-light', 'sq-dark', 'hover-red', 'hover-black');
                    cell.classList.add(currentPlayer);

                    const winResult = checkWin(boardState, currentPlayer);
                    if (winResult) {
                        turnText.innerText = `${currentPlayer === 'red' ? 'Red' : 'Black'} Wins!`;
                        gameActive = false;
                        boardElement.classList.add('game-over');
                        winResult.forEach(([wr, wc]) => {
                            getCellElement(wr, wc).classList.add('winner');
                        });
                        return;
                    }

                    if (checkDraw(boardState)) {
                        turnText.innerText = "It's a Draw!";
                        turnDot.style.backgroundColor = 'transparent';
                        gameActive = false;
                        return;
                    }

                    currentPlayer = currentPlayer === 'red' ? 'black' : 'red';
                    updateTurnDisplay();

                    if (protegeMode) updateProtege();

                    if (modeSelect.value !== 'pvp' && currentPlayer === 'black') {
                        isHumanTurn = false;
                        document.querySelectorAll('.cell').forEach(c => c.classList.remove('hover-red', 'hover-black'));
                        turnText.innerText = "AI is thinking...";
                        setTimeout(makeAIMove, 500);
                    } else {
                        isHumanTurn = true;
                    }

                    return;
                }
            }
        }

        function updateTurnDisplay() {
            const label = currentPlayer === 'red' ? 'Red' : 'Black';
            turnText.innerText = `${label}'s Turn`;
            turnDot.style.backgroundColor = currentPlayer === 'red' ? 'var(--chip-red)' : 'var(--chip-black)';
            turnDot.style.border = currentPlayer === 'black' ? '1px solid #555' : 'none';
        }

        function getCellElement(r, c) {
            return document.querySelector(`.cell[data-row='${r}'][data-col='${c}']`);
        }

        function checkWin(board, player) {
            // Horizontal
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS - 3; c++) {
                    if (board[r][c] === player && board[r][c+1] === player && board[r][c+2] === player && board[r][c+3] === player)
                        return [[r, c], [r, c+1], [r, c+2], [r, c+3]];
                }
            }
            // Vertical
            for (let r = 0; r < ROWS - 3; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (board[r][c] === player && board[r+1][c] === player && board[r+2][c] === player && board[r+3][c] === player)
                        return [[r, c], [r+1, c], [r+2, c], [r+3, c]];
                }
            }
            // Diagonal /
            for (let r = 3; r < ROWS; r++) {
                for (let c = 0; c < COLS - 3; c++) {
                    if (board[r][c] === player && board[r-1][c+1] === player && board[r-2][c+2] === player && board[r-3][c+3] === player)
                        return [[r, c], [r-1, c+1], [r-2, c+2], [r-3, c+3]];
                }
            }
            // Diagonal \
            for (let r = 0; r < ROWS - 3; r++) {
                for (let c = 0; c < COLS - 3; c++) {
                    if (board[r][c] === player && board[r+1][c+1] === player && board[r+2][c+2] === player && board[r+3][c+3] === player)
                        return [[r, c], [r+1, c+1], [r+2, c+2], [r+3, c+3]];
                }
            }
            return null;
        }

        function checkDraw(board) {
            return board[0].every(cell => cell !== null);
        }

        // --- AI LOGIC ---
        function getValidLocations(board) {
            let valid = [];
            for (let c = 0; c < COLS; c++) {
                if (!board[0][c]) valid.push(c);
            }
            return valid;
        }

        function getNextOpenRow(board, c) {
            for (let r = ROWS - 1; r >= 0; r--) {
                if (!board[r][c]) return r;
            }
            return -1;
        }

        function evaluateWindow(window, piece) {
            let score = 0;
            const oppPiece = piece === 'black' ? 'red' : 'black';

            let pieces = 0, empty = 0, opps = 0;
            for (let i = 0; i < 4; i++) {
                if (window[i] === piece) pieces++;
                else if (window[i] === null) empty++;
                else if (window[i] === oppPiece) opps++;
            }

            if (pieces === 4) score += 100;
            else if (pieces === 3 && empty === 1) score += 5;
            else if (pieces === 2 && empty === 2) score += 2;
            if (opps === 3 && empty === 1) score -= 4;

            return score;
        }

        function scorePosition(board, piece) {
            let score = 0;

            let centerArray = [];
            for (let r = 0; r < ROWS; r++) centerArray.push(board[r][3]);
            score += centerArray.filter(v => v === piece).length * 3;

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS - 3; c++) {
                    score += evaluateWindow(board[r].slice(c, c + 4), piece);
                }
            }

            for (let c = 0; c < COLS; c++) {
                let colArray = [];
                for (let r = 0; r < ROWS; r++) colArray.push(board[r][c]);
                for (let r = 0; r < ROWS - 3; r++) {
                    score += evaluateWindow(colArray.slice(r, r + 4), piece);
                }
            }

            for (let r = 0; r < ROWS - 3; r++) {
                for (let c = 0; c < COLS - 3; c++) {
                    score += evaluateWindow([board[r][c], board[r+1][c+1], board[r+2][c+2], board[r+3][c+3]], piece);
                    score += evaluateWindow([board[r+3][c], board[r+2][c+1], board[r+1][c+2], board[r][c+3]], piece);
                }
            }

            return score;
        }

        function isTerminalNode(board) {
            return checkWin(board, 'red') || checkWin(board, 'black') || getValidLocations(board).length === 0;
        }

        function minimax(board, depth, alpha, beta, maximizingPlayer) {
            let validLocations = getValidLocations(board);
            let isTerminal = isTerminalNode(board);

            if (depth === 0 || isTerminal) {
                if (isTerminal) {
                    if (checkWin(board, 'black')) return { score: 100000000000000 };
                    else if (checkWin(board, 'red')) return { score: -100000000000000 };
                    else return { score: 0 };
                } else {
                    return { score: scorePosition(board, 'black') };
                }
            }

            if (maximizingPlayer) {
                let value = -Infinity;
                let bestCol = validLocations[Math.floor(Math.random() * validLocations.length)];
                for (let c of validLocations) {
                    let r = getNextOpenRow(board, c);
                    let bCopy = board.map(arr => [...arr]);
                    bCopy[r][c] = 'black';
                    let newScore = minimax(bCopy, depth - 1, alpha, beta, false).score;
                    if (newScore > value) { value = newScore; bestCol = c; }
                    alpha = Math.max(alpha, value);
                    if (alpha >= beta) break;
                }
                return { col: bestCol, score: value };
            } else {
                let value = Infinity;
                let bestCol = validLocations[Math.floor(Math.random() * validLocations.length)];
                for (let c of validLocations) {
                    let r = getNextOpenRow(board, c);
                    let bCopy = board.map(arr => [...arr]);
                    bCopy[r][c] = 'red';
                    let newScore = minimax(bCopy, depth - 1, alpha, beta, true).score;
                    if (newScore < value) { value = newScore; bestCol = c; }
                    beta = Math.min(beta, value);
                    if (alpha >= beta) break;
                }
                return { col: bestCol, score: value };
            }
        }

        function makeAIMove() {
            if (!gameActive) return;
            const mode = modeSelect.value;
            let validLocations = getValidLocations(boardState);
            let colIndex;

            if (mode === 'easy') {
                colIndex = validLocations[Math.floor(Math.random() * validLocations.length)];
            } else if (mode === 'medium') {
                colIndex = minimax(boardState, 2, -Infinity, Infinity, true).col;
            } else if (mode === 'hard') {
                colIndex = minimax(boardState, 5, -Infinity, Infinity, true).col;
            }

            if (colIndex === undefined || colIndex === null) {
                colIndex = validLocations[Math.floor(Math.random() * validLocations.length)];
            }

            executeMove(colIndex);
        }

        function updateProtege() {
            if (!gameActive || !protegeMode) return;

            clearProtegeStyles();
            let validLocations = getValidLocations(boardState);
            let scores = {};
            let isMax = (currentPlayer === 'black');

            validLocations.forEach(c => {
                let r = getNextOpenRow(boardState, c);
                let bCopy = boardState.map(arr => [...arr]);
                bCopy[r][c] = currentPlayer;
                let result = minimax(bCopy, 4, -Infinity, Infinity, !isMax);
                scores[c] = result.score;
            });

            let scoreVals = Object.values(scores);
            let minS = Math.min(...scoreVals);
            let maxS = Math.max(...scoreVals);

            let bestCol = -1;
            let bestVal = isMax ? -Infinity : Infinity;

            for (let c in scores) {
                if (isMax) {
                    if (scores[c] > bestVal) { bestVal = scores[c]; bestCol = c; }
                } else {
                    if (scores[c] < bestVal) { bestVal = scores[c]; bestCol = c; }
                }
            }

            for (let c = 0; c < COLS; c++) {
                const indicator = document.getElementById(`prob-${c}`);
                indicator.classList.remove('best');

                if (scores[c] === undefined) {
                    indicator.innerText = 'FULL';
                    continue;
                }

                if (Math.abs(scores[c]) > 1e12) {
                    indicator.innerText = scores[c] * (isMax ? 1 : -1) > 0 ? 'WIN!' : 'LOSE';
                } else {
                    let p;
                    if (maxS === minS) p = 50;
                    else {
                        p = ((scores[c] - minS) / (maxS - minS)) * 100;
                        if (!isMax) p = 100 - p;
                    }
                    indicator.innerText = Math.round(p) + '%';
                }

                if (parseInt(c) === parseInt(bestCol)) {
                    indicator.classList.add('best');
                    let r = getNextOpenRow(boardState, c);
                    if (r !== -1) getCellElement(r, c).classList.add('best-move');
                }
            }
        }

        function resetGame() {
            initBoard();
        }

        window.onload = initBoard;
    </script>
