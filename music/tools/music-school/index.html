<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music School — Burnmark Productions</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="back" href="../../index.html">← Music</a>
    <h1>🎵 Music School</h1>
    <a class="back" href="worksheet.html">🖨️ Worksheets</a>
  </header>

  <!-- Start screen: pick a game + a level -->
  <section id="setup" class="card">
    <h2>Pick a game</h2>
    <div id="games" class="chips"></div>
    <h2>How tricky?</h2>
    <div id="levels" class="chips"></div>
    <button id="start" class="big">Let's go! ▶</button>
  </section>

  <!-- Quiz screen -->
  <section id="quiz" class="card hidden">
    <div class="scorebar">
      <span id="progress"></span>
      <span id="stars"></span>
    </div>
    <p id="prompt" class="prompt"></p>
    <div id="figure" class="figure"></div>
    <button id="listen" class="listen hidden">🔊 Listen again</button>
    <div id="choices" class="choices"></div>
    <div id="feedback" class="feedback"></div>
  </section>

  <!-- Done screen -->
  <section id="done" class="card hidden">
    <h2 id="done-title"></h2>
    <p id="done-score" class="prompt"></p>
    <button id="again" class="big">Play again ▶</button>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
