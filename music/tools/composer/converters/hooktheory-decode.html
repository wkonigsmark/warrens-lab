<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HookTheory → Composer Converter</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 { margin-top: 0; color: #333; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    .input-section, .output-section {
      display: flex;
      flex-direction: column;
    }
    label {
      font-weight: 600;
      margin-bottom: 8px;
      color: #555;
    }
    textarea {
      flex: 1;
      padding: 12px;
      font-family: "Monaco", "Courier New", monospace;
      font-size: 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      resize: vertical;
      min-height: 300px;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    input[type="text"], input[type="number"] {
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }
    button {
      padding: 10px 20px;
      background: #007aff;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background: #0051d5; }
    button.secondary {
      background: #666;
    }
    button.secondary:hover {
      background: #555;
    }
    .row {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }
    .row button {
      flex: 1;
    }
    .info {
      background: #f0f7ff;
      border-left: 4px solid #007aff;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #333;
    }
    .error {
      background: #fff0f0;
      border-left: 4px solid #ff3333;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      color: #c00;
    }
    .success {
      background: #f0f7f0;
      border-left: 4px solid #00aa00;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      color: #060;
    }
    code {
      background: #f5f5f5;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎼 HookTheory → Composer Converter</h1>
    <div class="info">
      Paste a HookTheory export JSON, configure the song metadata, and get a composer-ready JSON file.
      Currently extracts melody only; chord support coming soon to the roadmap.
    </div>

    <div class="controls">
      <div>
        <label>Song Title</label>
        <input type="text" id="title" placeholder="Song Title" value="Untitled">
      </div>
      <div>
        <label>Composer</label>
        <input type="text" id="composer" placeholder="Composer name">
      </div>
      <div>
        <label>Base Octave</label>
        <input type="number" id="baseOctave" min="2" max="6" value="4" title="Octave of the tonic note (1=octave above middle C)">
      </div>
      <div>
        <label>Time Signature</label>
        <select id="timeSig">
          <option value="4/4">4/4</option>
          <option value="3/4">3/4</option>
        </select>
      </div>
      <div>
        <label>Tempo (BPM)</label>
        <input type="number" id="tempo" min="40" max="200" value="96">
      </div>
    </div>

    <div class="grid">
      <div class="input-section">
        <label>HookTheory JSON (paste here)</label>
        <textarea id="hookInput" placeholder='Paste HookTheory export JSON here...'></textarea>
      </div>
      <div class="output-section">
        <label>Composer Song JSON (auto-generated)</label>
        <textarea id="composerOutput" placeholder="Output will appear here..." readonly></textarea>
      </div>
    </div>

    <div class="row">
      <button onclick="convertAndPreview()">Convert & Preview</button>
      <button class="secondary" onclick="downloadJSON()">Download JSON</button>
      <button class="secondary" onclick="copyToClipboard()">Copy to Clipboard</button>
    </div>

    <div id="status"></div>
  </div>

  <script>
    function sdToPitch(scaleDegree, tonic, mode = 'major') {
      const intervals = {
        major: [0, 2, 4, 5, 7, 9, 11],
        minor: [0, 2, 3, 5, 7, 8, 10],
        mixolydian: [0, 2, 4, 5, 7, 9, 10],
        dorian: [0, 2, 3, 5, 7, 9, 10],
      };

      const noteValues = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
      const notes = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];

      const tonicSemi = noteValues[tonic];
      const modeIntervals = intervals[mode] || intervals.major;
      const semitoneOffset = modeIntervals[(scaleDegree - 1) % 7];
      const pitchSemitone = (tonicSemi + semitoneOffset) % 12;

      for (const [letter, semi] of Object.entries(noteValues)) {
        if (semi === pitchSemitone) return letter;
      }
      return 'C';
    }

    function convertHookTheory(hookJson, config = {}) {
      const {
        title = 'Untitled',
        composer = '',
        baseOctave = 4,
        timeSignature = '4/4',
        tempo = 96,
      } = config;

      const keyInfo = hookJson.keys && hookJson.keys[0];
      const tonic = keyInfo?.tonic || 'C';
      const mode = keyInfo?.scale || 'major';

      const notes = (hookJson.notes || [])
        .map(note => {
          if (note.isRest) return null;
          const letter = sdToPitch(parseInt(note.sd), tonic, mode);
          const octave = baseOctave + note.octave;
          const pitch = `${letter}${octave}`;
          return {
            start: note.beat - 1,
            pitch,
            durBeats: note.duration,
          };
        })
        .filter(Boolean);

      const totalBeats = notes.reduce((m, n) => Math.max(m, n.start + n.durBeats), 0);
      const beatsPerBar = timeSignature === '3/4' ? 3 : 4;
      const bars = Math.max(4, Math.ceil(totalBeats / beatsPerBar));

      return {
        id: `song-${Date.now()}`,
        title,
        composer,
        rangeId: 'c5-a6',
        clef: 'treble',
        staffShift: -1,
        bars,
        timeSignature,
        durationId: 'quarter',
        tempo,
        showLetters: true,
        notes,
        source: 'hooktheory',
      };
    }

    function convertAndPreview() {
      const status = document.getElementById('status');
      try {
        const hookInput = document.getElementById('hookInput').value.trim();
        if (!hookInput) {
          status.innerHTML = '<div class="error">❌ Paste HookTheory JSON first</div>';
          return;
        }

        const hookJson = JSON.parse(hookInput);
        const config = {
          title: document.getElementById('title').value || 'Untitled',
          composer: document.getElementById('composer').value || '',
          baseOctave: parseInt(document.getElementById('baseOctave').value),
          timeSignature: document.getElementById('timeSig').value,
          tempo: parseInt(document.getElementById('tempo').value),
        };

        const song = convertHookTheory(hookJson, config);
        document.getElementById('composerOutput').value = JSON.stringify(song, null, 2);

        const noteCount = song.notes.length;
        const totalBeats = song.notes.reduce((m, n) => Math.max(m, n.start + n.durBeats), 0);
        status.innerHTML = `
          <div class="success">
            ✓ Converted! <strong>${noteCount} notes</strong>, <strong>${song.bars} bars</strong> at <strong>${totalBeats.toFixed(1)} beats</strong>
            <br>Key: <code>${hookJson.keys?.[0]?.tonic || 'C'} ${hookJson.keys?.[0]?.scale || 'major'}</code>
          </div>
        `;
      } catch (e) {
        status.innerHTML = `<div class="error">❌ Error: ${e.message}</div>`;
      }
    }

    function copyToClipboard() {
      const output = document.getElementById('composerOutput');
      if (!output.value) return;
      navigator.clipboard.writeText(output.value).then(() => {
        const status = document.getElementById('status');
        status.innerHTML = '<div class="success">✓ Copied to clipboard!</div>';
        setTimeout(() => { status.innerHTML = ''; }, 2000);
      });
    }

    function downloadJSON() {
      const output = document.getElementById('composerOutput');
      if (!output.value) return;
      const title = document.getElementById('title').value || 'song';
      const blob = new Blob([output.value], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${title.toLowerCase().replace(/\s+/g, '-')}.composer.json`;
      a.click();
    }

    // Auto-convert on input
    ['hookInput', 'title', 'composer', 'baseOctave', 'timeSig', 'tempo'].forEach(id => {
      document.getElementById(id).addEventListener('change', convertAndPreview);
    });
  </script>

  <style>
    select {
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }
  </style>
</body>
</html>
