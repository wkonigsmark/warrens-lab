<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rhythm Lab · Music</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/music/tools/composer/style.css">
  <link rel="stylesheet" href="/music/_shared/lessons/lessons.css">
</head>
<body>
  <script type="module" src="/music/_shared/music-nav.js"></script>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🥁</span>
      <div>
        <h1>Rhythm Lab <span class="beta-badge">BETA</span></h1>
        <p class="tagline">Read and play rhythms — whole, half, quarter, eighth &amp; sixteenth notes, in C major.</p>
      </div>
    </div>
    <a class="btn btn-ghost back-link" href="/music/index.html">← Music</a>
  </header>

  <main>
    <section class="lesson-pack" aria-label="Lessons">
      <div id="lesson-picker" class="lesson-picker" role="tablist" aria-label="Choose a lesson"></div>
      <div id="lesson-head" class="lesson-head"></div>
    </section>

    <section class="controls" aria-label="Lesson controls">
      <div class="control">
        <label>Key</label>
        <select id="key-select"></select>
      </div>

      <div class="control">
        <label>Instrument</label>
        <select id="instrument-select"></select>
      </div>

      <div class="control">
        <label>Tempo <span id="tempo-readout">80</span></label>
        <input id="tempo" type="range" min="50" max="140" step="2" value="80">
      </div>

      <div class="control">
        <label>Metronome</label>
        <button id="metronome-toggle" class="toggle" type="button" aria-pressed="false">🥁 Click</button>
      </div>

      <div class="control">
        <label>Mentor mode</label>
        <button id="letters-toggle" class="toggle" type="button" aria-pressed="false">🔤 Letters</button>
      </div>
    </section>

    <div id="lesson-sections"></div>

    <section class="library print-panel" aria-label="Print worksheet">
      <div class="library-head">
        <h2 class="library-title">🖨 Print worksheet</h2>
        <p class="library-sub">Pick the pages, then print. Letters-in-noteheads and instrument choice carry into the
          printout — B&amp;W by default, colour if you like.</p>
      </div>
      <div id="print-checks" class="print-checks"></div>
      <div class="gl-actions">
        <label class="print-check"><input id="print-color" type="checkbox"> 🎨 Colour print</label>
        <button id="print" class="btn btn-ghost">🖨 Print</button>
      </div>
    </section>
  </main>

  <!-- Print-only manuscript: a clean worksheet for the page. -->
  <section id="manuscript" class="manuscript" aria-hidden="true"></section>

  <script type="module" src="src/app.js"></script>
</body>
</html>
