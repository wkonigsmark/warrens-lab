<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson Builder · Guitar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar no-print">
    <div class="brand"><span class="logo">🎸</span>
      <div><h1>Lesson Builder</h1>
        <p class="tagline">Give it a chord progression + key — it writes the guitar lesson.</p></div>
    </div>
  </header>

  <section class="controls no-print">
    <label class="ctl-label" for="prog-input">Chord progression <span>(one phrase per line)</span></label>
    <textarea id="prog-input" rows="8" spellcheck="false"></textarea>
    <div class="ctl-row">
      <label>Assumed key
        <select id="key-tonic"></select>
        <select id="key-quality">
          <option value="major" selected>Major</option>
          <option value="minor">Minor</option>
        </select>
      </label>
      <button id="build-btn" class="btn btn-primary">Build lesson</button>
      <button id="print-btn" class="btn">🖨 Print</button>
    </div>
  </section>

  <main id="lesson" class="lesson"></main>

  <script type="module" src="app.js"></script>
</body>
</html>
