<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Domain - Burnmark Productions</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <meta name="theme-color" content="#1a1a1a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style-lab.css">
  <style>
    /* Pulsing BETA badge — flags in-progress tools at a glance. */
    .beta-badge {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 8px;
      font-size: 0.6em;
      font-weight: 800;
      letter-spacing: 1px;
      vertical-align: middle;
      color: #fff;
      background: #ff8a3d;
      border-radius: 999px;
      animation: beta-pulse 1.6s ease-in-out infinite;
    }
    @keyframes beta-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 138, 61, 0.55); opacity: 1; }
      50%      { box-shadow: 0 0 0 7px rgba(255, 138, 61, 0); opacity: 0.78; }
    }
    @media (prefers-reduced-motion: reduce) {
      .beta-badge { animation: none; }
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="tty-container">
      <span id="text"></span><span class="cursor"></span>
    </div>

    <nav id="main-nav" class="nav-menu">
      <a href="instruments/guitar/index.html" class="nav-item">
        <div class="item-icon">🎸</div>
        <div class="item-info">
          <h3 class="item-title">Guitar Theory</h3>
          <p class="item-subtext">Scales & Modal Analysis</p>
        </div>
      </a>
      <a href="tools/key-finder/index.html" class="nav-item">
        <div class="item-icon">🧭</div>
        <div class="item-info">
          <h3 class="item-title">Key Finder</h3>
          <p class="item-subtext">Chord → Scale, Mode & Key</p>
        </div>
      </a>
      <a href="tools/music-school/index.html" class="nav-item">
        <div class="item-icon">🎵</div>
        <div class="item-info">
          <h3 class="item-title">Music School</h3>
          <p class="item-subtext">Theory Games & Worksheets for Kids</p>
        </div>
      </a>
      <a href="tools/studio/index.html" class="nav-item">
        <div class="item-icon">🎹</div>
        <div class="item-info">
          <h3 class="item-title">Composer Studio <span class="beta-badge">BETA</span></h3>
          <p class="item-subtext">Compose · Capture · Sing — 3 tools</p>
        </div>
      </a>
      <a href="../index.html" class="nav-item">
        <div class="item-icon">🔙</div>
        <div class="item-info">
          <h3 class="item-title">Back to Lab</h3>
          <p class="item-subtext">Return to Main Hub</p>
        </div>
      </a>
    </nav>
  </div>

  <div id="skip-hint" class="skip-hint">Click Anywhere to Skip</div>

  <script>
    (function () {
      const TEXT = "Tuning oscillators, warming up tubes...";
      const textEl = document.getElementById("text");
      const navEl = document.getElementById("main-nav");
      const hintEl = document.getElementById("skip-hint");
      let i = 0; let isSkipped = false;
      function getStaggeredDelay(char) {
        if (isSkipped) return 0;
        let delay = Math.floor(60 + Math.random() * 60);
        if (char === " ") delay += 100;
        if (char === ",") delay += 300;
        return delay;
      }
      function skip() {
        if (isSkipped) return;
        isSkipped = true;
        textEl.textContent = TEXT;
        showMenu();
      }
      function showMenu() {
        navEl.classList.add("visible");
        const items = navEl.querySelectorAll(".nav-item");
        items.forEach((item, index) => {
          setTimeout(() => { item.classList.add("revealed"); }, index * 120);
        });
        hintEl.style.opacity = "0";
        setTimeout(() => hintEl.remove(), 400);
      }
      function type() {
        if (isSkipped) return;
        textEl.textContent = TEXT.slice(0, i++);
        if (i <= TEXT.length) {
          setTimeout(type, getStaggeredDelay(TEXT[i - 1]));
        } else {
          setTimeout(showMenu, 400);
        }
      }
      document.addEventListener('click', skip);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') skip();
      });
      setTimeout(type, 300);
    })();
  </script>
</body>
</html>
