<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soccer Drill Library</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="theme-color" content="#1a1a1a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../../style-lab.css">
  <link rel="stylesheet" href="../shared/soccer.css">
  <link rel="stylesheet" href="../shared/themes.css">
  <style>
    .library-head { align-items: flex-start; }
    .library-head p { max-width: 680px; margin: 8px 0 0; color: var(--text-dim); line-height: 1.45; }
    .tools { display: grid; grid-template-columns: 1.4fr 0.8fr 1fr; gap: 10px; margin-bottom: 14px; }
    .tools input, .tools select {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      background: rgba(0,0,0,0.24);
      color: var(--text-main);
      font: inherit;
      padding: 8px 10px;
    }
    .quick-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .drill-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .drill-card { display: flex; flex-direction: column; gap: 12px; min-height: 270px; }
    .drill-card h3 { margin: 0; font-size: 1.12rem; }
    .drill-card p { margin: 0; color: var(--text-dim); line-height: 1.45; }
    .drill-meta { display: flex; flex-wrap: wrap; gap: 6px; }
    .mini {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border: 1px solid var(--glass-border);
      border-radius: 6px;
      padding: 3px 7px;
      color: var(--text-dim);
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .mini.level-beginner { color: var(--dos-green); border-color: rgba(51,255,51,0.4); }
    .mini.level-advanced { color: #7ad0ff; border-color: rgba(122,208,255,0.4); }
    .mini.level-expert { color: #ffd166; border-color: rgba(255,209,102,0.4); }
    .card-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }
    .action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      border: 1px solid rgba(51,255,51,0.36);
      border-radius: 8px;
      padding: 7px 10px;
      color: var(--dos-green);
      text-decoration: none;
      font-size: 0.86rem;
    }
    .action.secondary { color: var(--text-dim); border-color: var(--glass-border); }
    .reference { margin-top: 16px; }
    .reference a { color: var(--dos-green); }
    @media (max-width: 720px) {
      .tools { grid-template-columns: 1fr; }
      .drill-card { min-height: 0; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="crumbs"><a href="../../../index.html">Sports</a> / <a href="../index.html">Dynasty Soccer</a> / Drill Library</div>
    <div class="head library-head">
      <div>
        <h1>Soccer Drill Library</h1>
        <p>Free, public, single-drill resources for U6-U8 rec coaching. Use the filters to find a quick fit for the next practice block.</p>
      </div>
      <div id="count" class="status">Loading...</div>
    </div>

    <section class="card">
      <h2>Find a drill</h2>
      <div class="tools">
        <input id="search" type="search" placeholder="Search title, source, notes, equipment...">
        <select id="difficulty">
          <option value="">All difficulties</option>
          <option value="beginner">Beginner</option>
          <option value="advanced">Advanced</option>
          <option value="expert">Expert</option>
        </select>
        <select id="specialty">
          <option value="">All specialties</option>
        </select>
      </div>
      <div id="quick-filters" class="quick-filters"></div>
    </section>

    <section class="card">
      <h2>Back to a team</h2>
      <div class="filters practice-links" id="team-links"><span class="dim">Loading teams…</span></div>
    </section>

    <section id="drills" class="drill-grid"></section>
    <p id="empty" class="empty" hidden>No drills match those filters.</p>
    <p id="reference" class="hint reference"></p>
  </main>

  <script type="module">
    import { esc, sb, clubKey } from '../shared/db.js';
    import { loadDrills, filterDrills, label, QUICK_SPECIALTIES } from '../shared/drills.js';

    const searchEl = document.getElementById('search');
    const difficultyEl = document.getElementById('difficulty');
    const specialtyEl = document.getElementById('specialty');
    const quickFiltersEl = document.getElementById('quick-filters');
    const drillsEl = document.getElementById('drills');
    const emptyEl = document.getElementById('empty');
    const countEl = document.getElementById('count');
    const referenceEl = document.getElementById('reference');

    const quickSpecialties = QUICK_SPECIALTIES;
    let db;
    let activeQuick = '';

    function render() {
      const filtered = filterDrills(db.drills, {
        q: searchEl.value, difficulty: difficultyEl.value, specialty: specialtyEl.value || activeQuick,
      });
      drillsEl.innerHTML = filtered.map(drill => `
        <article class="card drill-card">
          <div>
            <h3>${esc(drill.title)}</h3>
            <p>${esc(drill.summary)}</p>
          </div>
          <div class="drill-meta">
            <span class="mini level-${esc(drill.difficulty)}">${esc(drill.difficulty)}</span>
            <span class="mini">${esc(drill.ageRange)}</span>
            <span class="mini">${esc(drill.durationMinutes)} min</span>
            <span class="mini">${esc(drill.players)}</span>
          </div>
          <p>${esc(drill.whyUseIt)}</p>
          <p><strong>Cues:</strong> ${esc(drill.coachingCues.join(' · '))}</p>
          <p><strong>Gear:</strong> ${esc(drill.equipment.join(', '))}</p>
          <div class="drill-meta">
            ${drill.specialties.slice(0, 5).map(tag => `<span class="mini">${esc(label(tag))}</span>`).join('')}
          </div>
          <div class="card-actions">
            <a class="action" href="${esc(drill.sourceUrl)}" target="_blank" rel="noopener">Open drill</a>
            ${drill.videoUrl ? `<a class="action secondary" href="${esc(drill.videoUrl)}" target="_blank" rel="noopener">Video</a>` : ''}
          </div>
        </article>
      `).join('');
      emptyEl.hidden = filtered.length !== 0;
      countEl.textContent = `${filtered.length} of ${db.drills.length}`;
      for (const button of quickFiltersEl.querySelectorAll('button')) {
        button.classList.toggle('on', button.dataset.specialty === activeQuick);
      }
    }

    async function init() {
      db = await loadDrills('..');

      for (const specialty of db.specialties) {
        const option = document.createElement('option');
        option.value = specialty;
        option.textContent = label(specialty);
        specialtyEl.appendChild(option);
      }

      quickFiltersEl.innerHTML = [
        '<button class="chip on" data-specialty="">All</button>',
        ...quickSpecialties.map(s => `<button class="chip" data-specialty="${esc(s)}">${esc(label(s))}</button>`)
      ].join('');

      quickFiltersEl.addEventListener('click', event => {
        const button = event.target.closest('button[data-specialty]');
        if (!button) return;
        activeQuick = button.dataset.specialty;
        specialtyEl.value = '';
        render();
      });

      for (const el of [searchEl, difficultyEl, specialtyEl]) {
        el.addEventListener('input', () => {
          if (el === specialtyEl) activeQuick = '';
          render();
        });
      }

      // Deep links from team pages: ?specialty=dribbling&difficulty=beginner&q=cones
      const params = new URLSearchParams(location.search);
      if (params.get('q')) searchEl.value = params.get('q');
      if (params.get('difficulty')) difficultyEl.value = params.get('difficulty');
      if (params.get('specialty')) {
        if (quickSpecialties.includes(params.get('specialty'))) activeQuick = params.get('specialty');
        else specialtyEl.value = params.get('specialty');
      }

      // Team shortcuts back out of the library.
      sb('teams?sport_id=eq.soccer&active=eq.true&select=name,slug&order=name.asc')
        .then(teams => {
          document.getElementById('team-links').innerHTML = teams.map(t =>
            `<a class="chip" data-club="${esc(clubKey(t.slug))}" href="../teams/${encodeURIComponent(t.slug)}/index.html">${esc(t.name)}</a>`).join('')
            || '<span class="dim">No teams yet.</span>';
        })
        .catch(() => { document.getElementById('team-links').innerHTML = '<a class="chip" href="../index.html">All teams</a>'; });

      referenceEl.innerHTML = `Age guidance: <a href="${esc(db.developmentReference.url)}" target="_blank" rel="noopener">${esc(db.developmentReference.title)}</a>. ${esc(db.developmentReference.notes)}`;
      render();
    }

    init().catch(err => {
      console.error(err);
      countEl.textContent = 'Error';
      countEl.classList.add('err');
      drillsEl.innerHTML = `<section class="card"><p class="empty">${esc(err.message)}</p></section>`;
    });
  </script>
</body>
</html>
