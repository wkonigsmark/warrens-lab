<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warren's World Cup Pool</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07130f;
      --ink: #f7f4eb;
      --muted: rgba(247, 244, 235, 0.68);
      --line: rgba(247, 244, 235, 0.16);
      --panel: rgba(255, 255, 255, 0.06);
      --panel-strong: rgba(255, 255, 255, 0.1);
      --gold: #f4c95d;
      --green: #24b47e;
      --blue: #4aa3ff;
      --red: #ff5d5d;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 22% 12%, rgba(36, 180, 126, 0.22), transparent 32%),
        radial-gradient(circle at 78% 22%, rgba(74, 163, 255, 0.17), transparent 30%),
        linear-gradient(140deg, #06100d 0%, #0d1d18 48%, #08100f 100%);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.8), transparent 72%);
    }

    #particle-canvas {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .page-shell {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 28px 18px 86px;
    }

    .hero {
      width: min(100%, 980px);
      min-height: calc(100vh - 56px);
      display: grid;
      grid-template-rows: auto minmax(210px, 34vh) auto auto;
      align-content: center;
      gap: 24px;
      text-align: center;
    }

    .eyebrow {
      justify-self: center;
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--gold);
      font-size: 0.76rem;
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      backdrop-filter: blur(12px);
    }

    .title-stage {
      position: relative;
      min-height: 210px;
      display: grid;
      place-items: center;
    }

    .fallback-title {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .subtitle {
      max-width: 650px;
      margin: 0 auto;
      color: var(--muted);
      font-size: clamp(1.05rem, 2.4vw, 1.35rem);
      line-height: 1.45;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      width: min(100%, 660px);
      margin: 0 auto;
    }

    .time-card {
      min-width: 0;
      padding: 16px 8px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(180deg, var(--panel-strong), var(--panel));
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.18);
      backdrop-filter: blur(16px);
    }

    .time-card strong {
      display: block;
      color: var(--ink);
      font-size: clamp(1.85rem, 8vw, 3.8rem);
      line-height: 0.95;
      font-variant-numeric: tabular-nums;
    }

    .time-card span {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .module-strip {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      width: min(100%, 760px);
      margin: 0 auto;
    }

    .module-strip span,
    .module-strip a {
      display: inline-flex;
      align-items: center;
      min-height: 36px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.045);
      color: rgba(247, 244, 235, 0.76);
      font-size: 0.82rem;
      font-weight: 800;
      text-decoration: none;
      backdrop-filter: blur(12px);
    }

    .cta-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 2px;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 20px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: var(--ink);
      color: #07130f;
      font-weight: 950;
      text-decoration: none;
    }

    .cta.secondary {
      border-color: var(--line);
      background: rgba(255, 255, 255, 0.04);
      color: var(--ink);
    }

    .w-index-tape {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 4;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      min-height: 52px;
      border-top: 1px solid rgba(247, 244, 235, 0.18);
      background: rgba(7, 19, 15, 0.88);
      box-shadow: 0 -18px 60px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(18px);
    }

    .tape-label {
      display: grid;
      place-items: center;
      min-width: 112px;
      padding: 0 16px;
      border-right: 1px solid var(--line);
      color: var(--gold);
      font-size: 0.72rem;
      font-weight: 950;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .ticker-window {
      min-width: 0;
      overflow: hidden;
      mask-image: linear-gradient(90deg, transparent 0, #000 5%, #000 95%, transparent 100%);
    }

    .ticker-track {
      display: flex;
      align-items: center;
      width: max-content;
      min-height: 52px;
      transform: translateX(0);
      animation: ticker-right-to-left 96s linear infinite;
      will-change: transform;
    }

    .ticker-track.is-entering {
      animation: ticker-enter-from-right 16s linear 1 forwards;
    }

    .ticker-window:hover .ticker-track {
      animation-play-state: paused;
    }

    .ticker-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      margin-right: 10px;
      padding: 0 12px;
      border: 1px solid rgba(247, 244, 235, 0.14);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.055);
      color: rgba(247, 244, 235, 0.88);
      font-size: 0.82rem;
      font-weight: 850;
      white-space: nowrap;
    }

    .ticker-item strong {
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    .ticker-rank {
      color: var(--gold);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    @keyframes ticker-right-to-left {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }

    @keyframes ticker-enter-from-right {
      from {
        transform: translateX(100vw);
      }

      to {
        transform: translateX(0);
      }
    }

    @media (max-width: 640px) {
      .hero {
        grid-template-rows: auto minmax(190px, 30vh) auto auto;
        gap: 20px;
      }

      .countdown {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .cta {
        width: 100%;
      }

      .w-index-tape {
        grid-template-columns: 1fr;
      }

      .tape-label {
        display: none;
      }

      .ticker-track {
        min-height: 46px;
        animation-duration: 78s;
      }

      .ticker-item {
        min-height: 32px;
        font-size: 0.78rem;
      }
    }
  </style>
</head>

<body>
  <canvas id="particle-canvas" aria-hidden="true"></canvas>

  <main class="page-shell">
    <section class="hero" aria-labelledby="page-title">
      <div class="eyebrow">World Cup 2026</div>

      <div class="title-stage" id="title-stage">
        <h1 id="page-title" class="fallback-title">Warren's<br>World Cup<br>Pool</h1>
      </div>

      <p class="subtitle">Pool entries, scoreboard, rankings, fixtures, and analysis. Coming soon.</p>

      <div class="countdown" aria-label="Countdown to World Cup kickoff">
        <div class="time-card">
          <strong id="days">00</strong>
          <span>Days</span>
        </div>
        <div class="time-card">
          <strong id="hours">00</strong>
          <span>Hours</span>
        </div>
        <div class="time-card">
          <strong id="minutes">00</strong>
          <span>Minutes</span>
        </div>
        <div class="time-card">
          <strong id="seconds">00</strong>
          <span>Seconds</span>
        </div>
      </div>

      <div class="module-strip" aria-label="Planned hub sections">
        <a href="pool/">Pool</a>
        <a href="meta/#group-fixtures">Fixtures</a>
        <a href="rankings-odds/">W-Index</a>
        <a href="groups/">Group Analysis</a>
        <span>Odds</span>
        <span>News</span>
        <span>Scoreboard</span>
      </div>

      <div class="cta-row">
        <a class="cta" href="pool/">Pool Coming Soon</a>
        <a class="cta secondary" href="ARCHITECTURE.md">Project Plan</a>
      </div>
    </section>
  </main>

  <aside class="w-index-tape" aria-label="W-Index ranking ticker">
    <div class="tape-label">W-Index</div>
    <div class="ticker-window">
      <div class="ticker-track" id="w-index-ticker">
        <span class="ticker-item">Loading W-Index rankings...</span>
      </div>
    </div>
  </aside>

  <script>
    (() => {
      const kickoff = new Date('2026-06-11T15:00:00-04:00').getTime();
      const parts = {
        days: document.getElementById('days'),
        hours: document.getElementById('hours'),
        minutes: document.getElementById('minutes'),
        seconds: document.getElementById('seconds')
      };

      function renderCountdown() {
        const distance = Math.max(0, kickoff - Date.now());
        const days = Math.floor(distance / 86400000);
        const hours = Math.floor((distance % 86400000) / 3600000);
        const minutes = Math.floor((distance % 3600000) / 60000);
        const seconds = Math.floor((distance % 60000) / 1000);

        parts.days.textContent = String(days).padStart(2, '0');
        parts.hours.textContent = String(hours).padStart(2, '0');
        parts.minutes.textContent = String(minutes).padStart(2, '0');
        parts.seconds.textContent = String(seconds).padStart(2, '0');
      }

      renderCountdown();
      setInterval(renderCountdown, 1000);
    })();
  </script>

  <script type="module">
    import { teams } from './data/world-cup-2026.js';

    (() => {
      const W_INDEX_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTVvIfHFjZgu-7IHXuaRB236HXxyKxftdabTXm-x6eItHaJZzxGyla-0uENR_J01DfPlkPIwXTIkYxL/pub?gid=639413055&single=true&output=csv';
      const ticker = document.getElementById('w-index-ticker');

      function flag(countryCode) {
        return countryCode
          .toUpperCase()
          .split('')
          .map((char) => String.fromCodePoint(127397 + char.charCodeAt(0)))
          .join('');
      }

      function normalizeName(name) {
        return String(name || '')
          .toLowerCase()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/&/g, 'and')
          .replace(/[^a-z0-9]+/g, ' ')
          .trim();
      }

      const teamAliases = new Map();
      for (const team of teams) {
        const names = [team.name, team.shortName, team.id];
        if (team.id === 'USA') names.push('USA', 'United States of America', 'USMNT');
        if (team.id === 'KOR') names.push('South Korea');
        if (team.id === 'CIV') names.push('Cote d Ivoire', "Côte d'Ivoire");
        if (team.id === 'COD') names.push('Congo DR', 'Democratic Republic of Congo');
        if (team.id === 'TUR') names.push('Turkey', 'Türkiye');
        if (team.id === 'IRN') names.push('IR Iran', 'Iran');
        if (team.id === 'CPV') names.push('Cabo Verde', 'Cape Verde');
        if (team.id === 'CUW') names.push('Curaçao', 'Curacao');
        for (const name of names.filter(Boolean)) teamAliases.set(normalizeName(name), team);
      }

      function parseCsv(text) {
        const rows = [];
        let row = [];
        let field = '';
        let inQuotes = false;

        for (let i = 0; i < text.length; i++) {
          const char = text[i];
          const next = text[i + 1];

          if (char === '"' && inQuotes && next === '"') {
            field += '"';
            i++;
          } else if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === ',' && !inQuotes) {
            row.push(field);
            field = '';
          } else if ((char === '\n' || char === '\r') && !inQuotes) {
            if (char === '\r' && next === '\n') i++;
            row.push(field);
            if (row.some((value) => value.trim() !== '')) rows.push(row);
            row = [];
            field = '';
          } else {
            field += char;
          }
        }

        row.push(field);
        if (row.some((value) => value.trim() !== '')) rows.push(row);
        return rows;
      }

      function rowsToObjects(rows) {
        const headers = rows[0].map((header) => header.trim());
        return rows.slice(1).map((row) => Object.fromEntries(headers.map((header, index) => [header, row[index]?.trim() || ''])));
      }

      function renderTicker(rows) {
        const ranked = rows
          .map((row) => ({ row, team: teamAliases.get(normalizeName(row.Team)) }))
          .filter((entry) => entry.team)
          .sort((a, b) => Number(a.row.Rank) - Number(b.row.Rank));

        if (!ranked.length) {
          ticker.innerHTML = '<span class="ticker-item">W-Index rankings unavailable</span>';
          return;
        }

        const items = ranked.map(({ row, team }) => `
          <span class="ticker-item">
            <span class="ticker-rank">#${row.Rank}</span>
            <span>${flag(team.countryCode)}</span>
            <span>${team.name}</span>
            <strong>${row['W-Index']}</strong>
          </span>
        `).join('');

        ticker.classList.remove('is-entering');
        ticker.innerHTML = items + items;
        void ticker.offsetWidth;
        ticker.classList.add('is-entering');
        window.setTimeout(() => {
          ticker.classList.remove('is-entering');
        }, 16000);
      }

      async function loadTicker() {
        try {
          const response = await fetch(`${W_INDEX_URL}&tickerBust=${Date.now()}`);
          if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
          renderTicker(rowsToObjects(parseCsv(await response.text())));
        } catch (error) {
          ticker.innerHTML = '<span class="ticker-item">W-Index rankings unavailable</span>';
        }
      }

      loadTicker();
    })();
  </script>

  <script>
    (() => {
      const canvas = document.getElementById('particle-canvas');
      const ctx = canvas.getContext('2d');
      const titleStage = document.getElementById('title-stage');

      const TEXT_LINES = [
        "Warren's",
        'World Cup',
        'Pool',
      ];

      const PALETTE = [
        [231, 40, 54],
        [247, 244, 235],
        [37, 99, 235],
        [255, 255, 255],
        [190, 20, 35],
        [73, 141, 255],
      ];

      const MAX_SPEED = 4.2;
      const HOMING_FORCE = 0.052;
      const SEPARATION_RADIUS = 3.2;
      const SEPARATION_FORCE = 0.08;
      const DAMPING = 0.88;
      const CURSOR_RADIUS = 130;
      const CURSOR_SCATTER = 7.5;
      const ORGANIZE_MS = 2200;

      let W = 0;
      let H = 0;
      let startedAt = performance.now();
      let mouse = { x: -9999, y: -9999, active: false };
      let particles = [];
      let textTargets = [];

      function resize() {
        W = canvas.width = document.body.scrollWidth;
        H = canvas.height = document.body.scrollHeight;
        textTargets = sampleText();
        assignTargets();
      }

      function sampleText() {
        const offscreen = document.createElement('canvas');
        const octx = offscreen.getContext('2d');
        offscreen.width = W;
        offscreen.height = H;

        const rect = titleStage.getBoundingClientRect();
        const sy = window.scrollY;
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + sy + rect.height / 2;
        const availableWidth = Math.min(rect.width, W - 28);
        let fontSize = Math.min(94, availableWidth / 7.3);
        fontSize = Math.max(34, fontSize);
        const lineHeight = fontSize * 0.92;
        const blockHeight = TEXT_LINES.length * lineHeight;
        const startY = centerY - blockHeight / 2;

        octx.font = `950 ${fontSize}px Inter, ui-sans-serif, system-ui, sans-serif`;
        octx.textAlign = 'center';
        octx.textBaseline = 'top';
        octx.fillStyle = '#fff';

        for (let i = 0; i < TEXT_LINES.length; i++) {
          octx.fillText(TEXT_LINES[i], centerX, startY + i * lineHeight);
        }

        const data = octx.getImageData(0, 0, W, H).data;
        const points = [];
        const gap = window.innerWidth < 520 ? 2 : 2;

        for (let y = 0; y < H; y += gap) {
          for (let x = 0; x < W; x += gap) {
            if (data[(y * W + x) * 4 + 3] > 128) {
              points.push({ x, y });
            }
          }
        }

        return points;
      }

      function assignTargets() {
        if (textTargets.length === 0) return;
        const count = Math.min(textTargets.length, window.innerWidth < 520 ? 5200 : 7800);

        while (particles.length < count) {
          particles.push(makeParticle());
        }
        particles.length = count;

        const shuffled = [...textTargets];
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }

        for (let i = 0; i < particles.length; i++) {
          particles[i].tx = shuffled[i].x;
          particles[i].ty = shuffled[i].y;
          if (!particles[i].seeded) {
            const rect = titleStage.getBoundingClientRect();
            particles[i].x = rect.left + Math.random() * rect.width;
            particles[i].y = rect.top + window.scrollY + Math.random() * rect.height;
            particles[i].vx = (Math.random() - 0.5) * 8;
            particles[i].vy = (Math.random() - 0.5) * 8;
            particles[i].seeded = true;
          }
        }
      }

      function makeParticle() {
        const a = Math.random() * Math.PI * 2;
        const r = Math.random() * Math.max(W, H) * 0.45;
        return {
          x: W / 2 + Math.cos(a) * r,
          y: H / 2 + Math.sin(a) * r,
          vx: (Math.random() - 0.5) * 2,
          vy: (Math.random() - 0.5) * 2,
          tx: 0,
          ty: 0,
          size: Math.random() * 0.58 + 0.58,
          alpha: Math.random() * 0.24 + 0.62,
          colorOffset: Math.random() * 10000,
          seeded: false,
        };
      }

      function animate() {
        ctx.clearRect(0, 0, W, H);
        const now = performance.now();
        const organize = Math.min(1, (now - startedAt) / ORGANIZE_MS);
        const ease = organize * organize * (3 - 2 * organize);
        const activeHoming = HOMING_FORCE * (0.12 + ease * 0.88);
        const activeDamping = DAMPING - (1 - ease) * 0.06;

        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          const hdx = p.tx - p.x;
          const hdy = p.ty - p.y;
          p.vx += hdx * activeHoming;
          p.vy += hdy * activeHoming;

          const lo = Math.max(0, i - 18);
          const hi = Math.min(particles.length, i + 18);
          for (let j = lo; j < hi; j++) {
            if (i === j) continue;
            const o = particles[j];
            const dx = o.x - p.x;
            const dy = o.y - p.y;
            const dist = Math.sqrt(dx * dx + dy * dy) || 1;
            if (dist < SEPARATION_RADIUS) {
              p.vx -= (dx / dist) * SEPARATION_FORCE;
              p.vy -= (dy / dist) * SEPARATION_FORCE;
            }
          }

          if (mouse.active) {
            const dx = p.x - mouse.x;
            const dy = p.y - mouse.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < CURSOR_RADIUS && dist > 1) {
              const force = (1 - dist / CURSOR_RADIUS) * CURSOR_SCATTER;
              p.vx += (dx / dist) * force;
              p.vy += (dy / dist) * force;
            }
          }

          p.vx *= activeDamping;
          p.vy *= activeDamping;

          const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
          if (speed > MAX_SPEED) {
            p.vx = (p.vx / speed) * MAX_SPEED;
            p.vy = (p.vy / speed) * MAX_SPEED;
          }

          p.x += p.vx;
          p.y += p.vy;

          const t = (now * 0.00024 + p.colorOffset) % PALETTE.length;
          const ci = Math.floor(t);
          const frac = t - ci;
          const c1 = PALETTE[ci % PALETTE.length];
          const c2 = PALETTE[(ci + 1) % PALETTE.length];
          const cr = Math.round(c1[0] + (c2[0] - c1[0]) * frac);
          const cg = Math.round(c1[1] + (c2[1] - c1[1]) * frac);
          const cb = Math.round(c1[2] + (c2[2] - c1[2]) * frac);

          ctx.beginPath();
          const crispness = 0.76 + ease * 0.42;
          ctx.arc(p.x, p.y, p.size * crispness, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${cr},${cg},${cb},${Math.min(0.98, p.alpha + ease * 0.16)})`;
          ctx.fill();
        }

        requestAnimationFrame(animate);
      }

      window.addEventListener('resize', resize);

      document.addEventListener('mousemove', (event) => {
        mouse.x = event.clientX;
        mouse.y = event.clientY + window.scrollY;
        mouse.active = true;
      });

      document.addEventListener('mouseleave', () => {
        mouse.active = false;
      });

      document.addEventListener('touchmove', (event) => {
        mouse.x = event.touches[0].clientX;
        mouse.y = event.touches[0].clientY + window.scrollY;
        mouse.active = true;
      }, { passive: true });

      document.addEventListener('touchend', () => {
        mouse.active = false;
      });

      resize();
      animate();
    })();
  </script>
</body>

</html>
