<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warren's World Cup Pool</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07130f;
      --ink: #f7f4eb;
      --muted: rgba(247, 244, 235, 0.68);
      --line: rgba(247, 244, 235, 0.16);
      --panel: rgba(255, 255, 255, 0.06);
      --panel-strong: rgba(255, 255, 255, 0.1);
      --gold: #f4c95d;
      --green: #24b47e;
      --blue: #4aa3ff;
      --red: #ff5d5d;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 22% 12%, rgba(36, 180, 126, 0.22), transparent 32%),
        radial-gradient(circle at 78% 22%, rgba(74, 163, 255, 0.17), transparent 30%),
        linear-gradient(140deg, #06100d 0%, #0d1d18 48%, #08100f 100%);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.8), transparent 72%);
    }

    #particle-canvas {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .page-shell {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 28px 18px 86px;
    }

    .hero {
      width: min(100%, 980px);
      min-height: calc(100vh - 56px);
      display: grid;
      grid-template-rows: auto minmax(240px, 40vh) auto auto auto;
      align-content: center;
      gap: 16px;
      text-align: center;
    }

    .host-mark {
      position: relative;
      justify-self: center;
      display: grid;
      place-items: center;
      width: min(100%, 520px);
      min-height: 250px;
      margin-bottom: 0;
    }

    .host-flags {
      justify-self: center;
      display: inline-flex;
      align-items: center;
      gap: 18px;
      transform: translateY(-52px);
    }

    .host-flag {
      width: 144px;
      aspect-ratio: 3 / 2;
      overflow: hidden;
      border: 1px solid rgba(247, 244, 235, 0.22);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 16px 42px rgba(0, 0, 0, 0.24);
    }

    .host-flag img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .eagle-world-cup {
      position: absolute;
      z-index: 2;
      top: 28px;
      left: 50%;
      width: min(34vw, 300px);
      max-width: 82%;
      filter: drop-shadow(0 24px 56px rgba(0, 0, 0, 0.34));
      transform: translateX(-50%);
    }

    .eyebrow {
      justify-self: center;
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--gold);
      font-size: 0.76rem;
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      backdrop-filter: blur(12px);
    }

    .title-stage {
      position: relative;
      min-height: 210px;
      display: grid;
      place-items: center;
    }

    .fallback-title {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      width: min(100%, 410px);
      margin: 0 auto;
      opacity: 0.78;
    }

    .time-card {
      min-width: 0;
      padding: 9px 8px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.045);
      box-shadow: 0 12px 42px rgba(0, 0, 0, 0.12);
      backdrop-filter: blur(16px);
    }

    .time-card strong {
      display: block;
      color: var(--ink);
      font-size: clamp(1.2rem, 3.3vw, 2rem);
      line-height: 0.95;
      font-variant-numeric: tabular-nums;
    }

    .time-card span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.62rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .module-strip {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      width: min(100%, 760px);
      margin: 0 auto;
    }

    .coming-soon-strip {
      display: grid;
      gap: 8px;
      justify-items: center;
      margin-top: -8px;
    }

    .coming-soon-label {
      color: var(--muted);
      font-size: 0.66rem;
      font-weight: 950;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .module-strip span,
    .module-strip a {
      display: inline-flex;
      align-items: center;
      min-height: 36px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.045);
      color: rgba(247, 244, 235, 0.76);
      font-size: 0.82rem;
      font-weight: 800;
      text-decoration: none;
      backdrop-filter: blur(12px);
    }

    .w-index-tape {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 4;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      min-height: 52px;
      border-top: 1px solid rgba(247, 244, 235, 0.18);
      background: rgba(7, 19, 15, 0.88);
      box-shadow: 0 -18px 60px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(18px);
    }

    .tape-label {
      display: grid;
      place-items: center;
      min-width: 112px;
      padding: 0 16px;
      border-right: 1px solid var(--line);
      color: var(--gold);
      font-size: 0.72rem;
      font-weight: 950;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .ticker-window {
      min-width: 0;
      overflow: hidden;
      mask-image: linear-gradient(90deg, transparent 0, #000 5%, #000 95%, transparent 100%);
      cursor: grab;
      touch-action: pan-y;
      user-select: none;
    }

    .ticker-window.is-dragging {
      cursor: grabbing;
    }

    .ticker-track {
      display: flex;
      align-items: center;
      width: max-content;
      min-height: 52px;
      transform: translateX(0);
      will-change: transform;
    }

    .ticker-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      margin-right: 10px;
      padding: 0 12px 0 6px;
      border: 1px solid rgba(247, 244, 235, 0.14);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.055);
      color: rgba(247, 244, 235, 0.88);
      font-size: 0.82rem;
      font-weight: 850;
      white-space: nowrap;
      cursor: pointer;
    }

    .ticker-item:hover {
      border-color: rgba(244, 201, 93, 0.38);
      background: rgba(244, 201, 93, 0.09);
    }

    .ticker-item strong {
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    .ticker-rank {
      color: var(--gold);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .ticker-flag {
      width: 34px;
      aspect-ratio: 3 / 2;
      display: inline-block;
      overflow: hidden;
      border: 1px solid rgba(247, 244, 235, 0.2);
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
      flex: 0 0 auto;
    }

    .ticker-flag img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .wc-modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(0, 0, 0, 0.58);
      backdrop-filter: blur(12px);
    }

    .wc-modal-overlay[hidden] {
      display: none;
    }

    .wc-modal {
      position: relative;
      width: min(100%, 720px);
      max-height: min(86vh, 880px);
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        radial-gradient(circle at 16% 0%, rgba(36, 180, 126, 0.16), transparent 32%),
        linear-gradient(145deg, rgba(18, 37, 31, 0.98), rgba(8, 20, 17, 0.98));
      box-shadow: 0 30px 120px rgba(0, 0, 0, 0.45);
    }

    .wc-modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 2;
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.065);
      color: var(--ink);
      font: inherit;
      font-size: 1.2rem;
      font-weight: 900;
      cursor: pointer;
    }

    .wc-card-pad {
      padding: 24px;
    }

    .wc-chip {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0 20px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.075);
      color: var(--ink);
      font-size: clamp(1.05rem, 3vw, 1.45rem);
      font-weight: 950;
    }

    .wc-rank-note {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      color: var(--muted);
      font-size: clamp(0.95rem, 2vw, 1.08rem);
      font-weight: 900;
    }

    .wc-small {
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 900;
    }

    .wc-team-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 13px 0;
      border-top: 1px solid var(--line);
      color: rgba(247, 244, 235, 0.9);
      font-size: clamp(1rem, 3vw, 1.25rem);
      line-height: 1.2;
    }

    .wc-team-row strong {
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .wc-flag-img {
      width: 42px;
      aspect-ratio: 3 / 2;
      display: inline-block;
      margin-right: 10px;
      overflow: hidden;
      border: 1px solid rgba(247, 244, 235, 0.18);
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.16);
      vertical-align: -7px;
    }

    .wc-flag-img img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .wc-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 0 14px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: var(--ink);
      color: #07130f;
      font: inherit;
      font-size: 0.85rem;
      font-weight: 950;
      cursor: pointer;
      text-decoration: none;
    }

    .wc-button.secondary {
      border-color: var(--line);
      background: rgba(255, 255, 255, 0.045);
      color: var(--ink);
    }

    .wc-button:hover {
      opacity: 0.87;
    }

    @media (max-width: 640px) {
      .hero {
        grid-template-rows: auto minmax(150px, 22vh) auto auto auto;
        gap: 8px;
      }

      .host-mark {
        min-height: 188px;
        margin-bottom: 2px;
      }

      .host-flag {
        width: min(29vw, 116px);
        border-radius: 6px;
      }

      .host-flags {
        gap: 8px;
        transform: translateY(-40px);
      }

      .eagle-world-cup {
        top: 20px;
        width: min(46vw, 180px);
      }

      .title-stage {
        min-height: 150px;
      }

      .countdown {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        width: min(100%, 360px);
      }

      .w-index-tape {
        grid-template-columns: 1fr;
      }

      .tape-label {
        display: none;
      }

      .ticker-track {
        min-height: 46px;
      }

      .ticker-item {
        min-height: 32px;
        font-size: 0.78rem;
      }

      .ticker-flag {
        width: 30px;
      }
    }
  </style>
</head>

<body>
  <canvas id="particle-canvas" aria-hidden="true"></canvas>

  <main class="page-shell">
    <section class="hero" aria-labelledby="page-title">
      <div class="host-mark">
        <div class="host-flags" aria-label="2026 World Cup host nations: Mexico, United States, Canada">
          <span class="host-flag"><img src="https://flagcdn.com/w320/mx.png" alt="Mexico flag"></span>
          <span class="host-flag"><img src="https://flagcdn.com/w320/us.png" alt="United States flag"></span>
          <span class="host-flag"><img src="https://flagcdn.com/w320/ca.png" alt="Canada flag"></span>
        </div>

        <img class="eagle-world-cup" src="assets/eagle-world-cup.png" alt="World Cup eagle mark">
      </div>

      <div class="title-stage" id="title-stage">
        <h1 id="page-title" class="fallback-title">Warren's<br>World Cup<br>Pool</h1>
      </div>

      <div class="module-strip" aria-label="Planned hub sections">
        <a href="pool/">Pool Entry</a>
        <a href="rankings-odds/">W-Index</a>
        <a href="groups/">Group Analysis</a>
        <a href="meta/#group-fixtures">Fixtures</a>
        <a href="simulation/">Simulator</a>
        <a href="scoreboard/">Scoreboard</a>
      </div>

      <div class="countdown" aria-label="Countdown to World Cup kickoff">
        <div class="time-card">
          <strong id="days">00</strong>
          <span>Days</span>
        </div>
        <div class="time-card">
          <strong id="hours">00</strong>
          <span>Hours</span>
        </div>
        <div class="time-card">
          <strong id="minutes">00</strong>
          <span>Minutes</span>
        </div>
        <div class="time-card">
          <strong id="seconds">00</strong>
          <span>Seconds</span>
        </div>
      </div>

      <div class="coming-soon-strip" aria-label="Coming soon sections">
        <div class="coming-soon-label">Coming Soon</div>
        <div class="module-strip">
          <a href="squads/">Squads</a>
        </div>
      </div>
    </section>
  </main>

  <aside class="w-index-tape" aria-label="W-Index ranking ticker">
    <div class="tape-label">W-Index</div>
    <div class="ticker-window">
      <div class="ticker-track" id="w-index-ticker">
        <span class="ticker-item">Loading W-Index rankings...</span>
      </div>
    </div>
  </aside>

  <div class="wc-modal-overlay" id="group-modal-overlay" hidden>
    <section class="wc-modal" role="dialog" aria-modal="true" aria-labelledby="group-modal-title">
      <button class="wc-modal-close" id="group-modal-close" type="button" aria-label="Close group analysis">×</button>
      <div class="wc-card-pad" id="group-modal-content"></div>
    </section>
  </div>

  <script>
    (() => {
      const kickoff = new Date('2026-06-11T15:00:00-04:00').getTime();
      const parts = {
        days: document.getElementById('days'),
        hours: document.getElementById('hours'),
        minutes: document.getElementById('minutes'),
        seconds: document.getElementById('seconds')
      };

      function renderCountdown() {
        const distance = Math.max(0, kickoff - Date.now());
        const days = Math.floor(distance / 86400000);
        const hours = Math.floor((distance % 86400000) / 3600000);
        const minutes = Math.floor((distance % 3600000) / 60000);
        const seconds = Math.floor((distance % 60000) / 1000);

        parts.days.textContent = String(days).padStart(2, '0');
        parts.hours.textContent = String(hours).padStart(2, '0');
        parts.minutes.textContent = String(minutes).padStart(2, '0');
        parts.seconds.textContent = String(seconds).padStart(2, '0');
      }

      renderCountdown();
      setInterval(renderCountdown, 1000);
    })();
  </script>

  <script type="module">
    import { groups, teams, teamsById } from './data/world-cup-2026.js';

    (() => {
      const W_INDEX_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTVvIfHFjZgu-7IHXuaRB236HXxyKxftdabTXm-x6eItHaJZzxGyla-0uENR_J01DfPlkPIwXTIkYxL/pub?gid=639413055&single=true&output=csv';
      const ticker = document.getElementById('w-index-ticker');
      const tickerWindow = ticker.closest('.ticker-window');
      const modalOverlay = document.getElementById('group-modal-overlay');
      const modalContent = document.getElementById('group-modal-content');
      const modalClose = document.getElementById('group-modal-close');
      let analysesByGroup = new Map();
      let lastFocusedTickerItem = null;
      let tickerX = 0;
      let tickerLoopWidth = 0;
      let tickerLastFrame = 0;
      let tickerPausedUntil = 0;
      let tickerDragging = false;
      let tickerDragStartX = 0;
      let tickerDragStartOffset = 0;
      let tickerDragMoved = false;
      let tickerClickSuppressed = false;
      let tickerPressItem = null;

      function flagCode(team) {
        if (team.id === 'ENG') return 'gb-eng';
        if (team.id === 'SCO') return 'gb-sct';
        return team.countryCode.toLowerCase();
      }

      function flagUrl(team, width = 80) {
        return `https://flagcdn.com/w${width}/${flagCode(team)}.png`;
      }

      function flagImage(team) {
        return `<span class="wc-flag-img" aria-hidden="true"><img src="${flagUrl(team)}" alt="" loading="lazy"></span>`;
      }

      function normalizeName(name) {
        return String(name || '')
          .toLowerCase()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/&/g, 'and')
          .replace(/[^a-z0-9]+/g, ' ')
          .trim();
      }

      const teamAliases = new Map();
      for (const team of teams) {
        const names = [team.name, team.shortName, team.id];
        if (team.id === 'USA') names.push('USA', 'United States of America', 'USMNT');
        if (team.id === 'KOR') names.push('South Korea');
        if (team.id === 'CIV') names.push('Cote d Ivoire', "Côte d'Ivoire");
        if (team.id === 'COD') names.push('Congo DR', 'Democratic Republic of Congo');
        if (team.id === 'TUR') names.push('Turkey', 'Türkiye');
        if (team.id === 'IRN') names.push('IR Iran', 'Iran');
        if (team.id === 'CPV') names.push('Cabo Verde', 'Cape Verde');
        if (team.id === 'CUW') names.push('Curaçao', 'Curacao');
        for (const name of names.filter(Boolean)) teamAliases.set(normalizeName(name), team);
      }

      function parseCsv(text) {
        const rows = [];
        let row = [];
        let field = '';
        let inQuotes = false;

        for (let i = 0; i < text.length; i++) {
          const char = text[i];
          const next = text[i + 1];

          if (char === '"' && inQuotes && next === '"') {
            field += '"';
            i++;
          } else if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === ',' && !inQuotes) {
            row.push(field);
            field = '';
          } else if ((char === '\n' || char === '\r') && !inQuotes) {
            if (char === '\r' && next === '\n') i++;
            row.push(field);
            if (row.some((value) => value.trim() !== '')) rows.push(row);
            row = [];
            field = '';
          } else {
            field += char;
          }
        }

        row.push(field);
        if (row.some((value) => value.trim() !== '')) rows.push(row);
        return rows;
      }

      function rowsToObjects(rows) {
        const headers = rows[0].map((header) => header.trim());
        return rows.slice(1).map((row) => Object.fromEntries(headers.map((header, index) => [header, row[index]?.trim() || ''])));
      }

      function parsePercent(value) {
        const number = Number(String(value).replace('%', '').trim());
        return Number.isFinite(number) ? number : null;
      }

      function scoreLabel(score) {
        return Number.isFinite(score) ? `${score.toFixed(1)}%` : '—';
      }

      function pairwise(teamRows) {
        const pairs = [];
        for (let i = 0; i < teamRows.length; i++) {
          for (let j = i + 1; j < teamRows.length; j++) {
            const a = teamRows[i];
            const b = teamRows[j];
            pairs.push({ a, b, diff: Math.abs(a.score - b.score) });
          }
        }
        return pairs;
      }

      function analyzeGroups(rows) {
        const wIndex = new Map();
        for (const row of rows) {
          const team = teamAliases.get(normalizeName(row.Team));
          if (!team) continue;
          wIndex.set(team.id, {
            score: parsePercent(row['W-Index']),
            rank: Number(row.Rank),
          });
        }

        return new Map(Object.entries(groups).map(([group, teamIds]) => {
          const teamRows = teamIds.map((id) => {
            const team = teamsById[id];
            return { ...team, score: wIndex.get(id)?.score, rank: wIndex.get(id)?.rank };
          }).sort((a, b) => b.score - a.score);
          const pairs = pairwise(teamRows).sort((a, b) => a.diff - b.diff);
          const total = teamRows.reduce((sum, team) => sum + team.score, 0);
          const pairwiseDiffSum = pairs.reduce((sum, pair) => sum + pair.diff, 0);
          const close10 = pairs.filter((pair) => pair.diff <= 10).length;
          return [group, { group, teamRows, pairs, total, pairwiseDiffSum, close10 }];
        }));
      }

      function renderGroupModal(analysis) {
        return `
          <span class="wc-chip" id="group-modal-title">Group ${analysis.group}</span>
          <div class="wc-rank-note" style="margin: 18px 0 12px;">
            <span class="wc-small">Total ${scoreLabel(analysis.total)}</span>
            <span class="wc-small">Parity ${analysis.pairwiseDiffSum.toFixed(1)}</span>
            <span class="wc-small">≤10 close ${analysis.close10}/6</span>
          </div>
          <div>
            ${analysis.teamRows.map((team) => `
              <div class="wc-team-row">
                <span>${flagImage(team)}${team.name}</span>
                <strong>${scoreLabel(team.score)}</strong>
              </div>
            `).join('')}
          </div>
          <div style="margin-top: 12px;">
            ${analysis.pairs.map((pair) => `
              <div class="wc-team-row">
                <span>${pair.a.name} v ${pair.b.name}</span>
                <strong>${pair.diff.toFixed(1)}</strong>
              </div>
            `).join('')}
          </div>
          <div style="margin-top: 20px; display: flex; gap: 10px; border-top: 1px solid var(--wc-line); padding-top: 16px;">
            <a href="simulation/" class="wc-button" style="flex: 1; text-align: center; text-decoration: none; font-size: 0.78rem; min-height: 36px; padding: 0 10px; font-weight: 850; border-radius: var(--wc-radius); display: inline-flex; align-items: center; justify-content: center; gap: 6px;">
              🎮 Simulator
            </a>
            <a href="scoreboard/" class="wc-button secondary" style="flex: 1; text-align: center; text-decoration: none; font-size: 0.78rem; min-height: 36px; padding: 0 10px; font-weight: 850; border-radius: var(--wc-radius); display: inline-flex; align-items: center; justify-content: center; gap: 6px;">
              🏆 Scoreboard
            </a>
          </div>
        `;
      }

      function openGroupModal(group) {
        const analysis = analysesByGroup.get(group);
        if (!analysis) return;
        modalContent.innerHTML = renderGroupModal(analysis);
        modalOverlay.hidden = false;
        document.body.style.overflow = 'hidden';
        modalClose.focus();
      }

      function closeGroupModal() {
        if (modalOverlay.hidden) return;
        modalOverlay.hidden = true;
        document.body.style.overflow = '';
        if (lastFocusedTickerItem) lastFocusedTickerItem.focus();
      }

      function renderTicker(rows) {
        const ranked = rows
          .map((row) => ({ row, team: teamAliases.get(normalizeName(row.Team)) }))
          .filter((entry) => entry.team)
          .sort((a, b) => Number(a.row.Rank) - Number(b.row.Rank));

        if (!ranked.length) {
          ticker.innerHTML = '<span class="ticker-item">W-Index rankings unavailable</span>';
          return;
        }

        const items = ranked.map(({ row, team }) => `
          <button class="ticker-item" type="button" data-group="${team.group}" data-team="${team.id}">
            <span class="ticker-rank">#${row.Rank}</span>
            <span class="ticker-flag" aria-hidden="true"><img src="${flagUrl(team)}" alt="" loading="lazy"></span>
            <span>${team.name}</span>
            <strong>${row['W-Index']}</strong>
          </button>
        `).join('');

        ticker.innerHTML = items + items;
        requestAnimationFrame(() => {
          tickerLoopWidth = ticker.scrollWidth / 2;
          tickerX = tickerWindow.getBoundingClientRect().width;
          tickerLastFrame = performance.now();
        });
      }

      function normalizeTickerX() {
        if (!tickerLoopWidth) return;
        while (tickerX <= -tickerLoopWidth) tickerX += tickerLoopWidth;
      }

      function animateTicker(now) {
        if (!tickerLastFrame) tickerLastFrame = now;
        const delta = now - tickerLastFrame;
        tickerLastFrame = now;

        if (!tickerDragging && now > tickerPausedUntil && tickerLoopWidth) {
          const pxPerSecond = window.innerWidth < 640 ? 68 : 48;
          tickerX -= (pxPerSecond * delta) / 1000;
          normalizeTickerX();
        }

        ticker.style.transform = `translateX(${tickerX}px)`;
        requestAnimationFrame(animateTicker);
      }

      function pointerX(event) {
        return event.clientX ?? event.touches?.[0]?.clientX ?? 0;
      }

      async function loadTicker() {
        try {
          const response = await fetch(`${W_INDEX_URL}&tickerBust=${Date.now()}`);
          if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
          const rows = rowsToObjects(parseCsv(await response.text()));
          analysesByGroup = analyzeGroups(rows);
          renderTicker(rows);
        } catch (error) {
          ticker.innerHTML = '<span class="ticker-item">W-Index rankings unavailable</span>';
        }
      }

      ticker.addEventListener('click', (event) => {
        if (tickerClickSuppressed) {
          event.preventDefault();
          event.stopPropagation();
          tickerClickSuppressed = false;
          return;
        }
        const item = event.target.closest('.ticker-item');
        if (!item?.dataset.group) return;
        lastFocusedTickerItem = item;
        openGroupModal(item.dataset.group);
      });

      tickerWindow.addEventListener('pointerdown', (event) => {
        tickerDragging = true;
        tickerDragMoved = false;
        tickerPressItem = event.target.closest('.ticker-item');
        tickerDragStartX = pointerX(event);
        tickerDragStartOffset = tickerX;
        tickerPausedUntil = performance.now() + 5000;
        tickerWindow.classList.add('is-dragging');
        tickerWindow.setPointerCapture?.(event.pointerId);
      });

      tickerWindow.addEventListener('pointermove', (event) => {
        if (!tickerDragging) return;
        const delta = pointerX(event) - tickerDragStartX;
        if (Math.abs(delta) > 5) tickerDragMoved = true;
        tickerX = tickerDragStartOffset + delta;
        normalizeTickerX();
        tickerPausedUntil = performance.now() + 2600;
      });

      function endTickerDrag(event) {
        if (!tickerDragging) return;
        tickerDragging = false;
        if (!tickerDragMoved && event.type === 'pointerup' && tickerPressItem?.dataset.group) {
          lastFocusedTickerItem = tickerPressItem;
          openGroupModal(tickerPressItem.dataset.group);
          tickerClickSuppressed = true;
          window.setTimeout(() => {
            tickerClickSuppressed = false;
          }, 0);
        } else if (tickerDragMoved) {
          tickerClickSuppressed = true;
          window.setTimeout(() => {
            tickerClickSuppressed = false;
          }, 0);
        }
        tickerPressItem = null;
        tickerPausedUntil = performance.now() + 1800;
        tickerWindow.classList.remove('is-dragging');
        tickerWindow.releasePointerCapture?.(event.pointerId);
      }

      tickerWindow.addEventListener('pointerup', endTickerDrag);
      tickerWindow.addEventListener('pointercancel', endTickerDrag);
      tickerWindow.addEventListener('pointerleave', endTickerDrag);

      modalClose.addEventListener('click', closeGroupModal);
      modalOverlay.addEventListener('click', (event) => {
        if (event.target === modalOverlay) closeGroupModal();
      });
      modalOverlay.addEventListener('pointerdown', (event) => {
        if (event.target === modalOverlay) closeGroupModal();
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') closeGroupModal();
      });

      loadTicker();
      requestAnimationFrame(animateTicker);
    })();
  </script>

  <script>
    (() => {
      const canvas = document.getElementById('particle-canvas');
      const ctx = canvas.getContext('2d');
      const titleStage = document.getElementById('title-stage');

      const TEXT_LINES = [
        "Warren's",
        'World Cup',
        'Pool',
      ];

      const PALETTE = [
        [231, 40, 54],
        [247, 244, 235],
        [37, 99, 235],
        [255, 255, 255],
        [190, 20, 35],
        [73, 141, 255],
      ];

      const MAX_SPEED = 2.35;
      const HOMING_FORCE = 0.026;
      const SEPARATION_RADIUS = 3.2;
      const SEPARATION_FORCE = 0.08;
      const DAMPING = 0.88;
      const CURSOR_RADIUS = 130;
      const CURSOR_SCATTER = 7.5;
      const ORGANIZE_MS = 7200;

      let W = 0;
      let H = 0;
      let startedAt = performance.now();
      let mouse = { x: -9999, y: -9999, active: false };
      let particles = [];
      let textTargets = [];

      function resize() {
        W = canvas.width = document.body.scrollWidth;
        H = canvas.height = document.body.scrollHeight;
        textTargets = sampleText();
        assignTargets();
      }

      function sampleText() {
        const offscreen = document.createElement('canvas');
        const octx = offscreen.getContext('2d');
        offscreen.width = W;
        offscreen.height = H;

        const rect = titleStage.getBoundingClientRect();
        const sy = window.scrollY;
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + sy + rect.height / 2;
        const availableWidth = Math.min(rect.width, W - 28);
        let fontSize = Math.min(94, availableWidth / 7.3);
        fontSize = Math.max(34, fontSize);
        const lineHeight = fontSize * 0.92;
        const blockHeight = TEXT_LINES.length * lineHeight;
        const startY = centerY - blockHeight / 2;

        octx.font = `950 ${fontSize}px Inter, ui-sans-serif, system-ui, sans-serif`;
        octx.textAlign = 'center';
        octx.textBaseline = 'top';
        octx.fillStyle = '#fff';

        for (let i = 0; i < TEXT_LINES.length; i++) {
          octx.fillText(TEXT_LINES[i], centerX, startY + i * lineHeight);
        }

        const data = octx.getImageData(0, 0, W, H).data;
        const points = [];
        const gap = window.innerWidth < 520 ? 2 : 2;

        for (let y = 0; y < H; y += gap) {
          for (let x = 0; x < W; x += gap) {
            if (data[(y * W + x) * 4 + 3] > 128) {
              points.push({ x, y });
            }
          }
        }

        return points;
      }

      function assignTargets() {
        if (textTargets.length === 0) return;
        const count = Math.min(textTargets.length, window.innerWidth < 520 ? 5200 : 7800);

        while (particles.length < count) {
          particles.push(makeParticle());
        }
        particles.length = count;

        const shuffled = [...textTargets];
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }

        for (let i = 0; i < particles.length; i++) {
          particles[i].tx = shuffled[i].x;
          particles[i].ty = shuffled[i].y;
          if (!particles[i].seeded) {
            const rect = titleStage.getBoundingClientRect();
            particles[i].x = rect.left + Math.random() * rect.width;
            particles[i].y = rect.top + window.scrollY + Math.random() * rect.height;
            particles[i].vx = (Math.random() - 0.5) * 8;
            particles[i].vy = (Math.random() - 0.5) * 8;
            particles[i].seeded = true;
          }
        }
      }

      function makeParticle() {
        const a = Math.random() * Math.PI * 2;
        const r = Math.random() * Math.max(W, H) * 0.45;
        return {
          x: W / 2 + Math.cos(a) * r,
          y: H / 2 + Math.sin(a) * r,
          vx: (Math.random() - 0.5) * 2,
          vy: (Math.random() - 0.5) * 2,
          tx: 0,
          ty: 0,
          size: Math.random() * 0.58 + 0.58,
          alpha: Math.random() * 0.24 + 0.62,
          colorOffset: Math.random() * 10000,
          seeded: false,
        };
      }

      function animate() {
        ctx.clearRect(0, 0, W, H);
        const now = performance.now();
        const organize = Math.min(1, (now - startedAt) / ORGANIZE_MS);
        const ease = organize * organize * (3 - 2 * organize);
        const activeHoming = HOMING_FORCE * (0.12 + ease * 0.88);
        const activeDamping = DAMPING - (1 - ease) * 0.06;

        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          const hdx = p.tx - p.x;
          const hdy = p.ty - p.y;
          p.vx += hdx * activeHoming;
          p.vy += hdy * activeHoming;

          const lo = Math.max(0, i - 18);
          const hi = Math.min(particles.length, i + 18);
          for (let j = lo; j < hi; j++) {
            if (i === j) continue;
            const o = particles[j];
            const dx = o.x - p.x;
            const dy = o.y - p.y;
            const dist = Math.sqrt(dx * dx + dy * dy) || 1;
            if (dist < SEPARATION_RADIUS) {
              p.vx -= (dx / dist) * SEPARATION_FORCE;
              p.vy -= (dy / dist) * SEPARATION_FORCE;
            }
          }

          if (mouse.active) {
            const dx = p.x - mouse.x;
            const dy = p.y - mouse.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < CURSOR_RADIUS && dist > 1) {
              const force = (1 - dist / CURSOR_RADIUS) * CURSOR_SCATTER;
              p.vx += (dx / dist) * force;
              p.vy += (dy / dist) * force;
            }
          }

          p.vx *= activeDamping;
          p.vy *= activeDamping;

          const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
          if (speed > MAX_SPEED) {
            p.vx = (p.vx / speed) * MAX_SPEED;
            p.vy = (p.vy / speed) * MAX_SPEED;
          }

          p.x += p.vx;
          p.y += p.vy;

          const t = (now * 0.00024 + p.colorOffset) % PALETTE.length;
          const ci = Math.floor(t);
          const frac = t - ci;
          const c1 = PALETTE[ci % PALETTE.length];
          const c2 = PALETTE[(ci + 1) % PALETTE.length];
          const cr = Math.round(c1[0] + (c2[0] - c1[0]) * frac);
          const cg = Math.round(c1[1] + (c2[1] - c1[1]) * frac);
          const cb = Math.round(c1[2] + (c2[2] - c1[2]) * frac);

          ctx.beginPath();
          const crispness = 0.76 + ease * 0.42;
          ctx.arc(p.x, p.y, p.size * crispness, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${cr},${cg},${cb},${Math.min(0.98, p.alpha + ease * 0.16)})`;
          ctx.fill();
        }

        requestAnimationFrame(animate);
      }

      window.addEventListener('resize', resize);

      document.addEventListener('mousemove', (event) => {
        mouse.x = event.clientX;
        mouse.y = event.clientY + window.scrollY;
        mouse.active = true;
      });

      document.addEventListener('mouseleave', () => {
        mouse.active = false;
      });

      document.addEventListener('touchmove', (event) => {
        mouse.x = event.touches[0].clientX;
        mouse.y = event.touches[0].clientY + window.scrollY;
        mouse.active = true;
      }, { passive: true });

      document.addEventListener('touchend', () => {
        mouse.active = false;
      });

      resize();
      animate();
    })();
  </script>
</body>

</html>
