<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pool Entry | Warren's World Cup Pool</title>
  <link rel="stylesheet" href="../shared/world-cup.css">
  <style>
    .pool-shell {
      padding-bottom: 118px;
    }

    .pool-hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: end;
      margin-bottom: 18px;
    }

    .pool-title {
      max-width: 780px;
      margin: 9px 0 0;
      font-size: clamp(2.4rem, 7vw, 5.2rem);
      line-height: 0.9;
      font-weight: 950;
    }

    .pool-copy {
      max-width: 680px;
      color: var(--wc-muted);
      font-size: 1rem;
      line-height: 1.5;
    }

    .pool-panel {
      border: 1px solid var(--wc-line);
      border-radius: var(--wc-radius);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.045));
      box-shadow: var(--wc-shadow);
      backdrop-filter: blur(14px);
    }

    .pool-card-pad {
      padding: clamp(16px, 3vw, 24px);
    }

    .pool-steps {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 10px;
      margin-top: 20px;
    }

    .pool-step {
      min-width: 0;
      padding: 16px;
      border: 1px solid var(--wc-line);
      border-radius: var(--wc-radius);
      background: rgba(255, 255, 255, 0.045);
    }

    .pool-step strong {
      display: block;
      margin-bottom: 7px;
      color: var(--wc-ink);
      font-size: 1rem;
    }

    .pool-step span {
      color: var(--wc-muted);
      font-size: 0.88rem;
      line-height: 1.45;
    }

    .pool-rules {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(260px, 0.9fr);
      gap: 12px;
      margin-top: 14px;
    }

    .pool-rules-card {
      padding: 16px;
      border: 1px solid var(--wc-line);
      border-radius: var(--wc-radius);
      background: rgba(255, 255, 255, 0.045);
    }

    .pool-rules-card h2,
    .pool-rules-card h3 {
      margin: 0 0 10px;
      color: var(--wc-ink);
      line-height: 1.05;
    }

    .pool-rules-card h2 {
      font-size: clamp(1.45rem, 4vw, 2.2rem);
    }

    .pool-rules-list {
      display: grid;
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .pool-rules-list li {
      color: var(--wc-muted);
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .pool-rules-list strong {
      color: var(--wc-ink);
    }

    .pool-rules-list .pool-payment-warning {
      color: #ffb4a8;
      border: 1px solid rgba(255, 93, 74, 0.55);
      background: linear-gradient(135deg, rgba(255, 93, 74, 0.22), rgba(255, 93, 74, 0.08));
      border-radius: var(--wc-radius);
      box-shadow: 0 18px 42px rgba(255, 93, 74, 0.13);
      margin-top: 22px;
      padding: 16px 18px;
      font-size: clamp(1.05rem, 2vw, 1.35rem);
      font-weight: 950;
      line-height: 1.28;
    }

    .pool-rules-list .pool-payment-warning strong {
      color: #fff4ef;
    }

    .pool-rules-list .pool-payment-warning .memo-label {
      display: block;
      margin-bottom: 7px;
      color: #ffdf76;
      font-size: 0.78rem;
      font-weight: 950;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .pool-rules-list .pool-payment-warning a {
      color: #fff4ef;
      font-weight: 950;
      text-decoration-color: rgba(255, 244, 239, 0.65);
    }

    .pool-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .pool-form {
      display: grid;
      gap: 14px;
      max-width: 540px;
    }

    .pool-submit-status {
      margin-top: 12px;
      padding: 12px;
      border: 1px solid var(--wc-line);
      border-radius: var(--wc-radius);
      background: rgba(255, 255, 255, 0.045);
      color: var(--wc-muted);
      font-size: 0.9rem;
      font-weight: 800;
      line-height: 1.45;
    }

    .pool-submit-status.is-success {
      border-color: rgba(36, 180, 126, 0.48);
      color: var(--wc-ink);
      background: rgba(36, 180, 126, 0.12);
    }

    .pool-submit-status.is-error {
      border-color: rgba(255, 93, 93, 0.48);
      color: var(--wc-ink);
      background: rgba(255, 93, 93, 0.12);
    }

    .pool-tiebreaker-card {
      display: grid;
      gap: 10px;
      margin-top: 18px;
      padding: 16px;
      border: 1px solid rgba(244, 201, 93, 0.45);
      border-radius: var(--wc-radius);
      background:
        linear-gradient(135deg, rgba(244, 201, 93, 0.16), rgba(255, 255, 255, 0.055)),
        rgba(255, 255, 255, 0.04);
      box-shadow: 0 16px 46px rgba(244, 201, 93, 0.08);
    }

    .pool-tiebreaker-card label {
      color: var(--wc-gold);
      font-size: 0.78rem;
      font-weight: 950;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .pool-tiebreaker-card .wc-input {
      border-color: rgba(244, 201, 93, 0.38);
      background: rgba(1, 16, 13, 0.62);
      color: var(--wc-ink);
      font-size: clamp(1.35rem, 4vw, 2rem);
      font-weight: 950;
    }

    .pool-tiebreaker-help {
      max-width: 780px;
      margin: 0;
      color: var(--wc-muted);
      font-size: 0.92rem;
      line-height: 1.45;
    }

    .pool-meter {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      margin: 14px 0 22px;
      color: var(--wc-muted);
      font-size: 0.8rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .pool-meter-bar {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
    }

    .pool-meter-bar span {
      display: block;
      width: var(--progress, 0%);
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--wc-green), var(--wc-gold), var(--wc-red));
      transition: width 180ms ease;
    }

    .pool-picker-grid {
      display: grid;
      grid-template-columns: minmax(270px, 0.95fr) minmax(320px, 1.05fr);
      gap: 14px;
      align-items: start;
    }

    .pool-rank-stack,
    .pool-team-grid,
    .pool-windex-list,
    .pool-matchup-list,
    .pool-review-grid {
      display: grid;
      gap: 10px;
    }

    .pool-rank-slot {
      display: grid;
      grid-template-columns: 42px 48px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-height: 68px;
      padding: 10px;
      border: 1px solid var(--wc-line);
      border-radius: var(--wc-radius);
      background: rgba(255, 255, 255, 0.04);
    }

    .pool-rank-slot.is-draggable {
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    .pool-rank-slot.is-dragging {
      opacity: 0.42;
    }

    .pool-rank-slot.is-drop-target {
      border-color: rgba(244, 201, 93, 0.7);
      background: rgba(244, 201, 93, 0.1);
    }

    .pool-slot-number {
      display: grid;
      place-items: center;
      width: 42px;
      aspect-ratio: 1;
      border: 1px solid rgba(244, 201, 93, 0.35);
      border-radius: 999px;
      color: var(--wc-gold);
      font-weight: 950;
    }

    .pool-slot-empty {
      color: var(--wc-faint);
      font-weight: 850;
    }

    .pool-team-main {
      min-width: 0;
    }

    .pool-team-main strong {
      display: block;
      overflow: hidden;
      color: var(--wc-ink);
      font-size: 1rem;
      font-weight: 950;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pool-team-main span {
      display: block;
      margin-top: 3px;
      color: var(--wc-muted);
      font-size: 0.78rem;
      font-weight: 850;
    }

    .pool-drag-handle {
      display: grid;
      place-items: center;
      width: 34px;
      height: 42px;
      border: 1px solid var(--wc-line);
      border-radius: var(--wc-radius);
      background: rgba(255, 255, 255, 0.04);
      color: var(--wc-muted);
      font-size: 1.05rem;
      font-weight: 950;
      line-height: 1;
    }

    .pool-drag-ghost {
      position: fixed;
      z-index: 80;
      width: min(540px, calc(100vw - 28px));
      pointer-events: none;
      opacity: 0.94;
      transform: translate(-50%, -50%) scale(1.02);
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.34);
    }

    .pool-team-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .pool-team-button {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      min-height: 76px;
      padding: 10px;
      border: 1px solid var(--wc-line);
      border-radius: var(--wc-radius);
      background: rgba(255, 255, 255, 0.055);
      color: var(--wc-ink);
      cursor: pointer;
      font: inherit;
      text-align: left;
    }

    .pool-team-button:active {
      transform: translateY(1px);
    }

    .pool-flag {
      width: 48px;
      aspect-ratio: 3 / 2;
      overflow: hidden;
      border: 1px solid rgba(247, 244, 235, 0.2);
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 9px 20px rgba(0, 0, 0, 0.16);
    }

    .pool-flag img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .pool-meta-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .pool-mini-stat {
      padding: 12px;
      border: 1px solid var(--wc-line);
      border-radius: var(--wc-radius);
      background: rgba(255, 255, 255, 0.04);
    }

    .pool-mini-stat strong {
      display: block;
      font-size: 1.2rem;
      line-height: 1;
    }

    .pool-mini-stat span {
      display: block;
      margin-top: 6px;
      color: var(--wc-muted);
      font-size: 0.7rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .pool-fixtures {
      margin-top: 14px;
    }

    .pool-fixtures h3,
    .pool-review-section h3 {
      margin: 0 0 10px;
      font-size: 1rem;
    }

    .pool-group-insight-kpis {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin: 0 0 12px;
      color: var(--wc-muted);
      font-size: 0.84rem;
      font-weight: 950;
    }

    .pool-windex-row {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 10px 0;
      border-top: 1px solid var(--wc-line);
    }

    .pool-windex-row strong {
      display: block;
      color: var(--wc-ink);
      font-size: 1.08rem;
      line-height: 1.1;
    }

    .pool-windex-score {
      color: var(--wc-ink);
      font-size: 1.05rem;
      font-weight: 950;
      font-variant-numeric: tabular-nums;
    }

    .pool-path-pill {
      display: inline-flex;
      width: fit-content;
      margin-top: 6px;
      padding: 4px 8px;
      border-radius: 999px;
      color: #06100d;
      font-size: 0.64rem;
      font-weight: 950;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .pool-path-pill.favorite {
      background: #2f8f57;
      color: #eefbf0;
    }

    .pool-path-pill.runner-up {
      background: #62be75;
    }

    .pool-path-pill.third {
      background: #c8873d;
    }

    .pool-path-pill.last {
      background: #bd4a45;
      color: #fff3ee;
    }

    .pool-matchup-list {
      margin-top: 14px;
    }

    .pool-fixture,
    .pool-matchup-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      padding: 10px 0;
      border-top: 1px solid var(--wc-line);
      color: rgba(247, 244, 235, 0.86);
      font-size: 0.88rem;
      font-weight: 850;
    }

    .pool-matchup-row {
      padding: 8px 0;
      font-size: 0.9rem;
    }

    .pool-matchup-row strong {
      color: var(--wc-ink);
      font-variant-numeric: tabular-nums;
    }

    .pool-fixture small {
      color: var(--wc-faint);
      font-size: 0.74rem;
      font-weight: 800;
    }

    .pool-bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      z-index: 12;
      display: grid;
      grid-template-columns: minmax(86px, auto) minmax(86px, auto) minmax(128px, 1fr);
      gap: 10px;
      width: min(100% - 24px, 720px);
      padding: 12px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      border: 1px solid var(--wc-line);
      border-bottom: 0;
      border-radius: 14px 14px 0 0;
      background: rgba(7, 19, 15, 0.88);
      box-shadow: 0 -18px 70px rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(18px);
      transform: translateX(-50%);
    }

    .pool-bottom-nav.has-review {
      grid-template-columns: minmax(74px, auto) minmax(74px, auto) minmax(128px, 1fr) minmax(116px, auto);
      width: min(100% - 24px, 860px);
    }

    .pool-review-jump {
      border: 1px solid rgba(244, 201, 93, 0.36);
      background: rgba(244, 201, 93, 0.94);
      color: #07130f;
    }

    .pool-bracket-board {
      position: relative;
      overflow-x: auto;
      padding: 16px;
      border: 1px solid var(--wc-line);
      border-radius: var(--wc-radius);
      background:
        radial-gradient(circle at 50% 5%, rgba(244, 201, 93, 0.14), transparent 28%),
        rgba(3, 10, 8, 0.48);
      box-shadow: var(--wc-shadow);
    }

    .pool-bracket-title {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      color: var(--wc-muted);
      font-size: 0.74rem;
      font-weight: 950;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .pool-bracket-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(590px, 1fr));
      gap: 14px;
      min-width: 1200px;
    }

    .pool-bracket-quad {
      display: grid;
      grid-template-columns: minmax(300px, 1.2fr) minmax(62px, 0.24fr) minmax(58px, 0.2fr) minmax(54px, 0.18fr);
      gap: 12px;
      align-items: stretch;
      min-height: 620px;
      padding: 14px;
      border: 1px solid var(--wc-line);
      border-radius: var(--wc-radius);
      background: rgba(255, 255, 255, 0.04);
    }

    .pool-bracket-quad.is-reverse {
      grid-template-columns: minmax(54px, 0.18fr) minmax(58px, 0.2fr) minmax(62px, 0.24fr) minmax(300px, 1.2fr);
    }

    .pool-round-stack {
      display: grid;
      align-items: center;
      min-height: 100%;
    }

    .pool-r32-stack {
      gap: 10px;
      grid-template-rows: repeat(4, minmax(0, 1fr));
    }

    .pool-r16-stack {
      gap: 10px;
      grid-template-rows: repeat(4, minmax(0, 1fr));
    }

    .pool-qf-stack {
      gap: 10px;
      grid-template-rows: repeat(2, minmax(0, 1fr));
    }

    .pool-sf-stack {
      grid-template-rows: 1fr;
    }

    .pool-bracket-slot {
      display: grid;
      place-items: center;
      justify-self: center;
      width: max-content;
      min-width: 42px;
      min-height: 30px;
      padding: 0 10px;
      border: 1px solid rgba(244, 201, 93, 0.22);
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(36, 180, 126, 0.16), rgba(244, 201, 93, 0.08));
      color: rgba(247, 244, 235, 0.46);
      font-size: 0.64rem;
      font-weight: 950;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .pool-match-seed {
      align-self: center;
      padding: 8px;
      border: 1px solid var(--wc-line);
      border-radius: var(--wc-radius);
      background: rgba(7, 19, 15, 0.72);
    }

    .pool-match-label {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 7px;
      color: var(--wc-faint);
      font-size: 0.68rem;
      font-weight: 950;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .pool-bracket-team {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      min-height: 38px;
      padding: 5px 7px;
      border: 1px solid rgba(247, 244, 235, 0.12);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.055);
    }

    .pool-bracket-team + .pool-bracket-team {
      margin-top: 5px;
    }

    .pool-bracket-team .pool-flag {
      width: 34px;
      border-radius: 4px;
    }

    .pool-bracket-team strong {
      display: block;
      overflow: hidden;
      color: var(--wc-ink);
      font-size: 0.82rem;
      font-weight: 950;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pool-bracket-team span {
      display: block;
      color: var(--wc-muted);
      font-size: 0.66rem;
      font-weight: 850;
    }

    .pool-review-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .pool-review-card {
      padding: 14px;
      border: 1px solid var(--wc-line);
      border-radius: var(--wc-radius);
      background: rgba(255, 255, 255, 0.045);
    }

    .pool-review-card h3 {
      margin: 0 0 9px;
      font-size: 1rem;
    }

    .pool-review-card ol {
      display: grid;
      gap: 7px;
      margin: 0;
      padding-left: 20px;
      color: rgba(247, 244, 235, 0.9);
      font-weight: 850;
    }

    .pool-toast {
      position: fixed;
      left: 50%;
      bottom: 86px;
      z-index: 24;
      padding: 11px 14px;
      border: 1px solid rgba(36, 180, 126, 0.42);
      border-radius: 999px;
      background: rgba(13, 29, 24, 0.94);
      color: var(--wc-ink);
      font-size: 0.86rem;
      font-weight: 900;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 10px);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .pool-toast.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 760px) {
      .pool-shell {
        padding-top: 18px;
      }

      .pool-hero {
        grid-template-columns: 1fr;
      }

      .pool-steps,
      .pool-rules,
      .pool-picker-grid,
      .pool-meta-grid,
      .pool-review-grid {
        grid-template-columns: 1fr;
      }

      .pool-team-grid {
        grid-template-columns: 1fr;
      }

      .pool-rank-slot {
        min-height: 62px;
      }

      .pool-bottom-nav {
        width: 100%;
        border-right: 0;
        border-left: 0;
        border-radius: 12px 12px 0 0;
      }

      .pool-bottom-nav.has-review {
        grid-template-columns: 0.7fr 0.7fr 1.2fr 1fr;
      }

      .pool-bracket-board {
        overflow-x: visible;
      }

      .pool-bracket-grid {
        grid-template-columns: 1fr;
        min-width: 0;
      }

      .pool-bracket-quad,
      .pool-bracket-quad.is-reverse {
        grid-template-columns: 1fr;
        min-height: 0;
      }

      .pool-bracket-quad.is-reverse .pool-r32-stack {
        grid-row: 1;
      }

      .pool-r32-stack,
      .pool-r16-stack,
      .pool-qf-stack,
      .pool-sf-stack {
        grid-template-rows: none;
      }

      .pool-r16-stack {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .pool-qf-stack,
      .pool-sf-stack {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="wc-shell pool-shell">
    <header class="wc-topbar">
      <a class="wc-brand" href="../">Warren's World Cup Pool</a>
      <nav class="wc-nav" aria-label="World Cup sections">
        <a href="./" aria-current="page">Pool</a>
        <a class="wc-nav-hidden" href="../meta/" aria-hidden="true" tabindex="-1">Meta</a>
        <a href="../fixtures/">Fixtures</a>
        <a href="../rankings-odds/">W-Index</a>
        <a href="../groups/">Groups</a>
        <a href="../scoreboard/">Scoreboard</a>
        <a href="../simulation/">Simulator</a>
        <a href="../admin/">Admin</a>
      </nav>
    </header>

    <div id="pool-app" aria-live="polite"></div>
  </main>
  <div class="pool-toast" id="pool-toast" role="status"></div>

  <script src="../archive/world-cup-1/bracket_lookup.js"></script>
  <script type="module">
    import { groups, teamsById } from "../data/world-cup-2026.js";
    import { W_INDEX_URL as W_INDEX_CSV_URL, fetchWithTimeout, wIndexBaselineRows } from "../data/w-index-baseline.js";

    const GROUP_IDS = "ABCDEFGHIJKL".split("");
    const app = document.getElementById("pool-app");
    const toast = document.getElementById("pool-toast");

    const state = {
      step: "welcome",
      activeGroupIndex: 0,
      entry: { bracketName: "", venmo: "", email: "" },
      tiebreakers: { totalGroupGoals: "180" },

    const teamAliases = buildTeamAliases();
    let toastTimer;

    function normalizeName(value) {
      return String(value || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]+/gi, " ")
        .trim()
        .toLowerCase();
    }

    function buildTeamAliases() {
      const aliases = new Map();
      Object.values(teamsById).forEach((team) => {
        [team.id, team.name, team.shortName].filter(Boolean).forEach((name) => {
          aliases.set(normalizeName(name), team.id);
        });
      });

      [
        ["USA", "USA"],
        ["United States", "USA"],
        ["USMNT", "USA"],
        ["South Korea", "KOR"],
        ["Korea Republic", "KOR"],
        ["Turkey", "TUR"],
        ["Turkiye", "TUR"],
        ["Türkiye", "TUR"],
        ["Iran", "IRN"],
        ["IR Iran", "IRN"],
        ["Ivory Coast", "CIV"],
        ["Cote d'Ivoire", "CIV"],
        ["Côte d'Ivoire", "CIV"],
        ["Cape Verde", "CPV"],
        ["Cabo Verde", "CPV"],
        ["Curacao", "CUW"],
        ["Curaçao", "CUW"],
        ["DR Congo", "COD"],
        ["Congo DR", "COD"],
        ["Democratic Republic of Congo", "COD"],
        ["Czech Republic", "CZE"],
        ["Czechia", "CZE"],
        ["England", "ENG"],
        ["Scotland", "SCO"],
      ].forEach(([name, id]) => aliases.set(normalizeName(name), id));
      return aliases;
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let field = "";
      let inQuotes = false;

      for (let index = 0; index < text.length; index += 1) {
        const char = text[index];
        const next = text[index + 1];

        if (char === '"' && inQuotes && next === '"') {
          field += '"';
          index += 1;
        } else if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === "," && !inQuotes) {
          row.push(field);
          field = "";
        } else if ((char === "\n" || char === "\r") && !inQuotes) {
          if (char === "\r" && next === "\n") index += 1;
          row.push(field);
          if (row.some((cell) => cell.trim() !== "")) rows.push(row);
          row = [];
          field = "";
        } else {
          field += char;
        }
      }

      row.push(field);
      if (row.some((cell) => cell.trim() !== "")) rows.push(row);
      return rows;
    }

    function applyWIndexRows(rows, sourceLabel) {
      wIndexByTeam.clear();
      rows.forEach((row) => {
        const teamId = teamAliases.get(normalizeName(row.Team));
        if (!teamId) return;
        wIndexByTeam.set(teamId, {
          score: Number(String(row["W-Index"] || "").replace("%", "")) || 0,
          rank: Number(row.Rank) || null,
        });
      });
      state.wIndexStatus = `${wIndexByTeam.size}/48 W-Index teams loaded from ${sourceLabel}`;
      render();
    }

    function csvRowsToWIndexObjects(rows) {
      const headers = rows.shift().map((header) => normalizeName(header));
      const teamIndex = headers.indexOf("team");
      const groupIndex = headers.indexOf("group");
      const scoreIndex = headers.indexOf("w index");
      const statusIndex = headers.indexOf("status");
      const rankIndex = headers.indexOf("rank");
      return rows.map((row) => ({
        Team: row[teamIndex],
        Group: row[groupIndex],
        "W-Index": row[scoreIndex],
        Status: row[statusIndex],
        Rank: row[rankIndex],
      }));
    }

    async function loadWIndex() {
      applyWIndexRows(wIndexBaselineRows, "local baseline");

      try {
        const response = await fetchWithTimeout(W_INDEX_CSV_URL);
        if (!response.ok) throw new Error(`W-Index request failed: ${response.status}`);
        applyWIndexRows(csvRowsToWIndexObjects(parseCsv(await response.text())), "live feed");
      } catch (error) {
        console.warn("Live W-Index refresh failed; using local baseline.", error);
        state.wIndexStatus = `${wIndexByTeam.size}/48 W-Index teams loaded from local baseline`;
        render();
      }

    function flagCode(team) {
      if (team.id === "ENG") return "gb-eng";

      const team = teamsById[teamId];
      const wIndex = wIndexByTeam.get(teamId) || {};
      return { ...team, wIndex: wIndex.score ?? null, wRank: wIndex.rank ?? null };

    function groupTeams(group) {
      return [...(groups[group] || [])]

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;",
      })[char]);

    function escapeAttr(value) {

    function normalizeVenmo(value) {

    function generateEntryCode() {
      const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      const bytes = new Uint8Array(8);
      crypto.getRandomValues(bytes);
      const raw = Array.from(bytes, (byte) => alphabet[byte % alphabet.length]).join("");
      return `WC26-${raw.slice(0, 4)}-${raw.slice(4)}`;
    }

    function generateUuid() {
      if (crypto.randomUUID) return crypto.randomUUID();
      const bytes = new Uint8Array(16);
      crypto.getRandomValues(bytes);
      bytes[6] = (bytes[6] & 0x0f) | 0x40;
      bytes[8] = (bytes[8] & 0x3f) | 0x80;
      const hex = Array.from(bytes, (byte) => byte.toString(16).padStart(2, "0"));
      return [
        hex.slice(0, 4).join(""),
        hex.slice(4, 6).join(""),
        hex.slice(6, 8).join(""),
        hex.slice(8, 10).join(""),
        hex.slice(10, 16).join(""),
      ].join("-");
    }

    function ensureEntryCode() {

    function renderGroupMeta(group) {

      const average = scores.length ? total / scores.length : 0;
      const top = rows[0];
      const matchupDiffs = [];

      rows.forEach((team, index) => {

      const button = document.getElementById("review-fab");
      if (!button) return;
      button.addEventListener("click", () => {
        ensureEntryCode();
        state.step = "review";
        render(true);
      });
    }

    function activePickArray(mode) {
      if (mode === "third") return state.thirdPicks;
      return state.groupPicks[GROUP_IDS[state.activeGroupIndex]];
    }

    function bindRankDrag(mode) {
      app.querySelectorAll(`[data-drag-mode="${mode}"]`).forEach((slot) => {
        slot.addEventListener("pointerdown", (event) => startRankDrag(event, mode, slot));
      });
    }

    function startRankDrag(event, mode, slot) {
      if (event.pointerType === "mouse" && event.button !== 0) return;
      const fromIndex = Number(slot.dataset.dragIndex);
      const picks = activePickArray(mode);
      if (!Number.isInteger(fromIndex) || !picks[fromIndex]) return;

      event.preventDefault();
      slot.setPointerCapture?.(event.pointerId);
      slot.classList.add("is-dragging");

      const ghost = slot.cloneNode(true);
      const rect = slot.getBoundingClientRect();
      ghost.classList.add("pool-drag-ghost");
      ghost.style.width = `${rect.width}px`;
      document.body.appendChild(ghost);

      let targetIndex = fromIndex;
      let targetSlot = slot;

      const moveGhost = (clientX, clientY) => {
        ghost.style.left = `${clientX}px`;
        ghost.style.top = `${clientY}px`;
      };

      const clearTarget = () => {
        if (targetSlot) targetSlot.classList.remove("is-drop-target");
      };

      const setTargetFromPoint = (clientX, clientY) => {
        ghost.hidden = true;
        const element = document.elementFromPoint(clientX, clientY);
        ghost.hidden = false;
        const nextTarget = element?.closest?.(`[data-drag-mode="${mode}"]`);
        if (!nextTarget) return;
        const nextIndex = Number(nextTarget.dataset.dragIndex);
        if (!Number.isInteger(nextIndex) || !picks[nextIndex]) return;
        clearTarget();
        targetSlot = nextTarget;
        targetIndex = nextIndex;
        targetSlot.classList.add("is-drop-target");
      };

      const onMove = (moveEvent) => {
        moveEvent.preventDefault();
        moveGhost(moveEvent.clientX, moveEvent.clientY);
        setTargetFromPoint(moveEvent.clientX, moveEvent.clientY);
      };

      const finish = (finishEvent) => {
        finishEvent.preventDefault();
        document.removeEventListener("pointermove", onMove);
        document.removeEventListener("pointerup", finish);
        document.removeEventListener("pointercancel", cancel);
        clearTarget();
        ghost.remove();
        slot.classList.remove("is-dragging");

        if (targetIndex !== fromIndex) {
          const [teamId] = picks.splice(fromIndex, 1);
          picks.splice(targetIndex, 0, teamId);
          render();
        }
      };

      const cancel = () => {
        document.removeEventListener("pointermove", onMove);
        document.removeEventListener("pointerup", finish);
        document.removeEventListener("pointercancel", cancel);
        clearTarget();
        ghost.remove();
        slot.classList.remove("is-dragging");
      };

      moveGhost(event.clientX, event.clientY);
      targetSlot.classList.add("is-drop-target");
      document.addEventListener("pointermove", onMove, { passive: false });
      document.addEventListener("pointerup", finish, { passive: false });
      document.addEventListener("pointercancel", cancel);
    }

    function renderReview() {
      const submitStatusClass = state.submitError ? "is-error" : state.submitted ? "is-success" : "";
      app.innerHTML = `
        <section class="pool-hero">
          <div>
            <div class="wc-eyebrow">Entry Review</div>
            <h1 class="pool-title">Entry ready.</h1>
            <p class="pool-copy">${escapeHtml(state.entry.bracketName)} · ${escapeHtml(state.entry.venmo)} · ${escapeHtml(state.entry.email)} · ${state.entryId}</p>
          </div>
          <span class="wc-pill">Group play only</span>
        </section>

        <section class="pool-panel pool-card-pad pool-review-section">
          <h3>Third-place advancing order</h3>
          <div class="pool-rank-stack">
            ${state.thirdPicks.map((teamId, index) => renderRankSlot(index, teamId, "third")).join("")}
          </div>
          <div class="wc-field pool-tiebreaker-card">
            <label for="total-group-goals">Tiebreaker: total group-play goals</label>
            <input class="wc-input" id="total-group-goals" type="number" inputmode="numeric" min="1" max="300" placeholder="Suggested: 180" value="${escapeAttr(state.tiebreakers.totalGroupGoals)}" ${state.submitted ? "disabled" : ""} required>
            <p class="pool-tiebreaker-help">Suggested baseline: 180 goals, which is 2.5 total goals per game across 72 group-stage matches. Perfect groups are calculated from your picks; this number wins by closest absolute difference to the real group-play goal total.</p>
          </div>
          ${state.submitStatus || state.submitError ? `<div class="pool-submit-status ${submitStatusClass}">${escapeHtml(state.submitError || state.submitStatus)}</div>` : ""}
          <div class="pool-actions">
            <button class="wc-button" type="button" id="submit-entry" ${state.submitting || state.submitted ? "disabled" : ""}>${state.submitting ? "Submitting..." : state.submitted ? "Submitted" : "Submit Entry"}</button>
            <button class="wc-button" type="button" id="copy-csv">Copy CSV</button>
            <button class="wc-button secondary" type="button" id="export-csv">Export CSV</button>
            ${state.submitted ? "" : `<button class="wc-button secondary" type="button" id="edit-entry">Edit Picks</button>`}
          </div>
        </section>

        <section class="wc-section">
          <div class="wc-section-header">
            <div>
              <h2>Predicted Round of 32</h2>
              <p>Generated from your group standings and top-eight third-place order.</p>
            </div>
            <span class="wc-pill">Third key ${thirdPlaceKey()}</span>
          </div>
          ${renderBracketPreview()}
        </section>

        <section class="wc-section">
          <div class="wc-section-header">
            <div>
              <h2>Group Picks</h2>
              <p>Final predicted standings for all 12 groups.</p>
            </div>
          </div>
          <div class="pool-review-grid">
            ${GROUP_IDS.map((group) => renderReviewGroup(group)).join("")}
          </div>
        </section>
      `;

      document.getElementById("total-group-goals").addEventListener("input", (event) => {
        state.tiebreakers.totalGroupGoals = event.target.value;
      });
      document.getElementById("submit-entry").addEventListener("click", submitEntry);
      document.getElementById("copy-csv").addEventListener("click", copyCsv);
      document.getElementById("export-csv").addEventListener("click", exportCsv);
      document.getElementById("edit-entry")?.addEventListener("click", () => {
          state.step = "groups";
          state.activeGroupIndex = 0;
          render(true);
        });
    }

    function thirdPlaceKey() {
      return state.thirdPicks.map((teamId) => teamData(teamId).group).sort().join("");
    }

    function teamFromSeed(rank, group) {
      const teamId = state.groupPicks[group]?.[rank - 1];
      return teamId ? teamData(teamId) : null;
    }

    function thirdFromGroup(group) {
      const teamId = state.thirdPicks.find((id) => teamData(id).group === group);
      return teamId ? teamData(teamId) : null;
    }

    function buildRoundOf32() {
      const mapping = window.BRACKET_LOOKUP?.[thirdPlaceKey()] || {};
      const thirdGroup = (seed) => seed?.replace("3", "") || "?";
      const thirdSeed = (group) => {
        const mappedGroup = thirdGroup(mapping[group]);
        return {
          group: mappedGroup,
          team: thirdFromGroup(mappedGroup),
          label: `3rd Group ${mappedGroup}`,
        };
      };

      return [
        { id: 73, a: { team: teamFromSeed(1, "E"), label: "Winner E" }, b: thirdSeed("E") },
        { id: 74, a: { team: teamFromSeed(1, "I"), label: "Winner I" }, b: thirdSeed("I") },
        { id: 75, a: { team: teamFromSeed(2, "A"), label: "Runner-up A" }, b: { team: teamFromSeed(2, "B"), label: "Runner-up B" } },
        { id: 76, a: { team: teamFromSeed(1, "F"), label: "Winner F" }, b: { team: teamFromSeed(2, "C"), label: "Runner-up C" } },
        { id: 77, a: { team: teamFromSeed(1, "C"), label: "Winner C" }, b: { team: teamFromSeed(2, "F"), label: "Runner-up F" } },
        { id: 78, a: { team: teamFromSeed(2, "E"), label: "Runner-up E" }, b: { team: teamFromSeed(2, "I"), label: "Runner-up I" } },
        { id: 79, a: { team: teamFromSeed(1, "A"), label: "Winner A" }, b: thirdSeed("A") },
        { id: 80, a: { team: teamFromSeed(1, "L"), label: "Winner L" }, b: thirdSeed("L") },
        { id: 81, a: { team: teamFromSeed(2, "K"), label: "Runner-up K" }, b: { team: teamFromSeed(2, "L"), label: "Runner-up L" } },
        { id: 82, a: { team: teamFromSeed(1, "H"), label: "Winner H" }, b: { team: teamFromSeed(2, "J"), label: "Runner-up J" } },
        { id: 83, a: { team: teamFromSeed(1, "D"), label: "Winner D" }, b: thirdSeed("D") },
        { id: 84, a: { team: teamFromSeed(1, "G"), label: "Winner G" }, b: thirdSeed("G") },
        { id: 85, a: { team: teamFromSeed(1, "B"), label: "Winner B" }, b: thirdSeed("B") },
        { id: 86, a: { team: teamFromSeed(1, "K"), label: "Winner K" }, b: thirdSeed("K") },
        { id: 87, a: { team: teamFromSeed(1, "J"), label: "Winner J" }, b: { team: teamFromSeed(2, "H"), label: "Runner-up H" } },
        { id: 88, a: { team: teamFromSeed(2, "D"), label: "Runner-up D" }, b: { team: teamFromSeed(2, "G"), label: "Runner-up G" } },
      ];
    }

    function renderBracketPreview() {
      const matches = buildRoundOf32();
      const quadrants = [
        matches.slice(0, 4),
        matches.slice(4, 8),
        matches.slice(8, 12),
        matches.slice(12, 16),
      ];

      return `
        <div class="pool-bracket-board">
          <div class="pool-bracket-title">
            <span>Round of 32</span>
            <span>Path to Final</span>
          </div>
          <div class="pool-bracket-grid">
            ${quadrants.map((quad, index) => renderBracketQuadrant(quad, index)).join("")}
          </div>
        </div>
      `;
    }

    function renderBracketQuadrant(matches, quadrantIndex) {
      const reverse = quadrantIndex % 2 === 1;
      const r32 = `<div class="pool-round-stack pool-r32-stack">${matches.map(renderBracketMatch).join("")}</div>`;
      const r16 = `
        <div class="pool-round-stack pool-r16-stack">
          ${Array.from({ length: 4 }, () => `<span class="pool-bracket-slot">R16</span>`).join("")}
        </div>
      `;
      const qf = `
        <div class="pool-round-stack pool-qf-stack">
          ${Array.from({ length: 2 }, () => `<span class="pool-bracket-slot">QF</span>`).join("")}
        </div>
      `;
      const sf = `
        <div class="pool-round-stack pool-sf-stack">
          <span class="pool-bracket-slot">SF</span>
        </div>
      `;

      return `<div class="pool-bracket-quad ${reverse ? "is-reverse" : ""}">${reverse ? `${sf}${qf}${r16}${r32}` : `${r32}${r16}${qf}${sf}`}</div>`;
    }

    function renderBracketMatch(match) {
      return `
        <article class="pool-match-seed">
          <div class="pool-match-label"><span>Match ${match.id}</span><span>R32</span></div>
          ${renderBracketTeam(match.a)}
          ${renderBracketTeam(match.b)}
        </article>
      `;
    }

    function renderBracketTeam(seed) {
      if (!seed.team) {
        return `
          <div class="pool-bracket-team">
            <span class="pool-flag"></span>
            <span><strong>TBD</strong><span>${escapeHtml(seed.label)}</span></span>
          </div>
        `;
      }

      return `
        <div class="pool-bracket-team">
          ${flagImage(seed.team, 160)}
          <span><strong>${escapeHtml(seed.team.name)}</strong><span>${escapeHtml(seed.label)}</span></span>
        </div>
      `;
    }

    function renderReviewGroup(group) {
      return `
        <article class="pool-review-card">
          <h3>Group ${group}</h3>
          <ol>
            ${state.groupPicks[group].map((teamId) => {
              const team = teamData(teamId);
              return `<li>${escapeHtml(team.name)} <span class="wc-small">${formatScore(team.wIndex)}</span></li>`;
            }).join("")}
          </ol>
        </article>
      `;
    }

    function totalGroupGoalsValue() {
      const value = Number(state.tiebreakers.totalGroupGoals);
      return Number.isInteger(value) && value > 0 ? value : null;
    }

    function validateSubmission() {
      if (!state.entry.bracketName || !state.entry.venmo || !state.entry.email) return "Bracket name, Venmo, and email are required.";
      if (!state.entry.email.includes("@")) return "Please enter a valid email address.";
      if (!isEntryComplete()) return "Complete all group and third-place picks before submitting.";
      if (!totalGroupGoalsValue()) return "Enter your total group-play goals tiebreaker.";
      return "";
    }

    function buildPickRows(entryId = null) {
      const rows = [];
      GROUP_IDS.forEach((group) => {
        state.groupPicks[group].forEach((teamId, index) => {
          const team = teamData(teamId);
          rows.push({
            ...(entryId ? { entry_id: entryId } : {}),
            section: "group_order",
            group_letter: group,
            rank: index + 1,
            team_id: team.id,
            team_name: team.name,
            w_index: Number.isFinite(team.wIndex) ? Number(team.wIndex.toFixed(1)) : null,
            w_index_rank: team.wRank || null,
          });
        });
      });

      state.thirdPicks.forEach((teamId, index) => {
        const team = teamData(teamId);
        rows.push({
          ...(entryId ? { entry_id: entryId } : {}),
          section: "third_place_order",
          group_letter: team.group,
          rank: index + 1,
          team_id: team.id,
          team_name: team.name,
          w_index: Number.isFinite(team.wIndex) ? Number(team.wIndex.toFixed(1)) : null,
          w_index_rank: team.wRank || null,
        });
      });
      return rows;
    }

    function buildSubmissionPayload() {
      return {
        version: "pool-entry-v1",
        submittedFrom: "world-cup/pool",
        entryCode: ensureEntryCode(),
        tiebreakers: {
          totalGroupGoals: totalGroupGoalsValue(),
        },
        groupPicks: state.groupPicks,
        thirdPicks: state.thirdPicks,
        thirdPlaceKey: thirdPlaceKey(),
        roundOf32: buildRoundOf32().map((match) => ({
          id: match.id,
          a: { teamId: match.a.team?.id || null, label: match.a.label },
          b: { teamId: match.b.team?.id || null, label: match.b.label },
        })),
        wIndexSnapshot: Object.fromEntries(Object.entries(teamsById).map(([teamId]) => {
          const data = wIndexByTeam.get(teamId) || {};
          return [teamId, { score: data.score ?? null, rank: data.rank ?? null }];
        })),
      };
    }

    async function loadSupabaseConfig() {
      supabaseConfigPromise ||= import("../data/supabase-config.js")
        .then((module) => module.supabaseConfig)
        .then((config) => {
          if (!config?.url || !config?.anonKey || config.url.includes("YOUR_PROJECT_REF")) {
            throw new Error("Supabase config is not filled in yet. Copy data/supabase-config.example.js to data/supabase-config.js and add your project URL and anon key.");
          }
          return config;
        });
      return supabaseConfigPromise;
    }

    async function supabaseRest(path, { method = "GET", body, prefer } = {}) {
      const config = await loadSupabaseConfig();
      const response = await fetch(`${config.url.replace(/\/$/, "")}/rest/v1/${path}`, {
        method,
        headers: {
          apikey: config.anonKey,
          Authorization: `Bearer ${config.anonKey}`,
          "Content-Type": "application/json",
          ...(prefer ? { Prefer: prefer } : {}),
        },
        body: body ? JSON.stringify(body) : undefined,
      });
      if (!response.ok) {
        const message = await response.text();
        throw new Error(message || `${response.status} ${response.statusText}`);
      }
      const text = await response.text();
      if (!text) return null;
      return JSON.parse(text);
    }

    async function submitEntry() {
      const validationError = validateSubmission();
      if (validationError) {
        state.submitError = validationError;
        state.submitStatus = "";
        render();
        return;
      }

      state.submitting = true;
      state.submitError = "";
      state.submitStatus = "Submitting entry...";
      render();

      try {
        let entryDbId = "";
        for (let attempt = 0; attempt < 3; attempt += 1) {
          ensureEntryCode();
          entryDbId = generateUuid();
          try {
            await supabaseRest("pool_entries", {
              method: "POST",
              prefer: "return=minimal",
              body: {
                id: entryDbId,
                entry_code: state.entryId,
                bracket_name: state.entry.bracketName,
                email: state.entry.email,
                venmo: state.entry.venmo,
                status: "pending_payment",
                paid: false,
                test_entry: false,
                user_agent: navigator.userAgent,
                source: "world-cup-pool",
                payload: buildSubmissionPayload(),
              },
            });
            break;
          } catch (error) {
            if (!String(error.message).includes("duplicate key") || attempt === 2) throw error;
            state.entryId = generateEntryCode();
          }
        }

        await supabaseRest("pool_entry_picks", {
          method: "POST",
          prefer: "return=minimal",
          body: buildPickRows(entryDbId),
        });

        state.submitted = true;
        state.submitStatus = `Submitted. Entry code: ${state.entryId}. Send $50 to @Warren-Konigsmark on Venmo and include your bracket name and email in the memo.`;
        showToast("Entry submitted");
      } catch (error) {
        console.warn(error);
        state.submitError = `Submission failed: ${error.message}. You can still copy or export CSV as a fallback.`;
      } finally {
        state.submitting = false;
        render();
      }
    }

    function csvEscape(value) {
      const stringValue = String(value ?? "");
      return /[",\n\r]/.test(stringValue) ? `"${stringValue.replace(/"/g, '""')}"` : stringValue;
    }

    function buildCsv() {
      const submittedAt = new Date().toISOString();
      ensureEntryCode();
      const headers = [
        "entry_id",
        "submitted_at",
        "bracket_name",
        "venmo",
        "email",
        "total_group_goals_tiebreaker",
        "section",
        "group",
        "rank",
        "team_id",
        "team_name",
        "w_index",
        "w_index_rank",
      ];

      const rows = [];
      GROUP_IDS.forEach((group) => {
        state.groupPicks[group].forEach((teamId, index) => {
          const team = teamData(teamId);
          rows.push([
            state.entryId,
            submittedAt,
            state.entry.bracketName,
            state.entry.venmo,
            state.entry.email,
            totalGroupGoalsValue() || "",
            "group_order",
            group,
            index + 1,
            team.id,
            team.name,
            Number.isFinite(team.wIndex) ? team.wIndex.toFixed(1) : "",
            team.wRank || "",
          ]);
        });
      });

      state.thirdPicks.forEach((teamId, index) => {
        const team = teamData(teamId);
        rows.push([
          state.entryId,
          submittedAt,
          state.entry.bracketName,
          state.entry.venmo,
          state.entry.email,
          totalGroupGoalsValue() || "",
          "third_place_order",
          team.group,
          index + 1,
          team.id,
          team.name,
          Number.isFinite(team.wIndex) ? team.wIndex.toFixed(1) : "",
          team.wRank || "",
        ]);
      });

      return [headers, ...rows].map((row) => row.map(csvEscape).join(",")).join("\n");
    }

    async function copyCsv() {
      ensureEntryCode();
      const csv = buildCsv();
      try {
        await navigator.clipboard.writeText(csv);
        showToast("CSV copied to clipboard");
      } catch (error) {
        console.warn(error);
        showToast("Clipboard blocked - exporting instead");
        exportCsv();
      }
    }

    function exportCsv() {
      ensureEntryCode();
      const csv = buildCsv();
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      const safeName = state.entry.bracketName.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "entry";
      link.href = url;
      link.download = `world-cup-2026-pool-${safeName}.csv`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      showToast("CSV export downloaded");
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("is-visible");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("is-visible"), 1700);
    }

    function hasUnsavedProgress() {
      if (state.submitted) return false;
      return Boolean(
        state.entry.bracketName ||
        state.entry.venmo ||
        state.entry.email ||
        GROUP_IDS.some((group) => state.groupPicks[group].length > 0) ||
        state.thirdPicks.length > 0
      );
    }

    function confirmLeave() {
      return window.confirm("Are you sure you want to leave? Your progress will be erased and you'll have to start from scratch.");
    }

    document.addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;
      const active = document.activeElement;
      if (active && ["INPUT", "TEXTAREA", "SELECT"].includes(active.tagName)) return;
      const advanceButton = document.querySelector("[data-advance]:not(:disabled)");
      if (advanceButton) {
        event.preventDefault();
        advanceButton.click();
      }
    });

    document.addEventListener("click", (event) => {
      const link = event.target.closest?.("a[href]");
      if (!link || !hasUnsavedProgress()) return;
      const href = link.getAttribute("href") || "";
      if (href.startsWith("#") || link.target === "_blank" || link.hasAttribute("download")) return;
      if (!confirmLeave()) event.preventDefault();
    });

    window.addEventListener("beforeunload", (event) => {
      if (!hasUnsavedProgress()) return;
      event.preventDefault();
      event.returnValue = "";
    });

    render();
    loadWIndex();
  </script>
  <script src="../shared/world-cup-audio.js" defer></script>
