<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database | Warren's Lab Chef</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo-group">
            <p>Warren's Lab</p>
            <h1><i class="fas fa-database text-accent"></i> Food DB</h1>
        </div>
        
        <div class="header-actions" style="display: flex; gap: 15px; align-items: center;">
            <div class="search-bar" style="border:none; padding:0; background:none; min-width: 250px;">
                <input type="text" id="dbSearch" placeholder="Search database..." oninput="renderTable()" style="background: rgba(0,0,0,0.05);">
                <i class="fas fa-search" style="left: 15px;"></i>
            </div>
            <a href="index.html" class="action-btn secondary" style="text-decoration: none;">
                <i class="fas fa-utensils"></i> Meal Planner
            </a>
        </div>
    </header>

    <main style="display:block; overflow-y:auto; padding:30px;">
        <div class="db-container card">
            <table class="db-table">
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Name & USDA Match</th>
                        <th>Category</th>
                        <th>Calories</th>
                        <th>Protein</th>
                        <th>Carbs</th>
                        <th>Fat</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="dbTableBody">
                    <!-- Populated by database.js -->
                </tbody>
            </table>
        </div>
    </main>

    <script src="database.js"></script>
</body>
</html>
